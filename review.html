<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NLFR — Redactie actueel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brand:#800000; --actueel:#2f6b3a; }
  * { box-sizing:border-box; }
  body { font-family:'Mulish',system-ui,sans-serif; line-height:1.7; color:#3a3330; background:#fdf9f8; margin:0; padding:12px; max-width:760px; margin:0 auto; }
  h1 { font-family:'Poppins',sans-serif; font-size:20px; color:var(--brand); margin:6px 0 2px; }
  .sub { color:#8a7f7c; font-size:13px; margin-bottom:14px; }
  h2 { font-family:'Poppins',sans-serif; font-size:15px; color:var(--brand); border-bottom:1px solid rgba(128,0,0,.12); padding-bottom:6px; margin:22px 0 12px; }

  .balk { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .balk .tel { font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; color:var(--brand); margin-right:auto; }
  .balk button { font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; border-radius:999px; padding:8px 14px; cursor:pointer; min-height:44px; border:1px solid rgba(128,0,0,.2); background:rgba(128,0,0,.06); color:var(--brand); }
  .balk button:hover { background:rgba(128,0,0,.12); }
  /* OPRUIMEN ZIT IN EEN LAATJE. "Wachtrij wissen" stond als volwaardige knop
     naast de tellers: even prominent als de knoppen die je de hele dag
     gebruikt, terwijl hij onomkeerbaar is en zelden nodig. Nu moet je hem
     eerst openklappen — één handeling extra, precies waar je die wilt. */
  /* Bewust GEEN <details>: het inklappen daarvan hangt af van de
     browserstijl, en dat is precies de laag die je niet kunt nameten. Hier
     doet één klasse het werk, met [hidden] als harde vangregel. */
  .opruimknop { flex:none; min-height:44px; padding:8px 14px; border-radius:999px; cursor:pointer;
    font-family:'Poppins',sans-serif; font-weight:600; font-size:13px;
    color:#8a7f7c; background:none; border:1px solid transparent; }
  .opruimknop:hover { border-color:rgba(128,0,0,.15); color:var(--brand); }
  .opruimknop[aria-expanded="true"] { color:var(--brand); border-color:rgba(128,0,0,.2); }
  .opruimlade { flex-basis:100%; margin-top:4px; padding:12px 14px; border:1px solid rgba(128,0,0,.25);
    border-radius:12px; background:rgba(128,0,0,.04); display:grid; gap:10px; max-width:520px; }
  .opruimlade[hidden] { display:none; }
  .opruimlade p { margin:0; font-size:13px; color:#6d6360; }
  .balk button.gevaar { border-color:rgba(128,0,0,.35); background:#fff; }

  .kaart { background:#fff; border:1px solid rgba(128,0,0,.14); border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 10px 30px -24px rgba(90,0,0,.5); }
  .kaart.pub { border-color:rgba(47,107,58,.4); background:rgba(47,107,58,.05); }
  .meta { font-size:12px; color:#8a7f7c; margin-bottom:8px; }
  .meta b { font-family:'Poppins',sans-serif; color:var(--actueel); font-weight:600; }
  .kop { font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; color:#3a3330; margin:2px 0 8px; }
  textarea { width:100%; min-height:180px; font-family:'Mulish',sans-serif; font-size:14.5px; line-height:1.7; color:#3a3330; border:1px solid rgba(128,0,0,.2); border-radius:10px; padding:10px 12px; resize:vertical; }
  textarea:focus { outline:none; border-color:rgba(128,0,0,.5); }
  .tekst { white-space:pre-wrap; font-size:14.5px; }
  .bronnen { margin-top:10px; font-size:12.5px; color:#6d6360; }
  .bronnen b { font-family:'Poppins',sans-serif; font-weight:600; color:var(--actueel); font-size:11.5px; display:block; margin-bottom:3px; }
  .bronnen a { display:block; padding:1px 0; color:var(--brand); text-decoration:none; }

  .pager { display:flex; align-items:center; gap:10px; margin:12px 0 4px; }
  .pager .nav { font-family:'Poppins',sans-serif; font-weight:600; font-size:14px; border-radius:9px; padding:9px 14px; border:1px solid rgba(128,0,0,.2); background:#fff; color:var(--brand); cursor:pointer; min-height:44px; }
  .pager .nav:disabled { opacity:.4; cursor:default; }
  .pager .pos { font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; color:#8a7f7c; margin:0 auto; }

  .knoppen { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button.actie { font-family:'Poppins',sans-serif; font-weight:600; font-size:14px; border-radius:9px; padding:10px 16px; border:none; cursor:pointer; min-height:44px; }
  .pubbtn { background:var(--actueel); color:#fff; }
  .pubbtn:hover { filter:brightness(1.08); }
  .wegbtn { background:rgba(128,0,0,.06); color:var(--brand); border:1px solid rgba(128,0,0,.2); }
  .wegbtn:hover { background:rgba(128,0,0,.12); }
  .bewaarbtn { background:rgba(128,0,0,.06); color:var(--brand); border:1px solid rgba(128,0,0,.2); }

  .kop-balk { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .kopknoppen { flex:none; display:flex; align-items:center; gap:8px; margin-top:4px; }
  .nb-link { flex:none; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; text-decoration:none; border-radius:999px; padding:8px 14px; min-height:44px; display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(47,107,58,.3); background:rgba(47,107,58,.08); color:var(--actueel); white-space:nowrap; }
  .nb-link:hover { background:rgba(47,107,58,.15); }
  /* Uitleg bij de tool: /uitleg, in een nieuw tabblad zodat het werk blijft
     staan. Rond en 44px, net als de andere tikdoelen. */
  .hulp-link { flex:none; width:44px; height:44px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:17px; text-decoration:none;
    border:1px solid rgba(128,0,0,.25); background:rgba(128,0,0,.05); color:var(--brand); }
  .hulp-link:hover { background:rgba(128,0,0,.12); }
  /* Geweigerde bronlinks: opvallend maar niet alarmerend rood-op-rood. */
  .weigeringen{ list-style:none; margin:0 0 18px; padding:0; display:grid; gap:8px; }
  .weigeringen li{ border:1px solid #e6c9c9; background:#fdf6f6; border-radius:6px; padding:10px 12px; }
  .weigeringen .uitg{ color:#7a6a6a; font-size:12px; }
  .weigeringen .wreden{ margin-top:4px; font-size:13px; color:#8a2b2b; }
  .weigeringen .wurl{ margin-top:2px; font-size:12px; color:#7a6a6a; word-break:break-all; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .melding { padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; }
  .fout { background:rgba(128,0,0,.08); color:var(--brand); border:1px solid rgba(128,0,0,.25); }
  /* Waarschuwing binnen een conceptkaart: te smalle bronbasis of een door de
     server geweigerde publicatie. */
  .waarschuwing { margin:10px 0 0; padding:10px 12px; border-radius:10px; font-size:13.5px;
    background:rgba(176,90,0,.09); border:1px solid rgba(176,90,0,.35); color:#8a4500; }
  .waarschuwing b { font-family:'Poppins',sans-serif; font-weight:700; display:block; margin-bottom:2px; }
  .geweigerd { background:rgba(128,0,0,.08); border-color:rgba(128,0,0,.3); color:var(--brand); }
  .outlets { font-family:'Poppins',sans-serif; font-weight:600; }
  /* Markering: de synthese leverde geen bruikbare bronopgave, dus onder dit
     concept staat nog de volledige clusterlijst (mogelijk met bijvangst). */
  .terugval { font-family:'Poppins',sans-serif; font-weight:600; color:#8a4500; }
  /* Keten-vraag bij een overheidsbericht (regelgevingsregister). */
  .keten { margin:10px 0 0; padding:10px 12px; border-radius:10px; font-size:13.5px;
           background:rgba(128,0,0,.05); border:1px solid rgba(128,0,0,.2); color:#4d4441; }
  .keten > b { font-family:'Poppins',sans-serif; font-weight:700; display:block; margin-bottom:6px; color:var(--brand); }
  .keten .ketenrij { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:4px 0; }
  .keten .ketenrij.tweede { border-top:1px dashed rgba(128,0,0,.18); margin-top:6px; padding-top:8px; }
  .keten .ketenknoppen { display:inline-flex; gap:6px; flex:none; }
  /* De ja/nee-knoppen bij een keten-vraag stonden op 36 px — de laatste die
     onder de maat zat. Zie test/reviewtool.test.mjs. */
  .keten button.actie { min-height:44px; padding:8px 16px; font-size:13.5px; }
  .keten .ketenbtn { background:var(--actueel); color:#fff; }
  .keten .ketennee { background:#fff; color:var(--brand); border:1px solid rgba(128,0,0,.25); }
  .keten.klaar { background:rgba(47,107,58,.07); border-color:rgba(47,107,58,.3); color:var(--actueel); font-weight:600; }
  .info { background:rgba(47,107,58,.08); color:var(--actueel); border:1px solid rgba(47,107,58,.25); }

  /* ---- Infofrankrijk: verwijzen (publiek) en nakijken (redactie) ---- */
  .ifblok { margin-top:12px; padding:10px 12px; border-radius:10px; border:1px solid rgba(47,107,58,.25); background:rgba(47,107,58,.04); }
  .ifblok > b { font-family:'Poppins',sans-serif; font-weight:700; font-size:12px; color:var(--actueel); display:block; margin-bottom:6px; }
  .ifgekozen { list-style:none; margin:0 0 8px; padding:0; display:grid; gap:5px; }
  .ifgekozen li { display:flex; gap:8px; align-items:center; background:#fff; border:1px solid rgba(47,107,58,.25); border-radius:8px; padding:6px 10px; font-size:13.5px; }
  .ifgekozen a { color:var(--brand); text-decoration:none; flex:1; }
  .ifgekozen button { flex:none; border:none; background:none; color:var(--brand); cursor:pointer; font-size:20px; line-height:1; min-width:44px; min-height:44px; }
  .ifzoekrij { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .ifzoekrij input { flex:1; min-width:180px; font-family:'Mulish',sans-serif; font-size:14px; padding:8px 10px; border:1px solid rgba(128,0,0,.2); border-radius:8px; }
  /* TIKDOELEN: 44px, dezelfde maat als button.actie hierboven. Deze tool wordt
     op een telefoon gebruikt; 32px-knopjes in een dichte lijst zijn daar niet
     betrouwbaar te raken — gemeten op 390px breed. */
  .ifknop { font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; border-radius:8px; padding:8px 14px; min-height:44px; cursor:pointer; border:1px solid rgba(47,107,58,.3); background:#fff; color:var(--actueel); }
  .ifknop.klein { min-height:44px; padding:6px 12px; font-size:13px; }
  .ifuitleg { font-size:12px; color:#8a7f7c; margin-bottom:8px; }
  .ifkandidaten { list-style:none; margin:0; padding:0; display:grid; gap:5px; }
  .ifkandidaten li { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#fff; border:1px solid rgba(128,0,0,.12); border-radius:8px; padding:6px 10px; }
  .ifkandidaten .ifdatum { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:#8a7f7c; flex:none; }
  .ifkandidaten .iftitel { flex:1; min-width:160px; font-size:13.5px; }
  .ifkandidaten .iftitel a { color:#3a3330; text-decoration:none; }
  .ifkandidaten .ifacties { display:flex; gap:8px; flex:none; margin-left:auto; }
  .ifkandidaten li.alverwezen { background:rgba(47,107,58,.07); }
  .nakijklijst { list-style:none; margin:0 0 18px; padding:0; display:grid; gap:8px; }
  .nakijklijst li { border:1px solid rgba(176,90,0,.3); background:rgba(176,90,0,.05); border-radius:8px; padding:10px 12px; }
  .nakijklijst .aanleiding { font-size:12.5px; color:#7a6a6a; margin-top:3px; }
  .nakijklijst .rij { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .nakijklijst .rij a { flex:1; min-width:180px; color:var(--brand); text-decoration:none; font-weight:600; }
  .leeg { color:#8a7f7c; font-size:14px; }
</style>
</head>
<body>
  <div class="kop-balk">
    <div>
      <h1>Redactie — Actueel</h1>
      <div class="sub">Concepten worden nooit vanzelf gepubliceerd en verlopen na 36 uur. Beoordeel ze één voor één; bewerk de tekst gerust vóór publicatie.</div>
    </div>
    <div class="kopknoppen">
      <a class="hulp-link" href="/uitleg" target="_blank" rel="noopener" title="Hoe werkt dit? Uitleg met schermen" aria-label="Uitleg over deze tool">?</a>
      <a id="nbLink" class="nb-link" href="/actueel" target="_blank" rel="noopener">Bekijk nieuwspagina ↗</a>
    </div>
  </div>
  <div id="melding"></div>
  <div id="inhoud"><div class="leeg">Laden…</div></div>

<script>
(function(){
  "use strict";
  // Bestemming van de previewknop rechtsboven: de nieuwspagina zelf, relatief
  // zodat hij op elke omgeving (preview-deploy, productie) meegaat. Opent in een
  // nieuw tabblad, zodat de reviewsessie niet verloren gaat.
  var PREVIEW_URL = "/actueel";

  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var nbEl = document.getElementById("nbLink");
  if (nbEl){ nbEl.href = PREVIEW_URL; }
  var meldingEl = document.getElementById("melding");
  var inhoudEl = document.getElementById("inhoud");
  var state = { concepten: [], index: 0, duplicaten: 0, totaal: 0, publicaties: [], overheid: [], bronUrlWeigeringen: [],
    // Infofrankrijk: gekozen verwijzingen per bericht-id, de auditlijst, wat er
    // bijna uit het 12-maandenvenster valt, en het geopende kandidatenpaneel
    // (hoogstens één tegelijk).
    verwijzingen: {}, nakijken: [], bijnaVerlopen: [], ifIndex: null, ifPaneel: null };

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function datum(iso){ try { return new Date(iso).toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } }
  function melding(tekst, soort){ meldingEl.innerHTML = tekst ? '<div class="melding '+(soort||"info")+'">'+esc(tekst)+'</div>' : ""; }

  function api(method, body){
    var url = "/api/review?token=" + encodeURIComponent(token);
    var opties = { method: method, headers: { "X-Review-Token": token } };
    if (body){ opties.headers["Content-Type"] = "application/json"; opties.body = JSON.stringify(body); }
    return fetch(url, opties).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, data: j }; }); });
  }

  // GET met extra querystring (de kandidatenlijst; zie ?deel=if in api/review.js).
  function apiGet(extra){
    var url = "/api/review?token=" + encodeURIComponent(token) + (extra || "");
    return fetch(url, { headers: { "X-Review-Token": token } })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, data: j }; }); });
  }

  function bronnenHtml(bronnen){
    if (!bronnen || !bronnen.length) return "";
    var perBron = {}, volgorde = [];
    bronnen.forEach(function(b){
      var naam = b.naam || b.url || "bron";
      if (!perBron[naam]){ perBron[naam] = []; volgorde.push(naam); }
      perBron[naam].push(b);
    });
    var rijen = volgorde.map(function(naam){
      var links = perBron[naam].map(function(b){
        return '<a href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(b.datum?datum(b.datum):"link")+'</a>';
      }).join(" · ");
      return '<div>'+esc(naam)+' — '+links+'</div>';
    }).join("");
    return '<div class="bronnen"><b>Bronnen</b>'+rijen+'</div>';
  }

  // Aantal ONAFHANKELIJKE outlets achter een concept (verschillende kranten én
  // verschillende koppen; wire-copy telt als één). De server rekent dit uit in
  // /api/review, ook voor oude concepten uit de opslag.
  function outletMeta(c){
    // Geen poort-uitslag meegekregen (oude serverversie)? Val terug op het
    // aantal bronlinks in plaats van een misleidend outletgetal te tonen.
    if (!c.poort) return '<b>'+(c.aantalBronnen||"?")+' bronnen</b>';
    var p = c.poort;
    if (!p.persconcept) return '<b>overheid/vereniging</b>';
    var n = (p.onafhankelijkeOutlets == null) ? "?" : p.onafhankelijkeOutlets;
    var namen = (p.outletNamen || []).join(", ");
    // Teller en namen komen van de GEFILTERDE bronnenlijst — precies wat de
    // lezer onder het artikel te zien krijgt.
    return '<b>'+n+' onafhankelijke outlet'+(n===1?"":"s")+'</b>'+(namen?' <span class="outlets">('+esc(namen)+')</span>':'')+
      (c.bronnenTerugval?' · <span class="terugval">bronnenlijst ongefilterd</span>':'');
  }

  // Een concept op precies het minimum (twee kranten) mag gepubliceerd worden,
  // maar het is de zwakste soort: één van de twee blijkt achteraf nog wel eens
  // dezelfde bron na te vertellen. Geen blokkade, wel een zichtbaar merkteken,
  // zodat je bij twijfel eerder "Weg" kiest. Drie of meer krijgt het niet.
  function smalleBasisHtml(c){
    var p = c.poort || {};
    if (!p.persconcept || p.publiceerbaar === false) return "";
    if (p.onafhankelijkeOutlets !== 2) return "";
    return '<div class="waarschuwing"><b>Smalle basis — twee kranten</b>'+
      'Dit verhaal wordt door precies twee onafhankelijke outlets gemeld'+
      ((p.outletNamen||[]).length ? ' ('+esc(p.outletNamen.join(", "))+')' : "")+
      '. Dat mag, maar het is de dunste onderbouwing die de huisregels toelaten. '+
      'Kijk bij twijfel of het tweede bericht niet gewoon het eerste navertelt.</div>';
  }

  // Waarschuwingsblok bij een te smalle bronbasis. Zo'n concept hoort door de
  // serverpoort niet meer publiceerbaar te zijn; de teller staat er sowieso.
  function outletWaarschuwing(c){
    var p = c.poort || {};
    if (!p.persconcept || p.publiceerbaar !== false) return "";
    if (p.code === "faits-divers"){
      return '<div class="waarschuwing geweigerd"><b>Publiceren geblokkeerd — faits divers</b>'+
        'Minstens één bronkop komt niet door de faits-divers-zeef (misdaad, vermissing, verdrinking). '+
        'Dit concept hoort niet op de feed.</div>';
    }
    var n = (p.onafhankelijkeOutlets == null) ? "?" : p.onafhankelijkeOutlets;
    return '<div class="waarschuwing geweigerd"><b>Publiceren geblokkeerd — één bron</b>'+
      'Dit concept steunt op '+esc(String(n))+' onafhankelijke outlet'+(n===1?"":"s")+
      ((p.outletNamen||[]).length?' ('+esc(p.outletNamen.join(", "))+')':"")+
      '. De huisregel eist er minstens twee: twee berichten van dezelfde krant — of twee kranten '+
      'die dezelfde persbureaukop overnemen — tellen samen als één bron.</div>';
  }

  // Gelijkenis met een ander openstaand concept of met een live artikel. De
  // server rekent (lib/gelijkenis.js); hier alleen tonen.
  function gelijkenisHtml(c){
    var g = c.gelijkenis || {};
    var uit = "";
    if (g.concept){
      uit += '<div class="waarschuwing"><b>Lijkt op concept</b>'+
        '“'+esc(g.concept.kop || "zonder kop")+'” — '+esc(uitleg(g.concept))+
        '. Publiceer er één, of scherp het onderscheid aan.</div>';
    }
    if (g.publicatie){
      uit += '<div class="waarschuwing"><b>Vergelijkbaar verhaal staat live</b>'+
        '“'+esc(g.publicatie.kop || "zonder kop")+'”, sinds '+esc(datum(g.publicatie.gepubliceerdOp))+
        ' — '+esc(uitleg(g.publicatie))+
        '. Vervolg op doorlopend nieuws mag; anders niet nogmaals publiceren.</div>';
    }
    return uit;
  }
  function uitleg(g){
    return g.reden === "bron-urls"
      ? g.gedeeldeUrls+" dezelfde bronlinks"
      : Math.round((g.jaccard||0)*100)+"% woordoverlap";
  }

  // Zacht signaal: een medium bij naam in de lopende tekst. De bronnenlijst is
  // de attributie; de redacteur haalt de naam er hier direct uit.
  function outletnaamHtml(c){
    var namen = (c.poort && c.poort.outletnamenInTekst) || [];
    if (!namen.length) return "";
    return '<div class="waarschuwing"><b>Medium bij naam in de tekst</b>'+
      esc(namen.join(", "))+' — de bronnenlijst onder het artikel is de attributie. '+
      'Vervang dit door een generieke formulering ("volgens meerdere Franse media") en bewaar de tekst.</div>';
  }

  // ---- Keten-vraag bij een overheidsbericht ------------------------------
  // De cron zet een vraagvlag als een nieuw bericht lijkt te horen bij iets dat
  // er al is. Twee smaken, in precies deze bewoording; bij twijfel tonen we ze
  // allebei. De server beslist wat er daarna verandert (actie "keten").
  function ketenRegel(soort, v){
    var rub = esc(v.doelRubriek || "");
    var oud = esc(v.doelTitel || "eerder bericht");
    if (soort === "vervangen"){
      return 'Dit lijkt <b>'+oud+'</b> uit rubriek <b>'+rub+'</b> te vervangen. Zal ik het vervangen?';
    }
    return 'Dit lijkt een aanvulling op <b>'+oud+'</b> uit rubriek <b>'+rub+'</b>. '+
      'Zal ik het toevoegen naast <b>'+oud+'</b>?';
  }
  function ketenKnoppen(soort){
    return '<span class="ketenknoppen">'+
      '<button type="button" class="actie ketenbtn" data-keten="ja" data-soort="'+soort+'">Ja</button>'+
      '<button type="button" class="actie ketennee" data-keten="nee" data-soort="'+soort+'">Nee</button>'+
    '</span>';
  }
  function ketenHtml(o){
    if (o.ketenAntwoord){
      var a = o.ketenAntwoord;
      return '<div class="keten klaar">'+(a.antwoord==="ja"
        ? (a.soort==="vervangen" ? "Verwerkt: vervangt het eerdere bericht." : "Verwerkt: toegevoegd naast het eerdere bericht.")
        : "Geen keten gelegd.")+'</div>';
    }
    var v = o.ketenVraag;
    if (!v) return "";
    // De meest waarschijnlijke smaak eerst; bij twijfel de andere eronder.
    var eerste = v.soort === "aanvulling" ? "aanvulling" : "vervangen";
    var tweede = eerste === "vervangen" ? "aanvulling" : "vervangen";
    var uit = '<div class="keten"><b>Hoort dit bij een eerder bericht?</b>'+
      '<div class="ketenrij">'+ketenRegel(eerste, v)+' '+ketenKnoppen(eerste)+'</div>';
    if (v.beideOpties){
      uit += '<div class="ketenrij tweede">'+ketenRegel(tweede, v)+' '+ketenKnoppen(tweede)+'</div>';
    }
    return uit + '</div>';
  }

  // Dwarsverband met de primaire bron: staat er over dit onderwerp al een
  // overheidsbericht? Signalering, geen blokkade — de redacteur kiest tussen
  // "Weg" (de primaire bron dekt het al) en publiceren (de pers voegt iets toe).
  function primaireBronHtml(c){
    var p = c.primaireBron;
    if (!p) return "";
    return '<div class="waarschuwing"><b>Primaire bron staat al live</b>'+
      'Over dit onderwerp staat al een overheidsbericht live: '+
      esc(p.titel || "zonder titel")+' ('+esc(p.bron || "overheid")+'). '+
      'Voegt de perssynthese hier echt iets aan toe? Zo niet: "Weg".</div>';
  }

  // ---- Infofrankrijk: verwijzen en nakijken ---------------------------------
  // ÉÉN VRAAG, TWEE UITGANGEN. "Verwijzen" zet een link onder het bericht op de
  // nieuwspagina (de lezer ziet die). "Nakijken" zet het IF-artikel op een
  // takenlijst hier (de lezer ziet daar niets van) — want een nieuwe
  // aankondiging van Bercy kan betekenen dat een fiscaal artikel op
  // Infofrankrijk niet meer klopt.
  //
  // NIETS GEBEURT VANZELF. De lijst is een voorstel: hij is gefilterd op de
  // categorieën die bij het thema van dit bericht horen én op de twaalf
  // maanden-regel, en gesorteerd op oudste wijziging eerst. Klik je niets aan,
  // dan komt er geen verwijzing.
  function ifDatum(iso){
    try { return new Date(iso).toISOString().slice(0,10); } catch(e){ return "?"; }
  }

  function gekozenHtml(id){
    var items = state.verwijzingen[id] || [];
    if (!items.length) return "";
    return '<ul class="ifgekozen">'+items.map(function(v){
      return '<li><a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(v.titel||v.url)+'</a>'+
        '<button type="button" title="Verwijzing weghalen" data-if-af="'+esc(String(v.ifId))+'">×</button></li>';
    }).join("")+'</ul>';
  }

  function kandidaatHtml(k, id){
    return '<li'+(k.gekozen?' class="alverwezen"':'')+'>'+
      '<span class="ifdatum">'+esc(ifDatum(k.modified))+'</span>'+
      '<span class="iftitel"><a href="'+esc(k.url)+'" target="_blank" rel="noopener">'+esc(k.titel)+'</a></span>'+
      '<span class="ifacties">'+
        (k.gekozen
          ? '<button type="button" class="ifknop klein" data-if-af="'+esc(String(k.ifId))+'">Verwijzing weg</button>'
          : '<button type="button" class="ifknop klein" data-if-verwijs="'+esc(String(k.ifId))+'">Verwijzen</button>')+
        '<button type="button" class="ifknop klein" data-if-nakijk="'+esc(String(k.ifId))+'">Nakijken</button>'+
      '</span>'+
    '</li>';
  }

  function paneelHtml(id){
    var p = state.ifPaneel;
    if (!p || p.id !== id) {
      return '<button type="button" class="ifknop" data-if-open="'+esc(id)+'">Infofrankrijk erbij zoeken</button>';
    }
    var uit = '<div class="ifzoekrij">'+
      '<input type="search" id="ifZoek" placeholder="Zoek in alle Infofrankrijk-artikelen…" value="'+esc(p.zoek||"")+'">'+
      '<button type="button" class="ifknop" id="ifZoekBtn">Zoek</button>'+
      '<button type="button" class="ifknop" data-if-dicht="1">Sluiten</button>'+
    '</div>';
    if (p.laden) return uit + '<div class="ifuitleg">Laden…</div>';
    if (p.fout) return uit + '<div class="melding fout">'+esc(p.fout)+'</div>';
    var d = p.data || {};
    var lijst = d.kandidaten || [];
    var cats = (d.categorieen||[]).map(function(c){ return c.naam; }).join(", ");
    uit += '<div class="ifuitleg">'+
      (p.zoek
        ? 'Zoekresultaat in alle artikelen (het categoriefilter staat uit; de '+esc(String(d.maanden||12))+'-maandenregel geldt wel).'
        : (cats
            ? 'Categorieën bij thema <b>'+esc(d.bericht&&d.bericht.thema||"?")+'</b>: '+esc(cats)+'.'
            : 'Voor thema <b>'+esc(d.bericht&&d.bericht.thema||"?")+'</b> staan er nog geen categorieën in de koppeltabel (lib/config.js). Gebruik het zoekveld.'))+
      ' Oudste wijziging bovenaan. '+esc(String(d.totaal||0))+' artikel'+((d.totaal===1)?"":"en")+'.</div>';
    if (!lijst.length) return uit + '<div class="leeg">Geen kandidaten.</div>';
    var standaard = d.standaardAantal || 10;
    var tonen = p.alles ? lijst : lijst.slice(0, standaard);
    uit += '<ul class="ifkandidaten">'+tonen.map(function(k){ return kandidaatHtml(k, id); }).join("")+'</ul>';
    if (!p.alles && lijst.length > tonen.length){
      uit += '<div style="margin-top:8px"><button type="button" class="ifknop klein" data-if-alles="1">Toon alle '+lijst.length+'</button></div>';
    }
    return uit;
  }

  function ifBlokHtml(id){
    return '<div class="ifblok"><b>Infofrankrijk</b>'+gekozenHtml(id)+paneelHtml(id)+'</div>';
  }

  // De auditkant: IF-artikelen die de redactie zelf op de lijst heeft gezet,
  // oudste wijziging bovenaan. Verdwijnt alleen door "Klaar" — niet vanzelf.
  function nakijkenHtml(){
    var lijst = state.nakijken || [];
    var uit = '<h2>Nakijken op Infofrankrijk ('+lijst.length+')</h2>';
    if (!lijst.length){
      return uit + '<div class="leeg">Niets op de lijst. Zet een artikel erop met "Nakijken" onder een bericht.</div>';
    }
    uit += '<ul class="nakijklijst">'+lijst.map(function(n){
      var aanleidingen = (n.aanleidingen||[]).map(function(a){
        return esc((a.kop||"bericht")+(a.bron?" ("+a.bron+")":""));
      }).join(" · ");
      return '<li><div class="rij">'+
        '<span class="ifdatum">'+esc(ifDatum(n.modified))+'</span>'+
        '<a href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.titel)+'</a>'+
        '<button type="button" class="ifknop klein" data-nakijk-klaar="'+esc(String(n.ifId))+'">Klaar</button>'+
      '</div>'+(aanleidingen?'<div class="aanleiding">Aanleiding: '+aanleidingen+'</div>':'')+'</li>';
    }).join("")+'</ul>';
    return uit;
  }

  // De 12-maandengrens is stil: wat er bijna uit valt, kun je nu nog bijwerken.
  function bijnaVerlopenHtml(){
    var lijst = state.bijnaVerlopen || [];
    if (!lijst.length) return "";
    var top = lijst.slice(0, 10);
    return '<h2>Bijna niet meer verwijsbaar ('+lijst.length+')</h2>'+
      '<div class="ifuitleg">Deze artikelen vallen binnenkort buiten de twaalf maanden en verdwijnen dan uit de keuzelijsten hierboven. Werk ze bij, of laat ze gaan.</div>'+
      '<ul class="nakijklijst">'+top.map(function(a){
        return '<li><div class="rij"><span class="ifdatum">'+esc(ifDatum(a.modified))+'</span>'+
          '<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.titel)+'</a></div></li>';
      }).join("")+'</ul>'+
      (lijst.length > top.length ? '<div class="ifuitleg">… en nog '+(lijst.length-top.length)+'.</div>' : "");
  }

  // ---- Geweigerde bron-URL's -------------------------------------------------
  // Een bronlink die de validatie in lib/bronurl.js niet haalt (vreemde host,
  // leeg pad, asset-host) wordt op /actueel NIET klikbaar getoond. Zonder deze
  // sectie zou dat stil gebeuren — en juist dat maakte de storing waarbij
  // Infofrankrijk-items naar fonts.googleapis.com wezen zo lang onzichtbaar.
  function bronUrlWeigeringenHtml(){
    var w = state.bronUrlWeigeringen || [];
    if (!w.length) return "";
    var rijen = w.map(function(x){
      return '<li><b>'+esc(x.titel||"(zonder titel)")+'</b>'+
        '<span class="uitg"> · '+esc(x.soort)+(x.bron?" · "+esc(x.bron):"")+(x.datum?" · "+esc(datum(x.datum)):"")+'</span>'+
        '<div class="wreden">'+esc(x.reden)+'</div>'+
        (x.url?'<div class="wurl">'+esc(x.url)+'</div>':'')+
      '</li>';
    }).join("");
    return '<h2>Geweigerde bronlinks ('+w.length+')</h2>'+
      '<div class="melding fout">Deze bronnen worden zonder klikbare link getoond. Er is niets verwijderd.</div>'+
      '<ul class="weigeringen">'+rijen+'</ul>';
  }

  function render(){
    var html = "";

    html += bronUrlWeigeringenHtml();

    // ---- Concepten: pager (één voor één) ----
    html += '<h2>Concepten</h2>';
    html += '<div class="balk"><span class="tel">'+state.concepten.length+' concept'+(state.concepten.length===1?"":"en")+
      (state.duplicaten?' · '+state.duplicaten+' duplicaten':"")+'</span>';
    if (state.duplicaten){ html += '<button id="ontdubbel">Ontdubbelen ('+state.duplicaten+')</button>'; }
    if (state.totaal){
      // Onomkeerbaar en zelden nodig: dus niet naast de dagelijkse knoppen,
      // maar achter een laatje dat je bewust openklapt.
      html += '<button type="button" class="opruimknop" id="opruimToggle" aria-expanded="false" aria-controls="opruimLade">Opruimen…</button>'+
        '<div class="opruimlade" id="opruimLade" hidden>'+
          '<p>Dit leegt de wachtrij met <b>'+state.totaal+' persconcept'+(state.totaal===1?"":"en")+'</b>. '+
          'Gepubliceerde artikelen, de overheidsberichten en de verenigingsitems blijven staan. Er is geen weg terug.</p>'+
          '<div><button id="wisAlles" class="gevaar">Wachtrij persconcepten wissen</button></div>'+
        '</div>';
    }
    html += '</div>';

    if (!state.concepten.length){
      html += '<div class="leeg">Geen concepten om te beoordelen. Nieuwe verschijnen zodra een verhaal door 2+ onafhankelijke bronnen wordt gemeld.</div>';
    } else {
      if (state.index >= state.concepten.length) state.index = state.concepten.length - 1;
      if (state.index < 0) state.index = 0;
      var c = state.concepten[state.index];
      html += '<div class="pager">'+
        '<button class="nav" id="vorige"'+(state.index<=0?" disabled":"")+'>‹ Vorige</button>'+
        '<span class="pos">'+(state.index+1)+' / '+state.concepten.length+'</span>'+
        '<button class="nav" id="volgende"'+(state.index>=state.concepten.length-1?" disabled":"")+'>Volgende ›</button>'+
      '</div>';
      html += '<div class="kaart" data-id="'+esc(c.id)+'">'+
        '<div class="meta">'+outletMeta(c)+' · '+(c.aantalBronnen||"?")+' bronlink'+((c.aantalBronnen===1)?"":"s")+
          ' · gemaakt '+esc(datum(c.aangemaaktOp))+' · model '+esc(c.model||"?")+(c.afgekapt?' · <span style="color:#b58b00">mogelijk afgekapt</span>':'')+'</div>'+
        (c.kop?'<div class="kop">'+esc(c.kop)+'</div>':'')+
        '<textarea>'+esc(c.tekst)+'</textarea>'+
        bronnenHtml(c.bronnen)+
        outletWaarschuwing(c)+
        smalleBasisHtml(c)+
        gelijkenisHtml(c)+
        primaireBronHtml(c)+
        outletnaamHtml(c)+
        '<div class="poortmelding"></div>'+
        '<div class="knoppen">'+
          '<button class="actie pubbtn" data-act="publiceer">Publiceer</button>'+
          '<button class="actie bewaarbtn" data-act="bewerk">Bewaar tekst</button>'+
          '<button class="actie wegbtn" data-act="weg">Weg</button>'+
        '</div></div>';
    }

    // ---- Gepubliceerd (pers) ----
    html += '<h2>Gepubliceerd — pers ('+(state.publicaties||[]).length+')</h2>';
    if (!(state.publicaties||[]).length){ html += '<div class="leeg">Nog niets gepubliceerd.</div>'; }
    (state.publicaties||[]).forEach(function(p){
      html += '<div class="kaart pub" data-id="'+esc(p.id)+'">'+
        '<div class="meta">gepubliceerd '+esc(datum(p.gepubliceerdOp))+(p.gearchiveerd?' · <b>in archief</b>':'')+'</div>'+
        (p.kop?'<div class="kop">'+esc(p.kop)+'</div>':'')+
        '<div class="tekst">'+esc(p.tekst)+'</div>'+
        bronnenHtml(p.bronnen)+
        ifBlokHtml(p.id)+
        '<div class="knoppen">'+
          (p.gearchiveerd?'':'<button class="actie bewaarbtn" data-act="archiveer">Toevoegen aan archief</button>')+
          '<button class="actie wegbtn" data-act="depubliceer">Van de site halen</button>'+
        '</div>'+
      '</div>';
    });

    // ---- Overheid (kill-switch) ----
    html += '<h2>Overheid — automatisch live ('+(state.overheid||[]).length+')</h2>';
    if (!(state.overheid||[]).length){ html += '<div class="leeg">Nog geen NL-overheidsberichten.</div>'; }
    (state.overheid||[]).forEach(function(o){
      html += '<div class="kaart" data-id="'+esc(o.id)+'">'+
        '<div class="meta"><b>'+esc(o.bron||"")+'</b> · '+esc(o.thema||"")+' · '+esc(datum(o.gepubliceerdOp))+'</div>'+
        (o.kop?'<div class="kop">'+esc(o.kop)+'</div>':'')+
        '<div class="tekst">'+esc(o.samenvatting)+'</div>'+
        (o.url?'<div class="bronnen"><a href="'+esc(o.url)+'" target="_blank" rel="noopener">Bron →</a></div>':'')+
        ketenHtml(o)+
        ifBlokHtml(o.id)+
        '<div class="knoppen"><button class="actie wegbtn" data-act="verwijder-overheid">Van de site halen</button></div>'+
      '</div>';
    });

    // De Infofrankrijk-lijsten staan ONDERAAN, na de drie stromen hierboven.
    // Wie de curatie overneemt, moet bovenaan de dagelijkse taak vinden — de
    // conceptenwachtrij — en niet eerst langs nawerk scrollen.
    html += nakijkenHtml();
    html += bijnaVerlopenHtml();

    inhoudEl.innerHTML = html;
    koppel();
  }

  function koppel(){
    var vorige = document.getElementById("vorige");
    var volgende = document.getElementById("volgende");
    if (vorige) vorige.addEventListener("click", function(){ state.index--; render(); });
    if (volgende) volgende.addEventListener("click", function(){ state.index++; render(); });

    var ontdubbelBtn = document.getElementById("ontdubbel");
    if (ontdubbelBtn) ontdubbelBtn.addEventListener("click", function(){
      ontdubbelBtn.disabled = true; ontdubbelBtn.textContent = "…";
      api("POST", { actie: "ontdubbel" }).then(function(res){
        if (res.ok && res.data.ok){ melding("Duplicaten verwijderd: "+res.data.verwijderd+". Over: "+res.data.over+".", "info"); laad(); }
        else { melding((res.data&&res.data.fout)||"Mislukt.", "fout"); ontdubbelBtn.disabled=false; }
      });
    });
    var opruimToggle = document.getElementById("opruimToggle");
    if (opruimToggle) opruimToggle.addEventListener("click", function(){
      var lade = document.getElementById("opruimLade");
      var open = lade.hasAttribute("hidden");
      if (open) lade.removeAttribute("hidden"); else lade.setAttribute("hidden", "");
      opruimToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    var wisAllesBtn = document.getElementById("wisAlles");
    if (wisAllesBtn) wisAllesBtn.addEventListener("click", function(){
      if (!window.confirm("De wachtrij met "+state.totaal+" persconcepten wissen?\n\nAlleen nog niet gepubliceerde persconcepten verdwijnen. Gepubliceerde artikelen, de overheidsberichten (live én archief) en de verenigingsitems blijven ongewijzigd.")) return;
      wisAllesBtn.disabled = true; wisAllesBtn.textContent = "…";
      api("POST", { actie: "wis-alles" }).then(function(res){
        if (res.ok && res.data.ok){
          melding("Persconcepten gewist ("+res.data.verwijderd+")."+(res.data.overgeslagen?" Overgeslagen (geen persconcept): "+res.data.overgeslagen+".":""), "info");
          laad();
        }
        else { melding((res.data&&res.data.fout)||"Mislukt.", "fout"); wisAllesBtn.disabled=false; }
      });
    });

    // Keten-antwoorden: de UI stuurt alleen ja/nee + de smaak; de server bepaalt
    // wat er met de records gebeurt (zie actie "keten" in api/review.js).
    inhoudEl.querySelectorAll("button[data-keten]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var kaart = btn.closest(".kaart");
        var id = kaart.getAttribute("data-id");
        var vak = kaart.querySelector(".keten");
        if (vak) vak.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
        btn.textContent = "…";
        api("POST", {
          actie: "keten",
          id: id,
          antwoord: btn.getAttribute("data-keten"),
          soort: btn.getAttribute("data-soort"),
        }).then(function(res){
          if (res.ok && res.data.ok){
            melding(res.data.keten === "geen"
              ? "Geen keten gelegd."
              : res.data.keten === "vervangen"
                ? "Verwerkt: het eerdere bericht is vervangen en staat niet meer in het publieke archief."
                : "Verwerkt: beide berichten staan naast elkaar in het archief.", "info");
            laad(true);
          } else {
            melding((res.data && res.data.fout) || "Mislukt.", "fout");
            if (vak) vak.querySelectorAll("button").forEach(function(b){ b.disabled = false; });
          }
        }).catch(function(){ melding("Netwerkfout.", "fout"); });
      });
    });

    // ---- Infofrankrijk: paneel, zoeken, verwijzen, nakijken ----------------
    function ifKaartId(btn){
      var kaart = btn.closest(".kaart");
      return kaart ? kaart.getAttribute("data-id") : null;
    }
    // Eén verzoek voor de kandidatenlijst. Het THEMA wordt serverside uit het
    // bericht zelf afgeleid; hier gaat alleen een id en een eventuele zoekterm
    // de deur uit.
    function laadKandidaten(){
      var p = state.ifPaneel;
      if (!p) return;
      p.laden = true; p.fout = null; render();
      apiGet("&deel=if&artikel=" + encodeURIComponent(p.id) + (p.zoek ? "&zoek=" + encodeURIComponent(p.zoek) : ""))
        .then(function(res){
          var q = state.ifPaneel;
          if (!q || q.id !== p.id) return; // paneel is intussen gesloten
          q.laden = false;
          if (res.ok && res.data.ok){ q.data = res.data; q.fout = res.data.fout || null; }
          else { q.fout = (res.data && res.data.fout) || "Kon de lijst niet ophalen."; }
          render();
          var veld = document.getElementById("ifZoek");
          if (veld && q.zoek){ veld.focus(); veld.setSelectionRange(veld.value.length, veld.value.length); }
        })
        .catch(function(){ var q = state.ifPaneel; if (q){ q.laden=false; q.fout="Netwerkfout."; render(); } });
    }
    // Na "Verwijzen"/"Verwijzing weg" alleen de gekozen lijst bijwerken, zodat
    // het paneel open blijft staan en de redacteur door kan met de volgende.
    function ifActie(body, gelukt){
      api("POST", body).then(function(res){
        if (res.ok && res.data.ok){
          melding(gelukt, "info");
          laad(true);
          if (state.ifPaneel) laadKandidaten();
        } else {
          melding((res.data && res.data.fout) || "Mislukt.", "fout");
        }
      }).catch(function(){ melding("Netwerkfout.", "fout"); });
    }

    inhoudEl.querySelectorAll("button[data-if-open]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.ifPaneel = { id: btn.getAttribute("data-if-open"), zoek: "", alles: false, data: null };
        laadKandidaten();
      });
    });
    inhoudEl.querySelectorAll("button[data-if-dicht]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.ifPaneel = null; render(); });
    });
    inhoudEl.querySelectorAll("button[data-if-alles]").forEach(function(btn){
      btn.addEventListener("click", function(){ if (state.ifPaneel){ state.ifPaneel.alles = true; render(); } });
    });
    var zoekBtn = document.getElementById("ifZoekBtn");
    var zoekVeld = document.getElementById("ifZoek");
    function zoekNu(){
      if (!state.ifPaneel || !zoekVeld) return;
      state.ifPaneel.zoek = zoekVeld.value.trim();
      state.ifPaneel.alles = false;
      laadKandidaten();
    }
    if (zoekBtn) zoekBtn.addEventListener("click", zoekNu);
    if (zoekVeld) zoekVeld.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); zoekNu(); }
    });
    inhoudEl.querySelectorAll("button[data-if-verwijs]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = ifKaartId(btn); if (!id) return;
        btn.disabled = true;
        ifActie({ actie: "verwijs", id: id, ifId: Number(btn.getAttribute("data-if-verwijs")) },
          "Verwijzing toegevoegd. Op de nieuwspagina zichtbaar na de eerstvolgende cronronde.");
      });
    });
    inhoudEl.querySelectorAll("button[data-if-af]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = ifKaartId(btn); if (!id) return;
        btn.disabled = true;
        ifActie({ actie: "verwijs-weg", id: id, ifId: Number(btn.getAttribute("data-if-af")) },
          "Verwijzing weggehaald.");
      });
    });
    inhoudEl.querySelectorAll("button[data-if-nakijk]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = ifKaartId(btn); if (!id) return;
        btn.disabled = true;
        ifActie({ actie: "nakijken", id: id, ifId: Number(btn.getAttribute("data-if-nakijk")) },
          "Op de lijst \u201cNakijken op Infofrankrijk\u201d gezet. De lezer ziet hier niets van.");
      });
    });
    inhoudEl.querySelectorAll("button[data-nakijk-klaar]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var ifId = Number(btn.getAttribute("data-nakijk-klaar"));
        btn.disabled = true;
        api("POST", { actie: "nakijken-klaar", id: String(ifId), ifId: ifId }).then(function(res){
          if (res.ok && res.data.ok){ melding("Afgevinkt.", "info"); laad(true); }
          else { melding((res.data && res.data.fout) || "Mislukt.", "fout"); btn.disabled = false; }
        }).catch(function(){ melding("Netwerkfout.", "fout"); btn.disabled = false; });
      });
    });

    inhoudEl.querySelectorAll("button[data-act]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var kaart = btn.closest(".kaart");
        var id = kaart.getAttribute("data-id");
        var act = btn.getAttribute("data-act");
        var ta = kaart.querySelector("textarea");
        var body = { actie: act, id: id };
        if (ta && (act === "publiceer" || act === "bewerk")) body.tekst = ta.value;
        // Tweede klik ná een gelijkenis-weigering: dezelfde actie mét bevestiging.
        if (act === "publiceer" && btn.getAttribute("data-bevestig") === "1") body.bevestigd = true;
        var oudLabel = btn.textContent;
        btn.disabled = true; btn.textContent = "…";
        api("POST", body).then(function(res){
          if (res.ok && res.data.ok){
            melding(act==="publiceer"?"Gepubliceerd.":act==="weg"?"Verwijderd.":act==="depubliceer"?"Van de site gehaald.":act==="verwijder-overheid"?"Van de site gehaald.":act==="archiveer"?"Naar archief verplaatst.":"Bewaard.", "info");
            if (act === "publiceer" || act === "weg"){
              state.concepten = state.concepten.filter(function(x){ return x.id !== id; });
              state.totaal = Math.max(0, state.totaal - 1);
              // Herladen, maar de bevestiging laten staan: anders wist laad()
              // de melding meteen en ziet de redacteur niet dát er gepubliceerd is.
              if (act === "publiceer"){ laad(true); } else { render(); }
            } else if (act === "bewerk"){
              btn.disabled = false; btn.textContent = "Bewaar tekst";
            } else {
              laad();
            }
          } else {
            var reden = (res.data && res.data.fout) || "Er ging iets mis.";
            melding(reden, "fout");
            // Weigering door de publicatiepoort: de reden ook bij het concept
            // zelf tonen, zodat hij niet wegvalt bij het scrollen.
            var vak = kaart.querySelector(".poortmelding");
            if (vak){
              vak.innerHTML = (res.data && res.data.geweigerd)
                ? '<div class="waarschuwing geweigerd"><b>Publicatie geweigerd door de server</b>'+esc(reden)+'</div>'
                : "";
            }
            btn.disabled = false;
            // Overrulebare weigering (lijkt op een live artikel): de knop wordt
            // een bewuste tweede stap. De harde weigeringen — te weinig outlets,
            // faits divers, kopoverlap — hebben geen bevestigingNodig en blijven
            // dus gewoon geblokkeerd.
            if (res.data && res.data.bevestigingNodig && act === "publiceer"){
              btn.setAttribute("data-bevestig", "1");
              btn.textContent = "Toch publiceren";
            } else {
              btn.textContent = oudLabel;
            }
          }
        }).catch(function(){ melding("Netwerkfout.", "fout"); btn.disabled = false; btn.textContent = oudLabel; });
      });
    });
  }

  function laad(behoudMelding){
    if (!token){ melding("Geen token in de URL. Voeg ?token=… toe.", "fout"); inhoudEl.innerHTML = ""; return; }
    api("GET").then(function(res){
      if (res.ok && res.data.ok){
        if (!behoudMelding) melding("");
        state.concepten = res.data.concepten || [];
        state.duplicaten = res.data.duplicatenAantal || 0;
        state.totaal = res.data.totaalConcepten || state.concepten.length;
        state.publicaties = res.data.publicaties || [];
        state.overheid = res.data.overheid || [];
        state.bronUrlWeigeringen = res.data.bronUrlWeigeringen || [];
        state.verwijzingen = res.data.verwijzingen || {};
        state.nakijken = res.data.nakijken || [];
        state.bijnaVerlopen = res.data.bijnaVerlopen || [];
        state.ifIndex = res.data.ifIndex || null;
        if (state.index >= state.concepten.length) state.index = 0;
        render();
      } else { melding((res.data && res.data.fout) || "Toegang geweigerd.", "fout"); inhoudEl.innerHTML = ""; }
    }).catch(function(){ melding("Netwerkfout.", "fout"); });
  }

  laad();
})();
</script>
</body>
</html>
