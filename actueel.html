<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Actueel — Frankrijknieuws</title>
<!--
  NLFR ACTUEEL — Nederlandstalige nieuwspagina, embed via iframe op
  https://www.nederlanders.fr/page/actueel-frankrijknieuws (zie EMBED.md).
  Opbouw: thema-TEGELS die uitklappen. Alles Nederlands tot de laatste stap:
    tegel (bullets) -> artikelen (titel + summary) -> volledige NL-tekst ->
    "Bronnen" (pers: de Franse originelen; overige: de ene eigen/overheidsbron).
  Alle tegels starten DICHT. Hoogte-sync via postMessage({nlfrActueelHeight}).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brand:#800000; --brand-soft:rgba(128,0,0,.10); --brand-line:rgba(128,0,0,.18); --brand-line-sterk:rgba(128,0,0,.30);
          --groen:#2f6b3a; --groen-soft:rgba(47,107,58,.10); --groen-line:rgba(47,107,58,.30); --groen-line-sterk:rgba(47,107,58,.44);
          --tegel:#ffffff; --tegel-open:#fdfbfa; --ink:#38312e; --ink-zacht:#7c716d; --ink-flauw:#a99e9a; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:transparent; }
  body { font-family:'Mulish',system-ui,sans-serif; line-height:1.55; color:var(--ink); padding:6px; }
  h1,h2,h3 { font-family:'Poppins',sans-serif; line-height:1.3; }

  .card { background:#fff; border:1px solid var(--brand-line); border-radius:18px; box-shadow:0 12px 40px -26px rgba(90,0,0,.55); overflow:hidden; }
  .head { padding:16px 18px 10px; border-bottom:1px solid rgba(128,0,0,.1); }
  .head h1 { margin:0; font-size:20px; font-weight:700; color:var(--brand); }
  .head .sub { font-size:13px; color:var(--ink-zacht); margin-top:2px; }
  .body { padding:14px 16px 8px; display:flex; flex-direction:column; gap:14px; }

  /* ---- Tegel (niveau 0) ---- */
  .tegel { background:var(--tegel); border:1px solid var(--brand-line); border-radius:16px; position:relative; overflow:hidden; }
  .tegel::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--brand); opacity:.85; z-index:2; }
  .tegel.groen { border-color:var(--groen-line); }
  .tegel.groen::before { background:var(--groen); }
  .tegel.open { background:var(--tegel-open); border-color:var(--brand-line-sterk); }
  .tegel.groen.open { border-color:var(--groen-line-sterk); }

  .t0 { display:block; width:100%; text-align:left; background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:15px 18px 5px; -webkit-tap-highlight-color:transparent; }
  .t0:focus-visible { outline:2px solid var(--brand); outline-offset:-3px; border-radius:16px; }
  .groen .t0:focus-visible { outline-color:var(--groen); }
  .tkop { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .tkop h2 { font-size:15.5px; font-weight:700; margin:0; color:var(--brand); }
  .groen .tkop h2 { color:var(--groen); }
  .tkop .telling { font-size:11.5px; color:var(--ink-flauw); margin-left:auto; white-space:nowrap; }
  .badge { font-family:'Poppins',sans-serif; font-weight:600; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .badge.redactie { color:var(--groen); background:var(--groen-soft); border:1px solid var(--groen-line); }
  .badge.overheid { color:var(--brand); background:var(--brand-soft); border:1px solid var(--brand-line); }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.3;transform:scale(1.5);} }
  .dot { width:8px; height:8px; border-radius:999px; background:var(--groen); display:inline-block; animation:pulse 1.7s ease-in-out infinite; flex:0 0 auto; align-self:center; }
  @media (prefers-reduced-motion:reduce){ .dot{animation:none;} }

  ul.bullets { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  ul.bullets li { position:relative; padding-left:16px; font-size:14px; color:var(--ink); }
  ul.bullets li::before { content:""; position:absolute; left:0; top:8px; width:6px; height:6px; border-radius:2px; background:var(--brand); opacity:.55; }
  .groen ul.bullets li::before { background:var(--groen); }
  ul.bullets li.meer { color:var(--ink-flauw); font-style:italic; }
  ul.bullets li.meer::before { display:none; }

  .balk { display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:11px; border-top:1px solid var(--brand-line); font-family:'Poppins',sans-serif; font-weight:600; font-size:12px; color:var(--brand); }
  .groen .balk { border-top-color:var(--groen-line); color:var(--groen); }
  .chev { transition:transform .2s; font-size:11px; display:inline-block; }
  [aria-expanded="true"] .chev { transform:rotate(180deg); }

  .reveal { max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .reveal.open { max-height:6000px; }
  @media (prefers-reduced-motion:reduce){ .reveal{transition:none;} }

  /* ---- Artikel (niveau 1) ---- */
  .artikelen { padding:2px 14px 12px; }
  .artikel { border:1px solid var(--brand-line); border-radius:12px; margin-top:10px; overflow:hidden; background:#fff; }
  .groen .artikel { border-color:var(--groen-line); }
  .t1 { display:block; width:100%; text-align:left; background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:12px 14px; }
  .t1:focus-visible { outline:2px solid var(--brand); outline-offset:-3px; }
  .groen .t1:focus-visible { outline-color:var(--groen); }
  .t1 .atitel { font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; color:var(--ink); display:flex; gap:8px; align-items:baseline; }
  .t1 .atitel .chev { margin-left:auto; color:var(--ink-flauw); }
  .t1 .asum { font-size:13px; color:var(--ink-zacht); margin-top:3px; }

  /* ---- Volledige NL-tekst (niveau 2) ---- */
  .uitleg .binnen { padding:2px 14px 14px; }
  .synthese { font-size:13.5px; color:var(--ink); line-height:1.62; }
  .synthese p { margin:0 0 9px; }
  .synthese p:last-child { margin-bottom:0; }
  .redlabel { font-family:'Poppins',sans-serif; font-weight:600; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--groen); margin-bottom:7px; }

  /* ---- Franse/eigen bronnen (niveau 3) ---- */
  .t2 { display:inline-flex; align-items:center; gap:7px; margin-top:10px; background:var(--brand-soft); border:1px solid var(--brand-line); color:var(--brand); font-family:'Poppins',sans-serif; font-weight:600; font-size:11.5px; border-radius:999px; padding:6px 12px; cursor:pointer; }
  .groen .t2 { background:var(--groen-soft); border-color:var(--groen-line); color:var(--groen); }
  .t2:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .bronnen .binnen { padding:8px 2px 2px; }
  .bron { display:flex; flex-direction:column; gap:1px; padding:7px 0; border-bottom:1px solid var(--brand-line); }
  .groen .bron { border-bottom-color:var(--groen-line); }
  .bron:last-child { border-bottom:none; }
  .bron a { font-size:12.5px; color:var(--ink); text-decoration:none; font-weight:600; }
  .bron a:hover, .bron a:focus-visible { color:var(--brand); text-decoration:underline; outline:none; }
  .groen .bron a:hover, .groen .bron a:focus-visible { color:var(--groen); }
  .bron .m { font-size:11px; color:var(--ink-flauw); }
  .bron .m .bn { font-family:'Poppins',sans-serif; font-weight:600; color:var(--ink-zacht); }

  /* ---- Agenda (plat) ---- */
  .plat { padding:15px 18px 14px; }
  .agenda-rij { display:flex; gap:12px; padding:7px 0; border-bottom:1px solid var(--groen-line); }
  .agenda-rij:last-child { border-bottom:none; }
  .agenda-rij .dat { font-family:'Poppins',sans-serif; font-weight:600; font-size:12px; color:var(--groen); flex:0 0 118px; }
  .agenda-rij .watt { font-size:13.5px; }
  .agenda-rij .watt .sub { color:var(--ink-flauw); font-size:11.5px; }

  /* ---- Schoolvakanties ---- */
  .vak .plat h2 { color:var(--groen); margin:0 0 6px; font-size:15px; }
  .vak .link { margin-top:8px; font-size:12.5px; }
  .vak a { color:var(--groen); }

  .bronstatus { border-top:1px solid rgba(128,0,0,.1); padding:10px 18px 14px; font-size:12px; color:var(--ink-zacht); display:flex; flex-wrap:wrap; gap:6px 14px; background:#fdf9f8; line-height:1.5; }
  .bronstatus .b { display:inline-flex; align-items:center; gap:5px; }
  .bronstatus .ok { color:var(--groen); }
  .bronstatus .nok { color:var(--brand); }
  .leeg { color:var(--ink-zacht); font-size:13.5px; padding:4px 0; }
  .laden { color:var(--ink-zacht); font-size:14px; padding:24px 0; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>Actueel — Frankrijknieuws</h1>
    <div class="sub" id="sub">wordt geladen…</div>
  </div>
  <div class="body" id="body">
    <div class="laden">Nieuws wordt opgehaald…</div>
  </div>
  <div class="bronstatus" id="bronstatus"></div>
</div>

<script>
(function(){
  "use strict";
  var bodyEl = document.getElementById("body");
  var subEl = document.getElementById("sub");
  var statusEl = document.getElementById("bronstatus");

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function datum(iso){ try{ var d=new Date(iso); return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
  function agendaDag(iso){ try{ return new Date(iso+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"long"}); }catch(e){ return iso; } }
  function meerv(n){ return n===1 ? "artikel" : "artikelen"; }

  function bronHTML(b){
    var t = b.titel || b.naam || "bron";
    return '<div class="bron"><a href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(t)+'</a>'+
           '<span class="m"><span class="bn">'+esc(b.naam||"")+'</span>'+(b.datum?" · "+esc(datum(b.datum)):"")+'</span></div>';
  }

  function artikelHTML(t, ti, a, ai){
    var uid = "u-"+ti+"-"+ai, bid = "b-"+ti+"-"+ai;
    var paras = String(a.tekst||"").split(/\n\n+/).filter(Boolean).map(function(p){ return "<p>"+esc(p)+"</p>"; }).join("");
    if (!paras) paras = "<p>"+esc(a.summary||"")+"</p>";
    var bronnen = a.bronnen || [];
    var bronLabel = t.soort === "pers" ? ("Bronnen ("+bronnen.length+")") : "Bron";
    var bronBlok = bronnen.length
      ? '<button class="t2" type="button" aria-expanded="false" aria-controls="'+bid+'"><span class="chev">▾</span> '+bronLabel+'</button>'+
        '<div class="reveal bronnen" id="'+bid+'"><div class="binnen">'+bronnen.map(bronHTML).join("")+'</div></div>'
      : "";
    return '<div class="artikel">'+
      '<button class="t1" type="button" aria-expanded="false" aria-controls="'+uid+'">'+
        '<span class="atitel">'+esc(a.titel)+' <span class="chev">▾</span></span>'+
        (a.summary?'<span class="asum">'+esc(a.summary)+'</span>':'')+
      '</button>'+
      '<div class="reveal uitleg" id="'+uid+'"><div class="binnen">'+
        (t.soort==="pers" && a.label ? '<div class="redlabel">'+esc(a.label)+'</div>' : "")+
        '<div class="synthese">'+paras+'</div>'+
        bronBlok+
      '</div></div>'+
    '</div>';
  }

  function tegelHTML(t, ti){
    var arts = t.artikelen || [];
    var badge = t.accent==="brand" ? "overheid" : "redactie";
    var bullets = arts.slice(0,6).map(function(a){ return "<li>"+esc(a.titel)+"</li>"; }).join("");
    if (arts.length>6) bullets += '<li class="meer">+'+(arts.length-6)+" meer</li>";
    return '<article class="tegel '+(t.accent==="groen"?"groen":"")+'">'+
      '<button class="t0" type="button" aria-expanded="false" aria-controls="l1-'+ti+'">'+
        '<div class="tkop">'+(t.hot?'<span class="dot"></span>':"")+
          '<h2>'+esc(t.label)+'</h2>'+
          '<span class="badge '+badge+'">'+esc(t.badge)+'</span>'+
          '<span class="telling">'+arts.length+" "+meerv(arts.length)+'</span>'+
        '</div>'+
        '<ul class="bullets">'+bullets+'</ul>'+
        '<div class="balk"><span class="chev">▾</span><span>Toon de '+arts.length+" "+meerv(arts.length)+'</span></div>'+
      '</button>'+
      '<div class="reveal artikelen" id="l1-'+ti+'">'+arts.map(function(a,ai){ return artikelHTML(t,ti,a,ai); }).join("")+'</div>'+
    '</article>';
  }

  function agendaHTML(agenda){
    if (!agenda || !agenda.length) return "";
    var rijen = agenda.map(function(a){
      var detail = [a.tijd, a.plaats].filter(Boolean).join(" · ");
      return '<div class="agenda-rij"><span class="dat">'+esc(agendaDag(a.datum))+'</span>'+
        '<span class="watt">'+esc(a.titel)+'<span class="sub">'+(a.vereniging?" · "+esc(a.vereniging):"")+(detail?" · "+esc(detail):"")+'</span></span></div>';
    }).join("");
    return '<article class="tegel groen"><div class="plat">'+
      '<div class="tkop"><h2>Agenda — komende twee weken</h2><span class="telling">'+agenda.length+' activiteiten</span></div>'+
      rijen+'</div></article>';
  }

  function vakantieHTML(v){
    if (!v || !v.zin) return "";
    return '<article class="tegel groen vak"><div class="plat">'+
      '<h2>Schoolvakanties</h2><div style="font-size:14px">'+esc(v.zin)+'</div>'+
      '<div class="link"><a href="'+esc(v.servicePublic)+'" target="_blank" rel="noopener">Officiële kalender &amp; regels (service-public.gouv.fr) →</a></div>'+
      '</div></article>';
  }

  function render(data, vak){
    var tegels = data.tegels || [];
    var html = tegels.map(tegelHTML).join("");
    html += agendaHTML(data.agenda);
    html += vakantieHTML(vak);
    if (!tegels.length && !(data.agenda||[]).length && !(vak&&vak.zin)){
      html = '<div class="leeg">Op dit moment is er geen nieuws opgehaald.</div>';
    }
    bodyEl.innerHTML = html;
    subEl.textContent = "Bijgewerkt " + datum(data.bijgewerkt);
    renderStatus(data.bronStatus||[]);
    report();
  }

  function renderStatus(lijst){
    if (!lijst.length){ statusEl.innerHTML = ""; return; }
    statusEl.innerHTML = '<span class="b" style="font-weight:600">Bronnen:</span>' + lijst.map(function(b){
      var cls = b.ok ? "ok" : "nok";
      var teken = b.ok ? "●" : "○";
      return '<span class="b '+cls+'">'+teken+' '+esc(b.naam)+' ('+(b.aantal||0)+')</span>';
    }).join("");
  }

  // Uitklappen: elke knop met aria-controls togglet zijn doel. Op niveau 0 krijgt
  // de tegel ook de .open-highlight. Na elke toggle de hoogte opnieuw melden.
  bodyEl.addEventListener("click", function(e){
    var btn = e.target.closest("[aria-controls]");
    if (!btn || !bodyEl.contains(btn)) return;
    var doel = document.getElementById(btn.getAttribute("aria-controls"));
    if (!doel) return;
    var open = doel.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (btn.classList.contains("t0")){
      var tegel = btn.closest(".tegel");
      if (tegel) tegel.classList.toggle("open", open);
    }
    report();
  });

  // ---- Hoogte-sync naar de moederpagina ----
  var lastH = 0;
  function report(){
    try {
      if (window.parent && window.parent !== window){
        var card = document.querySelector(".card");
        if (!card) return;
        var h = Math.ceil(card.getBoundingClientRect().height) + 12;
        if (h !== lastH){ lastH = h; window.parent.postMessage({ nlfrActueelHeight: h }, "*"); }
      }
    } catch(e){}
  }

  function laad(){
    Promise.all([
      fetch("/api/actueel", { cache:"no-store" }).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }),
      fetch("/api/schoolvakanties", { cache:"no-store" }).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })
    ]).then(function(res){
      var data = res[0] || { bijgewerkt:new Date().toISOString(), tegels:[], agenda:[], bronStatus:[] };
      render(data, res[1]);
    });
  }

  window.addEventListener("load", report);
  window.addEventListener("resize", report);
  laad();
  setInterval(laad, 5 * 60 * 1000);
})();
</script>
</body>
</html>
