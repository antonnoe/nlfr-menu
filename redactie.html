<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NLFR · Redactie</title>
<link rel="icon" type="image/svg+xml" href="/assets/redactie-icoon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Redactiepagina (20-11-2026, mock-up goedgekeurd door Anton): alleen wat een
     beslissing nodig heeft, het voorstel in woorden, drie knoppen, na een tik
     krimpt de kaart ter plekke tot één regel met Ongedaan maken. Tekst minstens
     16 px, tikvlakken minstens 44 px, bordeaux #800000 als enige accent. */
  :root { --brand:#800000; --brand-zacht:#f6eaea; --tekst:#2b2624; --zacht:#5f5755; --lijn:#d9cfcc; --vlak:#fff; --achter:#f4f1ef; --oranje:#8a4b00; --ok:#1f6b35; --ok-zacht:#e9f3ec; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--achter); color:var(--tekst); font-family:Mulish,system-ui,sans-serif; font-size:17px; line-height:1.5; }
  button { font:inherit; cursor:pointer; }
  a { color:var(--brand); }
  .kop { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .kop h1 { margin:0; font-family:Poppins,sans-serif; font-size:22px; line-height:1.2; }
  .kop .dag { font-size:16px; opacity:.9; }
  .kop .teller { margin-left:auto; font-size:16px; font-weight:700; background:rgba(255,255,255,.16); border-radius:999px; padding:6px 12px; white-space:nowrap; }
  .kop .ververs { min-height:44px; min-width:44px; border:1px solid rgba(255,255,255,.5); border-radius:12px; background:transparent; color:#fff; font-size:22px; line-height:1; padding:0; flex:0 0 44px; }
  .kop .dag { white-space:nowrap; }
  .kop > div:first-child { min-width:0; }
  .kop .teller { padding:6px 10px; }
  .bol { width:12px; height:12px; border-radius:50%; background:var(--ok); flex:0 0 12px; }
  .wrap { max-width:760px; margin:0 auto; }
  .romp { padding:12px 16px 32px; display:flex; flex-direction:column; gap:14px; }
  .zij { display:none; }
  .leer { margin:6px 0 0; font-size:16px; color:var(--zacht); }
  .uitleg { margin:0; font-size:16px; color:var(--zacht); }
  .status { margin:0; font-size:16px; color:var(--zacht); }
  .fout-blok { background:#fff7ed; color:var(--oranje); border-radius:14px; padding:14px; font-size:16px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  details { background:var(--vlak); border:1px solid var(--lijn); border-radius:14px; }
  summary { list-style:none; min-height:56px; padding:12px 14px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; cursor:pointer; }
  summary::-webkit-details-marker { display:none; }
  summary .pijl { margin-left:auto; color:var(--brand); font-size:16px; font-weight:700; white-space:nowrap; }
  details[open] summary .pijl::after { content:" ▴"; } details:not([open]) summary .pijl::after { content:" ▾"; }
  .klein-lijst { margin:0; padding:0 14px 10px; list-style:none; }
  .klein-lijst li { border-top:1px solid #eee5e2; padding:10px 0; display:flex; gap:10px; align-items:center; font-size:16px; }
  .klein-lijst li .t { flex:1; min-width:0; }
  .klein-lijst li .b { display:block; color:var(--zacht); font-size:16px; }
  .klein-lijst li.weg .t { text-decoration:line-through; color:var(--zacht); }
  .groep { font-size:16px; font-weight:700; color:var(--zacht); margin:6px 0 -4px; }
  .lijst { display:flex; flex-direction:column; gap:14px; }
  .kaart { background:var(--vlak); border:1px solid var(--lijn); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .soort { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:16px; color:var(--zacht); }
  .label { font-weight:700; color:var(--tekst); background:#efe9e7; border-radius:8px; padding:2px 8px; }
  .kaart h2 { margin:0; font-family:Poppins,sans-serif; font-size:20px; line-height:1.35; color:var(--tekst); }
  .kaart h2 a { color:inherit; display:inline-block; min-height:44px; }
  .fr { margin:0; font-size:16px; color:var(--zacht); font-style:italic; }
  .samenvatting { margin:0; font-size:17px; white-space:pre-line; }
  .voorstel { background:var(--brand-zacht); border-radius:12px; padding:12px; font-size:17px; }
  .voorstel b { color:var(--brand); }
  .voorstel .waarom { display:block; font-size:16px; color:var(--zacht); margin-top:4px; }
  .voorstel .let { display:block; font-size:16px; color:var(--oranje); margin-top:4px; font-weight:700; }
  .melding-kaart { font-size:16px; color:var(--oranje); background:#fff7ed; border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .knoppen { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .knop { min-height:52px; border-radius:12px; border:2px solid var(--brand); background:#fff; color:var(--brand); font-weight:700; font-size:17px; padding:6px 12px; line-height:1.25; }
  .knop.ja { grid-column:1 / -1; background:var(--brand); color:#fff; }
  .knop.nee { border-color:#9b9290; color:var(--tekst); }
  .knop:disabled { opacity:.5; cursor:not-allowed; }
  .anders-knop { min-height:48px; background:none; border:0; color:var(--brand); font-weight:700; font-size:17px; text-decoration:underline; text-underline-offset:3px; padding:0; text-align:left; }
  .anders { border-top:1px solid #eee5e2; padding-top:12px; display:flex; flex-direction:column; gap:12px; }
  .anders h3 { margin:0; font-size:17px; }
  .plekken { display:grid; grid-template-columns:1fr .75fr 1.45fr .95fr 1fr; gap:4px; }
  .plek { display:flex; align-items:center; justify-content:center; min-height:44px; min-width:0; border:1px solid var(--lijn); border-radius:8px; padding:6px 2px; background:#fff; text-align:center; width:100%; font-size:14px; line-height:1.2; color:var(--tekst); }
  .plek .naam { font-weight:700; }
  .plek[aria-pressed="true"] { border-color:var(--brand); background:var(--brand); color:#fff; }
  .plek:disabled { cursor:not-allowed; opacity:.55; }
  .plek:disabled .naam { color:var(--zacht); }
  .plek:disabled[aria-pressed="true"] .naam { color:#fff; }
  .kaart.bewerken { padding:12px; gap:10px; }
  .anders .chip { min-height:44px; padding:0 10px; font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { min-height:48px; border-radius:999px; border:1px solid var(--lijn); background:#fff; padding:0 16px; font-size:17px; color:var(--tekst); }
  .chip[aria-pressed="true"] { background:var(--tekst); border-color:var(--tekst); color:#fff; }
  label.veld { display:flex; flex-direction:column; gap:6px; font-weight:700; font-size:17px; }
  input.veld-in, textarea { font:inherit; font-size:17px; border:1px solid var(--lijn); border-radius:10px; padding:10px; width:100%; font-weight:400; }
  textarea { min-height:96px; line-height:1.5; overflow-y:hidden; resize:vertical; }
  .samen { font-size:16px; color:var(--zacht); margin:0; }
  .rij2 { display:grid; grid-template-columns:2fr 1fr; gap:10px; }
  .klaar { background:var(--vlak); border:1px solid var(--lijn); border-left:6px solid var(--ok); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .klaar.nee { border-left-color:#9b9290; }
  .klaar.wacht { border-left-color:var(--oranje); }
  .klaar .r1 { display:flex; align-items:center; gap:10px; }
  .klaar .wat { flex:1; min-width:0; font-size:16px; }
  .klaar .wat b { display:block; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .klaar .wat span { color:var(--zacht); }
  .terug { min-height:48px; min-width:48px; border-radius:12px; border:2px solid var(--tekst); background:#fff; font-weight:700; font-size:16px; padding:0 12px; white-space:nowrap; color:var(--tekst); }
  .terug.wijzig { border:1px solid var(--lijn); color:var(--brand); }
  .reden-vraag { font-size:16px; color:var(--zacht); margin:0; }
  .chips.reden .chip { min-height:44px; font-size:16px; }
  .rest { min-height:56px; border-radius:14px; border:2px solid #9b9290; background:#fff; font-weight:700; font-size:17px; color:var(--tekst); width:100%; }
  .rest:disabled { opacity:.5; }
  .rest-uitleg { margin:6px 0 10px; font-size:16px; color:var(--zacht); }
  .toast { position:sticky; bottom:12px; z-index:6; margin:0 auto; background:var(--tekst); color:#fff; border-radius:14px; padding:8px 8px 8px 16px; display:flex; align-items:center; gap:10px; font-size:16px; max-width:520px; width:100%; }
  .toast[hidden] { display:none; }
  .toast .t { flex:1; }
  .toast button { min-height:48px; border-radius:10px; border:0; background:#fff; color:var(--tekst); font-weight:700; font-size:16px; padding:0 12px; white-space:nowrap; }
  .beheer a { display:flex; align-items:center; min-height:52px; padding:0 14px; border-top:1px solid #eee5e2; color:var(--brand); font-weight:700; text-decoration:none; font-size:17px; }
  .beheer .kopje { padding:10px 14px 4px; font-size:16px; color:var(--zacht); font-weight:700; }
  .leeg { background:var(--ok-zacht); color:var(--ok); border-radius:14px; padding:16px; font-weight:700; text-align:center; }
  /* Dagscherm (20-11-2026, mock-up https://claude.ai/artifact/8VyrDR5Tzf9wfem2Tp71hW):
     één regel per bericht met ✓ en ✕, tik op de kop klapt open; tabs bovenaan. */
  .tabs { display:flex; gap:6px; overflow-x:auto; }
  .tab { flex:0 0 auto; }
  .tab { min-height:44px; border-radius:999px; border:1px solid var(--lijn); background:#fff; color:var(--zacht); font-weight:700; font-size:15px; padding:0 12px; }
  .tab[aria-selected="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
  .lijst.compact { gap:0; background:var(--vlak); border:1px solid var(--lijn); border-radius:14px; overflow:hidden; }
  .lijst.compact > div { border-top:1px solid #eee5e2; }
  .lijst.compact > div:first-child { border-top:0; }
  .rij { display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 8px 6px 6px; }
  .rij.open { background:var(--brand-zacht); }
  .rij .sc { font-weight:700; font-size:14px; color:var(--zacht); text-align:center; font-variant-numeric:tabular-nums; }
  .rij .mid { min-width:0; background:none; border:0; padding:4px 0; text-align:left; color:var(--tekst); }
  .rij .t { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-weight:700; font-size:16px; line-height:1.3; overflow:hidden; }
  .rij.open .t { display:block; }
  .rij .s { display:block; font-size:14px; color:var(--zacht); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rij .advies { grid-column:1 / -1; font-size:15px; line-height:1.4; color:var(--zacht); white-space:normal; overflow-wrap:anywhere; }
  .rij .advies b { color:var(--brand); }
  .rij .s .let { color:var(--oranje); font-weight:700; }
  .rij .mw { background:#f2b84b; color:#2b2010; border-radius:4px; padding:0 5px; font-size:12px; font-weight:700; margin-right:4px; }
  .rij .kn { display:flex; gap:6px; }
  .rk { width:44px; height:44px; border-radius:10px; border:1px solid var(--lijn); background:#fff; font-size:20px; font-weight:700; line-height:1; color:var(--tekst); padding:0; }
  .rk.ja { background:var(--brand); border-color:var(--brand); color:#fff; }
  .rij .meer { grid-column:2 / -1; display:flex; flex-direction:column; gap:10px; padding:2px 0 8px; }
  .rij .meer .samenvatting { font-size:16px; }
  .rij .meer .waarom { font-size:15px; color:var(--zacht); margin:0; }
  .rij .meer .klein-knoppen { display:flex; gap:8px; flex-wrap:wrap; }
  .rij .meer .knop { min-height:44px; font-size:16px; }
  .rij .bron a { font-size:15px; }
  .lijst.compact .kaart { border:0; border-radius:0; }
  .lijst.compact .klaar { border:0; border-left:6px solid var(--ok); border-radius:0; padding:6px 10px; opacity:.75; }
  .lijst.compact .klaar.nee { border-left-color:#9b9290; }
  .lijst.compact .klaar.wacht { border-left-color:var(--oranje); opacity:1; }
  .lijst.compact .klaar .terug { min-height:44px; }
  .reden-knop { min-height:44px; background:none; border:0; color:var(--brand); font-weight:700; font-size:15px; padding:0 6px; text-decoration:underline; }
  @media (min-width:900px) {
    .kop { padding:14px 28px; }
    .wrap { max-width:1100px; display:grid; grid-template-columns:300px 1fr; gap:28px; padding:20px 28px 40px; }
    .romp { padding:0; }
    .zij { display:flex; flex-direction:column; gap:14px; position:sticky; top:84px; align-self:start; }
    .romp .alleen-smal { display:none; }
    .knoppen { grid-template-columns:2fr 1fr 1fr; }
    .knop.ja { grid-column:auto; }
  }
</style>
</head>
<body>
<header class="kop"><div><h1>Redactie</h1><div class="dag" id="dag"></div></div>
  <span class="teller" id="teller" aria-live="polite"></span>
  <button type="button" class="ververs" id="ververs" aria-label="Vernieuwen" title="Vernieuwen">&#8635;</button>
</header>
<div class="wrap">
  <aside class="zij" id="zij"></aside>
  <main class="romp" id="romp"><p class="status">Laden…</p></main>
</div>
<script>
(function () {
  "use strict";
  var DREMPEL = 40; // alleen een beginwaarde, overschreven door /api/selectie (één waarde: SCORE_DREMPEL in lib/config.js)
  var LOS_DREMPEL = 70; // uit /api/selectie, LOS_SCORE_DREMPEL in lib/redactieregels.js
  var ONGEDAAN_MS = 5000;
  var rev = null, sel = null, geladen = false;
  // Alle toestand van de pagina. De kaarten worden per bericht getekend, nooit
  // allemaal tegelijk: getypte tekst (st.cn) blijft staan, ook als elders een
  // bericht wordt geplaatst of de laadbeurt klaar is.
  var st = { tab: "beslis", uit: {}, redenOpen: {}, besluit: {}, open: {}, cn: {}, fout: {}, gedaan: {}, bewaard: {}, autoWeg: {}, autoBezig: {}, toch: [], lijst: [], auto: [], nietAi: [] };
  var PLEKKEN = []; // [id, naam, uitleg] uit /api/selectie (lib/redactieregels.js)
  var NAAM = {};
  var PLEK_KORT = { nieuwspagina: "Nieuws", nieuwsbrief: "Brief", infopoche: "Infopoche", zijbalk: "Zijbalk", infofrankrijk: "Infofr." };
  var LABEL = {};
  var VOLGORDE = ["algemeen", "regelgeving", "ondernemers", "reizen", "meteo", "merkwaardig"];
  var REDENEN = [];
  var R17_REDEN = ""; // uit /api/selectie (lib/redactieregels.js)
  var GROEPEN = ["Door jou teruggehaald", "Meerdere kranten", "Overheid, de AI twijfelt", "Eén krant"];
  var LOS = "Eén krant: volgens de huisregel niet op nieuwspagina, nieuwsbrief en Infopoche."; // overschreven door sel.regels.losTekst (lib/redactieregels.js)
  var VOLGT = "Volgt de nieuwspagina: zet eerst de nieuwspagina aan.";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function veilig(u) { return /^https:\/\//.test(String(u || "")) ? String(u) : ""; }
  function tijd(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }); }
  function urlSleutel(u) {
    try { var x = new URL(String(u || "")); return (x.hostname.replace(/^www\./, "") + x.pathname.replace(/\/+$/, "")).toLowerCase(); } catch (e) { return ""; }
  }
  function nlHost(u) { try { return /\.(nl|be)$/.test(new URL(u).hostname); } catch (e) { return false; } }
  function $(id) { return document.getElementById(id); }

  // ---------- netwerk ----------
  // keepalive: een verzoek dat tijdens het sluiten van de pagina vertrekt, wordt toch afgemaakt.
  var wegGaand = false;
  function post(pad, body) {
    return fetch(pad, { method: "POST", credentials: "same-origin", keepalive: wegGaand, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { d.status = r.status; return d; }, function () { return { ok: false, status: r.status, fout: "Onverwacht antwoord." }; }); })
      .catch(function () { return { ok: false, fout: "Niet bereikbaar. Controleer je verbinding." }; });
  }
  function haal(pad) {
    return fetch(pad, { credentials: "same-origin", cache: "no-store" }).then(function (r) {
      if (r.status === 401) { location.href = "/login?terug=/redactie"; throw new Error("login"); }
      return r.json();
    });
  }
  // "Deze week klopte het voorstel bij x van de y berichten": alleen bij minstens 5 besluiten.
  function leerHtml() {
    var m = sel && sel.meting;
    if (!m || !m.tonen) return "";
    return '<p class="leer">Deze week klopte het voorstel bij ' + m.klopt + " van de " + m.totaal + " berichten.</p>";
  }
  function laad() {
    geladen = false; laadFoutTekst = ""; tekenRomp();
    Promise.all([haal("/api/review"), haal("/api/selectie")]).then(function (uit) {
      rev = uit[0]; sel = uit[1];
      if (sel && typeof sel.drempel === "number") DREMPEL = sel.drempel;
      if (sel && typeof sel.losDrempel === "number") LOS_DREMPEL = sel.losDrempel;
      if (sel && sel.regels) {
        var rg = sel.regels;
        if (rg.losTekst) LOS = rg.losTekst;
        PLEKKEN = (rg.plekken || []).map(function (p) { return [p.id, p.naam, p.uitleg]; });
        NAAM = {}; (rg.plekken || []).forEach(function (p) { NAAM[p.id] = p.kort; });
        LABEL = {}; (rg.rubrieken || []).forEach(function (r) { LABEL[r.key] = r.label; });
        REDENEN = rg.redenen || [];
        R17_REDEN = rg.r17Reden || "";
      }
      if (!rev.ok || !sel.ok) { laadFout(rev.fout || sel.fout || "Fout bij laden."); return; }
      geladen = true; bouw(); tekenRomp();
    }).catch(function (e) { if (!e || e.message !== "login") laadFout("Niet bereikbaar. Probeer het zo opnieuw."); });
  }
  var laadFoutTekst = "";
  function laadFout(t) { laadFoutTekst = t; geladen = false; tekenRomp(); }

  // ---------- berichten ----------
  // Een kandidaat uit de selectie met dezelfde bronlink als een synthese of
  // overheidsbericht gaat in dat bericht op: zijn AI-oordeel hoort er dan bij.
  function bouwItems() {
    var klaar = {};
    (sel.redactie || []).forEach(function (b) { klaar[b.reviewId] = b; });
    var opUrl = {};
    (sel.kandidaten || []).forEach(function (k) { var s = urlSleutel(k.url); if (s) (opUrl[s] = opUrl[s] || []).push(k); });
    var gebruikt = {};
    function koppel(urls) {
      var best = null;
      urls.forEach(function (u) { (opUrl[urlSleutel(u)] || []).forEach(function (k) {
        gebruikt[k.id] = true;
        if (!best || ((k.ai && k.ai.score) || 0) > ((best.ai && best.ai.score) || 0)) best = k;
      }); });
      return best;
    }
    var items = [];
    (rev.concepten || []).forEach(function (c) {
      if (klaar[c.id]) return;
      var urls = (c.bronnen || []).map(function (b) { return b.url; });
      var gek = koppel(urls), ai = gek ? gek.ai : null;
      items.push({ soort: "concept", id: c.id, tijd: c.aangemaaktOp, kop: c.kop, tekst: c.tekst,
        bron: bronTekst(c, urls), ai: ai, url: "", nieuwsMag: !(c.poort && c.poort.publiceerbaar === false),
        voorstel: ai && ai.plek ? ai.plek : "zijbalk", altijd: true });
    });
    (rev.overheid || []).forEach(function (o) {
      if (klaar[o.id]) return;
      var gek = koppel([o.url]), ai = gek ? gek.ai : null;
      var v = ai && ai.plek ? ai.plek : "nieuwspagina";
      if (v === "zijbalk") v = "beide";
      var wacht = !!(o.poort && o.poort.status === "wacht");
      if (wacht && !(ai && ai.plek)) v = "zijbalk";
      items.push({ soort: "overheid", poort: o.poort, id: o.id, tijd: o.gepubliceerdOp || o.datum, kop: o.kop || o.titelBron, tekst: o.samenvatting,
        bron: o.bron, url: veilig(o.url), ai: ai, voorstel: v, altijd: !wacht, wacht: wacht });
    });
    // Syntheses die al op de nieuwspagina staan maar nog geen keuze voor
    // zijbalk en Infofrankrijk hebben.
    var grensPub = Date.now() - 36 * 3600e3;
    (rev.publicaties || []).forEach(function (c) {
      if (klaar[c.id] || Date.parse(c.gepubliceerdOp || "") < grensPub) return;

      '<span class="t">' + (vr === "merkwaardig" ? '<span class="mw">Merkwaardig</span>' : "") + esc(it.kop) + "</span>" +
      '<span class="s">' + esc(soortT) + (it.bron ? " · " + esc(it.bron) : "") + (tijd(it.tijd) ? " · " + tijd(it.tijd) : "") +
      (!it.ai ? ' · <span class="let">geen AI-oordeel</span>' : "") + "</span></button>" +
      '<span class="kn"><button type="button" class="rk ja" data-ja="' + id + '" aria-label="Ja, zoals voorgesteld" title="Ja, zoals voorgesteld">✓</button>' +
      '<button type="button" class="rk" data-nee="' + id + '" aria-label="Nee" title="Nee">✕</button></span>' +
      '<span class="advies">Advies: <b>' + esc(advies) + '</b></span>';
    if (f) h += '<div class="meer"><div class="melding-kaart" role="alert"><span>' + esc(f.tekst) + "</span>" + (f.bevestig ? '<button type="button" class="knop" data-bevestig="' + id + '">Toch publiceren</button>' : "") + "</div></div>";
    if (open) {
      h += '<div class="meer">' +
        (it.origineel ? '<p class="fr">' + esc(it.origineel) + "</p>" : "") +
        (it.tekst ? '<p class="samenvatting">' + esc(it.tekst) + "</p>" : "") +
        '<p class="waarom">Rubriek ' + esc(LABEL[vr]) + ". " + esc(waarom(it)) + "</p>" +
        (it.url ? '<span class="bron"><a href="' + esc(veilig(it.url)) + '" target="_blank" rel="noopener">Bron: ' + esc(it.bron || "openen") + " ↗</a></span>" : "") +
        '<div class="klein-knoppen">' + (zbAlleen ? "" : '<button type="button" class="knop" data-zb="' + id + '">Alleen zijbalk</button>') +
        '<button type="button" class="knop" data-anders="' + id + '">Anders: plekken, rubriek of tekst</button></div></div>';
    }
    return h + "</div>";
  }
  function labelTekst(it) {
    if (it.soort === "overheid") return "Overheid";
    if (it.soort === "kandidaat") return it.kSoort === "meteo" ? "Meteo" : it.kSoort === "pers" || !it.kSoort ? "Eén krant" : "Bericht";
    return "Synthese";
  }
  function samenTekst(it, c) {
    var k = schoon(it, c.k);
    return PLEKKEN.some(function (p) { return k[p[0]]; }) ? "Komt op: " + lijstTekst(k) + "." : "Nog geen plek gekozen: Plaats zo werkt pas met minstens één plek.";
  }
  function klaarHtml(it, b) {
    var wacht = b.status === "wacht", bezig = b.status === "bezig";
    var rest = wacht ? Math.max(0, Math.ceil((b.tot - Date.now()) / 1000)) : 0;
    var knop = wacht ? '<button type="button" class="terug" data-terug="' + esc(it.id) + '">Ongedaan maken (' + rest + ")</button>"
      : bezig ? '<button type="button" class="terug wijzig" disabled>Opslaan…</button>'
      : b.vast ? "" : '<button type="button" class="terug wijzig" data-wijzig="' + esc(it.id) + '">Wijzig</button>';
    var kop = esc(b.kop || it.kop);
    if (b.soort === "nee") {
      return '<div class="klaar nee' + (wacht || bezig ? " wacht" : "") + '"><div class="r1"><div class="wat"><b>' + kop + "</b><span>" +
        (wacht ? "Wordt niet geplaatst" : bezig ? "Opslaan…" : "Niet geplaatst") + (b.reden ? " · " + esc(b.reden) : "") + "</span></div>" + knop + "</div>" +
        (b.rest ? "" : !st.redenOpen[it.id] ? '<button type="button" class="reden-knop" data-redenopen="' + esc(it.id) + '">Waarom niet? (mag overslaan)</button>' : '<p class="reden-vraag">Waarom niet? Mag ook overslaan. De AI leert hiervan.</p><div class="chips reden">' + REDENEN.map(function (r) {
          return '<button type="button" class="chip" data-reden="' + esc(r) + '" data-id="' + esc(it.id) + '" aria-pressed="' + (b.reden === r) + '">' + r + "</button>";
        }).join("") + "</div>") + "</div>";
    }
    return '<div class="klaar' + (wacht || bezig ? " wacht" : "") + '"><div class="r1"><div class="wat"><b>' + kop + "</b><span>" +
      (wacht ? "Wordt geplaatst: " : bezig ? "Opslaan: " : "Geplaatst: ") + lijstTekst(b.k) + " · " + esc(LABEL[b.rubriek]) + (b.aangepast ? " · tekst aangepast" : "") + "</span></div>" + knop + "</div></div>";
  }

  // ---------- besluiten ----------
  // Ongedaan maken: het besluit wordt pas na vijf seconden naar de server
  // gestuurd. Een weggegooide synthese (review "weg") of een van de nieuwspagina
  // gehaalde publicatie is niet terug te zetten; wachten is dus het enige dat
  // voor elk soort bericht echt werkt. Verlaat je de pagina in die vijf seconden,
  // dan waarschuwt de browser. Naar de achtergrond gaan verkort de vijf
  // seconden niet; een bericht verdwijnt pas uit de werklijst na geslaagd opslaan.
  var blokTot = 0;
  // Na een tik krimpt de kaart en schuift de lijst op: 700 ms geen tikken op de lijst,
  // zodat een tweede tik niet op de volgende kaart, de bronlink of Ongedaan maken valt.
  document.addEventListener("click", function (e) {
    if (Date.now() < blokTot && e.target.closest && e.target.closest("#lijst")) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  function besluit(it, b) {
    blokTot = Date.now() + 700;
    st.bewaard[it.id] = it;
    b.tot = Date.now() + ONGEDAAN_MS; b.status = "wacht";
    delete st.fout[it.id]; delete st.open[it.id];
    st.besluit[it.id] = b;
    b.timer = setTimeout(function () { opslaan(it.id); }, ONGEDAAN_MS);
    tekenItem(it.id);
  }
  function opslaan(id) {
    var b = st.besluit[id], it = st.bewaard[id];
    if (!b || !it || b.status !== "wacht") return;
    clearTimeout(b.timer); b.status = "bezig"; tekenItem(id);
    uitvoer(it, b).then(function (d) {
      if (!d.ok) {
        delete st.besluit[id];
        if (d.gepubliceerd && it.soort === "concept") { it.soort = "publicatie"; it.kop = b.kop; it.tekst = b.tekst; }
        st.fout[id] = { tekst: d.fout || "Opslaan is mislukt.", bevestig: !!d.bevestigingNodig, b: b };
        if (d.bevestigingNodig) st.cn[id] = st.cn[id] || { k: b.k, rubriek: b.rubriek, kop: b.kop, tekst: b.tekst };
        tekenItem(id); return;
      }
      b.status = "klaar"; b.besluitId = d.besluit && d.besluit.id;
      st.gedaan[id] = { besluitId: b.besluitId, soort: b.soort };
      if (b.soort === "ja") {
        if (it.soort === "concept") { it.kop = b.kop; it.tekst = b.tekst; if (b.k.nieuwspagina) it.soort = "publicatie"; }
        if (it.wacht && b.k.nieuwspagina) it.wacht = false;
      } else if (it.soort !== "kandidaat" && it.soort !== "overheid") b.vast = true; // weggegooid/gedepubliceerd: niet terug te zetten
      delete st.cn[id];
      tekenItem(id); stuurReden(id);
    });
  }
  function stuurReden(id) {
    var b = st.besluit[id]; if (!b) return;
    var r = b.reden || "";
    if ( b.soort !== "nee" || b.status !== "klaar" || !b.besluitId || (b.redenGestuurd || "") === r) return;
    post("/api/selectie", { actie: "reden", id: b.besluitId, reden: r }).then(function (d) {
      if (d.ok) b.redenGestuurd = r; else toon("De reden is niet opgeslagen: " + (d.fout || "mislukt."), null);
    });
  }
  function eerst(it, b) {
    var g = st.gedaan[it.id];
    if (!g || !g.besluitId) return Promise.resolve({ ok: true });
    var stap = g.soort === "nee" && it.soort === "overheid" ? post("/api/review", { actie: "herstel-overheid", id: it.id }) : Promise.resolve({ ok: true });
    return stap.then(function (d) {
      if (!d.ok) return d;
      return post("/api/selectie", { actie: "herstel", id: g.besluitId }).then(function (r) { return r.ok || r.status === 404 ? { ok: true } : r; });
    });
  }
  function terugBijFout(besluitD, tweede) {
    return tweede.then(function (r) {
      if (r.ok || !besluitD.besluit) return r;
      return post("/api/selectie", { actie: "herstel", id: besluitD.besluit.id }).then(function () { return r; }, function () { return r; });
    });
  }
  // Eén besluit naar de server, per soort bericht (zie de stappen in REGIE.md).
  function uitvoer(it, b) {
    return eerst(it, b).then(function (v) {
      if (!v.ok) return v;
      var id = it.id, k = b.k, weg = b.soort === "nee";
      var zij = [];
      if (!weg && k.zijbalk) zij.push("zijbalk");
      if (!weg && k.infofrankrijk) zij.push("infofrankrijk");
      var act = { nieuwsbrief: !weg && !!k.nieuwsbrief, infopoche: !weg && !!k.infopoche };
      var elders = !weg && !!(k.nieuwspagina || k.nieuwsbrief || k.infopoche);
      var c = weg ? undefined : b.rubriek, reden = weg && b.reden ? b.reden : undefined;
      if (it.soort === "kandidaat") return post("/api/selectie", { actie: zij.length ? "go" : "nogo", id: id, categorie: c, kanalen: zij, reden: reden, voorstel: voorstelLijst(it) });
      if (it.soort === "overheid" || it.soort === "publicatie") {
        // Eén verzoek: besluit en (de)publiceren, verwijderen of kanalen gaan samen.
        // Overheid: ook op een regel onder "Al automatisch live" telt alleen de echte keuze: nieuwspagina aan = live:true (keuze:true), uit = van de site.
        return post("/api/selectie", { actie: "redactie", herkomst: it.soort, id: id, kanalen: weg ? [] : zij, categorie: c, elders: elders, opPagina: it.soort === "overheid" || it.wacht ? !!k.nieuwspagina : true, reden: reden, weg: weg || undefined, voorstel: voorstelLijst(it), act: weg || ((it.soort === "overheid" || it.wacht) && !k.nieuwspagina) ? undefined : act, live: !weg && (it.soort === "overheid" || it.wacht) && k.nieuwspagina ? true : undefined });
      }
      // concept: één verzoek volstaat (kop en tekst, publiceren en het redactiebesluit gaan mee),
      // zodat een sluitende pagina niets half achterlaat. Is een eerdere poging voor de helft
      // gelukt, dan is het bericht nu een publicatie (it.soort) en slaat de server publiceren over.
      var bewerkt = !weg && (b.kop !== it.kop || b.tekst !== it.tekst);
      if (!weg && k.nieuwspagina) {
        return post("/api/review", { actie: "publiceer", id: id, kop: b.kop, tekst: b.tekst, bevestigd: b.bevestigd === true, kanalen: act, selectie: { kanalen: zij, categorie: c, elders: elders, voorstel: voorstelLijst(it) } });
      }
      return post("/api/selectie", { actie: "redactie", herkomst: "concept", id: id, kanalen: zij, categorie: c, reden: reden, voorstel: voorstelLijst(it), kop: bewerkt ? b.kop : undefined, tekst: bewerkt ? b.tekst : undefined, weg: weg || undefined });
    });
  }

  // ---------- melding onderaan ----------
  var toastTimer = 0, toastTerug = null;
  function toon(tekst, terug) {
    var m = $("toast"); if (!m) return;
    m.hidden = false; m.querySelector(".t").textContent = tekst;
    m.querySelector("button").hidden = !terug; toastTerug = terug;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { m.hidden = true; toastTerug = null; }, ONGEDAAN_MS);
  }

  // ---------- gebeurtenissen ----------
  function maakK(it, k) { return schoon(it, k); }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    var d = t.dataset, it;
    if (d.opnieuw) { laad(); return; }
    if (d.tab) { kiesTab(d.tab); return; }
    if (d.uit) { if (st.uit[d.uit]) delete st.uit[d.uit]; else st.uit[d.uit] = true; tekenItem(d.uit); return; }
    if (d.redenopen) { st.redenOpen[d.redenopen] = true; tekenItem(d.redenopen); return; }
    if (d.ja) { it = vind(d.ja); if (it && r17(it)) { besluit(it, { soort: "nee", k: {}, rubriek: rubriekVoorstel(it) }); return; } if (it) besluit(it, { soort: "ja", k: voorstelK(it), rubriek: rubriekVoorstel(it), kop: it.kop, tekst: it.tekst || "", aangepast: false }); return; }
    if (d.zb) { it = vind(d.zb); if (it) besluit(it, { soort: "ja", k: schoon(it, { zijbalk: true }), rubriek: rubriekVoorstel(it), kop: it.kop, tekst: it.tekst || "", aangepast: false }); return; }
    if (d.nee) { it = vind(d.nee); if (it) besluit(it, { soort: "nee", k: {}, rubriek: rubriekVoorstel(it) }); return; }
    if (d.anders) { st.open[d.anders] = true; tekenItem(d.anders); var x = document.querySelector('[data-item="' + d.anders + '"] .anders'); if (x) x.scrollIntoView({ block: "nearest" }); return; }
    if (d.sluit) { delete st.open[d.sluit]; tekenItem(d.sluit); return; }
    if (d.plek) {
      it = vind(d.id); if (!it) return;
      var c = conceptVan(it), k = Object.assign({}, c.k), was = !!k[d.plek];
      if (plekMag(it, d.plek, k) && !vast(it, d.plek)) return;
      k[d.plek] = !was;
      // Nieuwspagina uit: nieuwsbrief en Infopoche gaan mee uit.
      if (d.plek === "nieuwspagina") k.nieuwsbrief = k.infopoche = k.nieuwspagina;
      c.k = k; tekenItem(d.id); return;
    }
    if (d.rub) { it = vind(d.id); if (it) { conceptVan(it).rubriek = d.rub; tekenItem(d.id); } return; }
    if (d.zo) {
      it = vind(d.zo); if (!it) return;
      var c3 = conceptVan(it), p = schoon(it, c3.k);
      if (!PLEKKEN.some(function (q) { return p[q[0]]; })) return;
      besluit(it, { soort: "ja", k: p, rubriek: c3.rubriek, kop: c3.kop, tekst: c3.tekst, aangepast: it.soort === "concept" && (c3.kop !== it.kop || c3.tekst !== (it.tekst || "")) });
      return;
    }
    if (d.bevestig) {
      var f = st.fout[d.bevestig]; it = vind(d.bevestig);
      if (f && f.b && it) { f.b.bevestigd = true; besluit(it, f.b); }
      return;
    }
    if (d.terug) {
      var b = st.besluit[d.terug];
      if (b && b.status === "wacht") { clearTimeout(b.timer); delete st.besluit[d.terug]; tekenItem(d.terug); }
      return;
    }
    if (d.wijzig) {
      var b2 = st.besluit[d.wijzig]; it = st.bewaard[d.wijzig];
      if (!b2 || !it || b2.status !== "klaar") return;
      delete st.besluit[d.wijzig];
      st.cn[d.wijzig] = b2.soort === "ja" ? { k: Object.assign({}, b2.k), rubriek: b2.rubriek, kop: b2.kop, tekst: b2.tekst } : null;
      if (!st.cn[d.wijzig]) delete st.cn[d.wijzig];
      st.open[d.wijzig] = true; tekenItem(d.wijzig); return;
    }
    if (d.reden) {
      var b3 = st.besluit[d.id]; if (!b3) return;
      b3.reden = b3.reden === d.reden ? "" : d.reden;
      tekenItem(d.id); stuurReden(d.id); return;
    }
    if (d.rest) {
      var ids = openLosseKranten();
      ids.forEach(function (q) { besluit(q, { soort: "nee", rest: true, k: {}, rubriek: rubriekVoorstel(q) }); });
      var nr = ids.map(function (q) { return q.id; });
      toon(nr.length + (nr.length === 1 ? " bericht" : " berichten") + " niet geplaatst.", function () {
        nr.forEach(function (id) { var b4 = st.besluit[id]; if (b4 && b4.status === "wacht") { clearTimeout(b4.timer); delete st.besluit[id]; tekenItem(id); } });
      });
      return;
    }
    if (d.toastTerug) { if (toastTerug) toastTerug(); toastTerug = null; var m = $("toast"); if (m) m.hidden = true; return; }
    if (d.toch) {
      if (st.toch.indexOf(d.toch) < 0) st.toch.push(d.toch);
      var open1 = (document.querySelector("[data-aiweg]") || {}).open;
      bouw(); tekenLijst(); $("aiweg").innerHTML = aiWegHtml(true); kiesTab("beslis");
      var nw = document.querySelector('[data-item="' + d.toch + '"]'); if (nw) nw.scrollIntoView({ block: "nearest" });
      return;
    }
    if (d.autoWeg) {
      var id5 = d.autoWeg, was5 = !!st.autoWeg[id5];
      st.autoBezig[id5] = true; herAuto();
      post("/api/review", was5 ? { actie: "herstel-overheid", id: id5 } : { actie: "verwijder-overheid", id: id5 }).then(function (r) {
        delete st.autoBezig[id5];
        if (r.ok) { if (was5) delete st.autoWeg[id5]; else st.autoWeg[id5] = true; } else toon((was5 ? "Terugzetten" : "Weghalen") + " is mislukt: " + (r.fout || "probeer het opnieuw."), null);
        herAuto();
      });
      return;
    }
  });
  // Tab wisselen zonder opnieuw te tekenen: de melding onderaan (Ongedaan maken) en
  // getypte tekst blijven staan.
  function kiesTab(t) {
    st.tab = t;
    ["beslis", "live", "weg"].forEach(function (k) {
      var paneel = $(k === "beslis" ? "beslis" : k === "live" ? "auto" : "aiweg");
      if (paneel) paneel.hidden = k !== t;
      var knop = document.querySelector('[data-tab="' + k + '"]');
      if (knop) knop.setAttribute("aria-selected", String(k === t));
    });
    if (t === "beslis") $("lijst").querySelectorAll("textarea").forEach(groeiTekst);
  }
  function herAuto() { var o = (document.querySelector("[data-auto]") || {}).open; $("auto").innerHTML = autoHtml(o); }
  $("ververs").addEventListener("click", function () {
    var open = Object.keys(st.besluit).some(function (id) { return st.besluit[id].status !== "klaar"; });
    if (open) { toon("Wacht even: er wordt nog iets opgeslagen.", null); return; }
    laad();
  });
  function groeiTekst(veld) {
    veld.style.height = "auto";
    veld.style.height = (veld.scrollHeight + 2) + "px";
  }
  document.addEventListener("input", function (e) {
    var t = e.target; if (!t || !t.dataset) return;
    var it;
    if (t.dataset.kop) { it = vind(t.dataset.kop); if (it) conceptVan(it).kop = t.value; }
    if (t.dataset.tekst) { it = vind(t.dataset.tekst); if (it) conceptVan(it).tekst = t.value; groeiTekst(t); }
  });
  // Aftellen: werkt alleen de knoptekst bij, nooit de kaart (getypte tekst blijft staan).
  setInterval(function () {
    var nu = Date.now();
    Object.keys(st.besluit).forEach(function (id) {
      var b = st.besluit[id]; if (b.status !== "wacht") return;
      var kn = document.querySelector('[data-terug="' + id + '"]');
      if (kn) kn.textContent = "Ongedaan maken (" + Math.max(0, Math.ceil((b.tot - nu) / 1000)) + ")";
    });
  }, 250);
  window.addEventListener("beforeunload", function (e) {
    var wacht = Object.keys(st.besluit).some(function (id) { return st.besluit[id].status !== "klaar"; });
    if (wacht) { e.preventDefault(); e.returnValue = ""; }
  });
  // Bij echt sluiten gaat wat nog wacht meteen weg (keepalive).
  function spoel() {
    wegGaand = true;
    Object.keys(st.besluit).forEach(function (id) { if (st.besluit[id].status === "wacht") opslaan(id); });
  }
  document.addEventListener("visibilitychange", function () {
    wegGaand = document.visibilityState === "hidden";
  });
  window.addEventListener("pagehide", spoel);

  window.__redactie = { st: st };
  laad();
})();
</script>
