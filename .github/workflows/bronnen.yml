# Kandidaat-bronnen verkennen vóórdat ze in bronnen.json belanden.
# ---------------------------------------------------------------------------
# Handmatig te starten. Draait scripts/verken-bronnen.mjs vanaf een
# GitHub-runner, die onbelemmerd het web op kan — een ontwikkelomgeving achter
# een egress-policy krijgt op .gouv.fr en .nl een 403 en kan dus niets
# vaststellen.
#
# Per opgegeven site: welke feeds hij aankondigt, of die werken, hoeveel items
# ze bevatten, hoe oud het nieuwste item is, en welke licentiesporen er op de
# site staan. Dat laatste is een AANWIJZING, geen toestemming — de licentie
# blijft mensenwerk.
#
# Net als de sonde en de meting: bewust ZONDER npm ci, het script is
# dependency-vrij. De invoer "browser" is de uitzondering: die installeert een
# Chromium en laat de pagina echt uitvoeren. Nodig voor sites die hun inhoud
# pas in de browser opbouwen — rijksoverheid.nl levert 223 kB HTML met 25
# links, want de feedlijst wordt daar door JavaScript neergezet. Duurder
# (~1 minuut installatie), dus alleen aanzetten als de gewone stand niets
# vindt op een site waarvan je weet dat er wél iets is.

name: Bronnen verkennen

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs, gescheiden door spaties of komma’s'
        type: string
        required: true
      dump:
        description: 'Toon ook de ruwe HTML die de runner binnenkrijgt (diagnose)'
        type: boolean
        required: false
        default: false
      browser:
        description: 'Laat een browser de pagina uitvoeren (voor sites die hun inhoud met JavaScript opbouwen)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bronnen-verkennen
  cancel-in-progress: false

jobs:
  verkennen:
    name: Feeds en licentiesporen van kandidaat-bronnen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Alleen voor de browserstand: de gewone verkenner is dependency-vrij en
      # heeft hier niets aan. --no-save omdat playwright-core niet in
      # package.json hoort — de productie-app op Vercel heeft geen browser nodig.
      - name: Chromium installeren
        if: ${{ inputs.browser }}
        run: |
          npm install --no-save playwright-core@1.49.1
          npx --yes playwright@1.49.1 install --with-deps chromium

      - name: Verkennen
        env:
          BRONNEN: ${{ inputs.urls }}
          BRON_DUMP: ${{ inputs.dump && '1' || '' }}
        run: |
          script=scripts/verken-bronnen.mjs
          [ "${{ inputs.browser }}" = "true" ] && script=scripts/verken-render.mjs
          node "$script" | tee -a "$GITHUB_STEP_SUMMARY"
