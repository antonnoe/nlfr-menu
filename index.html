<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>NLFR hoofdmenu</title>
<!--
  NLFR HOOFDMENU — externe versie voor GitHub/Vercel
  Basis: versie 29-07-2026. MOBIELE HERZIENING + AUTO-DARK-FIX (01-08-2026).

  Dit bestand wordt gehost op Vercel en op nederlanders.fr geladen via een
  iframe. Zie README.md voor de bijbehorende embedcode en beheerinstructies.

  WAT IS ER GEWIJZIGD T.O.V. 29-07-2026 (alleen weergave, geen inhoud verloren)
  1. KLACHT: home en "Alle berichten" waren op mobiel niet meer aan te klikken.
     Op smalle schermen (<= 700px) staat nu bovenaan een vaste rij:
     [Home] [Alle berichten] [Zoeken]. Home is een echte 48px-knop i.p.v. de
     smalle verticale strip; "Alle berichten" is de bordeaux hoofdknop.
  2. KLACHT: dark mode was onleesbaar. Chrome/Android donkerde het menu zelf in
     ("auto dark theme"). Opgelost met color-scheme: only light (meta + CSS) en
     expliciete achtergrondkleuren op elk paneel, zodat er niets meer valt om te
     inverteren. Het menu blijft dus altijd licht.
  3. Op mobiel klapt de zoekbalk in tot een loep-icoon (scheelt een hele regel)
     en zijn de uitklappanelen accordeons: groepen dicht, één open tegelijk,
     met het aantal links erachter. Geen honderden pixels scrollen meer.
  4. Op mobiel staan bovenaan elk paneel snelkoppelingen (MOBILE_QUICK) en
     worden enkele lange lijsten ingekort (MOBILE_HIDE / TOPICS_MOBILE_MAX).
     Op tablet/desktop is alles onveranderd zichtbaar.
  5. Alle raakvlakken op mobiel zijn minimaal 44px hoog.

  ONDERHOUD — alles wat je normaal wijzigt staat in het <script>-blok:
  - DOORS ........ inhoud van de uitklapmenu's (Lezen/Meedoen/Vinden/Nieuws)
  - MEMBER_GROUPS  ledenmenu (Mijn NLFR, ingelogd)
  - TOPICS ....... het "Onderwerpen"-uitklapmenu
  - CTAS ......... de drie actiekaarten bovenin "Onderwerpen"
  - ADMIN_LINKS .. beheerlinks
  - bandleft ..... de knoppenbalk onderin (incl. de knop "Nu actueel")
  - MOBILE_QUICK / MOBILE_HIDE .. wat op mobiel bovenaan staat resp. wegvalt
  De knop "Nu actueel" toont linkjes die LIVE uit actueel.json komen.
  Beheer-ID: ADMIN_ID. Zoek-app-URL: ZOEK_APP.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* --- Auto-dark blokkeren: het menu is een lichte kaart, altijd. --- */
  :root { color-scheme: only light; --brand: #800000; --actueel: #2f6b3a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Mulish', system-ui, sans-serif; line-height: 1.6; color: #3a3330; padding: 6px; }
  a { color: var(--brand); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input::placeholder { color: #9a8f8c; }
  input:focus { outline: none; }
  .card { background: #fff; border: 1px solid rgba(128,0,0,.12); border-radius: 18px; box-shadow: 0 12px 40px -26px rgba(90,0,0,.55); overflow: hidden; }
  .top { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: #fff; }

  /* --- Mobiele hoofdrij: Home / Alle berichten / Zoeken (alleen <=700px) --- */
  .ecotoggle { display: none; }
  .mbar { display: none; gap: 8px; align-items: stretch; }
  .mbar .mhome, .mbar .msearch { flex: 0 0 auto; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; color: var(--brand); border: 1px solid rgba(128,0,0,.18); background: rgba(128,0,0,.05); }
  .mbar .mmenu { display: none; flex: 0 0 auto; width: 48px; height: 48px; place-items: center; border-radius: 12px; color: var(--brand); border: 1px solid rgba(128,0,0,.18); background: rgba(128,0,0,.05); }
  .mbar .msearch.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .mbar .mforum { flex: 1 1 auto; min-width: 0; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: var(--brand); color: #fff; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 15px; white-space: nowrap; }

  .searchrow { display: flex; align-items: stretch; gap: 8px; }
  .searchform { flex: 2 1 0; min-width: 0; display: flex; }
  .searchbox { display: flex; align-items: center; gap: 7px; flex: 1 1 auto; min-width: 0; background: #fff; border: 1.5px solid rgba(128,0,0,.16); border-radius: 11px; padding: 3px 3px 3px 12px; transition: border-color .18s, box-shadow .18s; }
  .searchbox.focus { border-color: rgba(128,0,0,.45); box-shadow: 0 8px 24px -14px rgba(128,0,0,.4); }
  .searchbox input { flex: 1 1 auto; border: none; background: transparent; font-size: 15px; color: #3a3330; padding: 7px 0; min-width: 0; }
  .zoek { display: inline-flex; align-items: center; gap: 6px; background: var(--brand); color: #fff; border: none; border-radius: 9px; padding: 8px 15px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 13.5px; flex: 0 0 auto; transition: filter .12s, transform .12s; }
  .zoek:hover { filter: brightness(1.09); transform: translateY(-1px); }
  .clear { display: none; place-items: center; width: 28px; height: 28px; border-radius: 999px; border: none; background: rgba(128,0,0,.06); color: #8a7f7c; flex: 0 0 auto; }
  .clear.show { display: grid; }

  .pull { position: relative; flex: 1 1 0; min-width: 0; display: flex; }
  .pull-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; border-radius: 11px; border: 1.5px solid rgba(128,0,0,.18); background: rgba(128,0,0,.05); color: var(--brand); transition: background .15s, border-color .15s; }
  .pull-btn:hover { background: rgba(128,0,0,.09); }
  .pull-btn.active { background: #fff; border-color: var(--brand); }
  .pull-btn .lbl { display: inline-flex; align-items: center; gap: 8px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caret { transition: transform .2s; flex: 0 0 auto; }
  .active .caret, .door.active .caret { transform: rotate(180deg); }

  .navrow { display: flex; align-items: stretch; gap: 8px; }
  .home, .admin { display: grid; place-items: center; width: 46px; flex: 0 0 auto; border-radius: 12px; color: var(--brand); border: 1px solid rgba(128,0,0,.16); background: rgba(128,0,0,.05); }
  .home:hover, .admin:hover { background: rgba(128,0,0,.10); }
  .admin { display: none; }
  .admin.show { display: grid; }
  .admin.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .doors { display: flex; gap: 8px; flex: 1 1 auto; }
  .door { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 7px 6px; border-radius: 12px; line-height: 1.15; border: 1px solid rgba(128,0,0,.14); background: rgba(128,0,0,.04); color: var(--brand); transition: background .15s, border-color .15s; }
  .door:hover { background: rgba(128,0,0,.09); }
  .door.active { background: #fff; border-color: rgba(128,0,0,.35); box-shadow: inset 0 -3px 0 var(--brand); }
  .door .t { display: inline-flex; align-items: center; gap: 6px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 15px; }
  .door .s { font-size: 11px; color: #9a8f8c; }
  .door.active .s { color: var(--brand); }
  .door.locked { color: #8a7f7c; }

  .drawer { display: none; border-top: 1px solid rgba(128,0,0,.10); background: #fdfbfa; padding: 18px; animation: az .24s cubic-bezier(.16,1,.3,1) both; }
  .drawer.open { display: block; }
  @keyframes az { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.5); } }

  .cols { display: grid; gap: 8px 26px; }
  .grp .h { font-family: 'Poppins',sans-serif; font-weight: 700; font-size: 12.5px; color: var(--brand); margin-bottom: 7px; padding-bottom: 6px; border-bottom: 1px solid rgba(128,0,0,.12); }
  .grp .h .cnt, .grp .h .gcaret { display: none; }
  .grp .lk { display: flex; flex-direction: column; gap: 1px; }
  .drawer a.item { display: block; padding: 5px 10px; color: #5b524f; font-size: 13.5px; border-left: 2px solid rgba(128,0,0,.14); border-radius: 0 6px 6px 0; transition: background .12s, color .12s, border-color .12s; }
  .drawer a.item:hover { background: rgba(128,0,0,.06); color: var(--brand); border-color: var(--brand); }
  .drawer a.item.emph { color: var(--brand); border-left-color: rgba(128,0,0,.4); }
  .drawer a.accent { display: block; padding: 7px 12px; margin: 2px 0; border-radius: 8px; background: var(--brand); color: #fff; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 13.5px; }
  .drawer a.accent:hover { filter: brightness(1.1); }
  /* Steun-knoppen (Doneer / Word sponsor / Word abonnee) in het Meedoen-paneel:
     lichte kaartstijl i.p.v. massief bordeaux. */
  .drawer a.support { display: block; padding: 7px 12px; margin: 2px 0; border-radius: 8px; background: rgba(128,0,0,.06); color: var(--brand); border: 1px solid rgba(128,0,0,.20); font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 13.5px; }
  .drawer a.support:hover { background: rgba(128,0,0,.12); }

  /* Snelkoppelingen bovenaan een paneel op mobiel */
  .quick { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid rgba(128,0,0,.10); }
  .quick a { min-height: 40px; display: inline-flex; align-items: center; padding: 8px 13px; border-radius: 10px; background: rgba(128,0,0,.06); border: 1px solid rgba(128,0,0,.20); color: var(--brand); font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 13.5px; }

  .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .cta { display: flex; flex-direction: column; gap: 1px; flex: 1 1 200px; border-radius: 12px; padding: 12px 18px; }
  .cta .ct { font-family: 'Poppins',sans-serif; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 7px; }
  .cta .cs { font-size: 13px; }
  .cta.fill { background: var(--brand); color: #fff; }
  .cta.fill:hover { filter: brightness(1.1); }
  .cta.fill .cs { opacity: .85; }
  .cta.tint { background: rgba(128,0,0,.07); color: var(--brand); border: 1px solid rgba(128,0,0,.2); }
  .cta.tint:hover { background: rgba(128,0,0,.12); }
  .cta.tint .cs { color: #8a7f7c; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--brand); animation: pulse 1.6s ease-in-out infinite; }
  .cta.fill .dot { background: #fff; }

  .teaser h3 { font-family: 'Poppins',sans-serif; font-weight: 700; font-size: 18px; margin: 0 0 6px; color: #5c0f0f; }
  .teaser p { margin: 0 0 12px; font-size: 14px; color: #6d6360; }
  .perks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; margin: 0 0 16px; max-width: 640px; }
  .perk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5b524f; }
  .teaser .btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn-p { background: var(--brand); color: #fff; padding: 11px 20px; border-radius: 10px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-p:hover { filter: brightness(1.1); }
  .btn-o { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); padding: 11px 20px; border-radius: 10px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-o:hover { background: rgba(128,0,0,.06); }
  .adminlinks { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .adminlinks .h { font-family: 'Poppins',sans-serif; font-weight: 700; font-size: 12px; color: #8a7f7c; margin-right: 4px; }
  .adminlinks a { padding: 6px 12px; font-size: 13px; color: #5b524f; border-radius: 8px; background: #fff; border: 1px solid rgba(128,0,0,.12); font-weight: 600; }
  .adminlinks a:hover { background: rgba(128,0,0,.06); color: var(--brand); }

  /* "Nu actueel"-rij in de drawer — groene accentkleur (--actueel). */
  .actueellinks { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .actueellinks .h { font-family: 'Poppins',sans-serif; font-weight: 700; font-size: 12px; color: var(--brand); margin-right: 4px; }
  .actueellinks a { padding: 6px 12px; font-size: 13px; color: var(--actueel); border-radius: 8px; background: rgba(47,107,58,.07); border: 1px solid rgba(47,107,58,.35); font-weight: 600; }
  .actueellinks a:hover { background: rgba(47,107,58,.14); }

  .band { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; border-top: 1px solid rgba(128,0,0,.1); background: #fdf9f8; }
  .band .left { display: flex; gap: 8px; flex-wrap: wrap; }
  .band .left a, .band .left button { padding: 8px 16px; border-radius: 9px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .band .left button { display: inline-flex; align-items: center; gap: 7px; line-height: 1; }
  .band .left a.light, .band .left button.light { background: rgba(128,0,0,.06); color: var(--brand); border: 1px solid rgba(128,0,0,.18); }
  .band .left a.light:hover, .band .left button.light:hover { background: rgba(128,0,0,.11); }
  .band .left a.fill { background: var(--brand); color: #fff; }
  .band .left a.fill:hover { filter: brightness(1.1); }
  .eco { display: flex; align-items: center; gap: 10px; font-size: 13.5px; white-space: nowrap; }
  .eco .pfx { color: #a99e9a; }
  .eco a { font-family: 'Poppins',sans-serif; font-weight: 600; }
  .eco .sep { color: rgba(128,0,0,.3); }

  @media (max-width: 1040px) { .eco .pfx { display: none; } }
  @media (max-width: 820px) {
    .searchrow { flex-wrap: wrap; }
    .searchform, .pull { flex: 1 1 100%; }
    .doors { flex-wrap: wrap; }
    .door { flex: 1 1 42%; }
    .cols { grid-template-columns: 1fr 1fr !important; }
  }

  /* ================= MOBIEL (<= 700px) ================= */
  @media (max-width: 700px) {
    body { padding: 4px; }
    .top { padding: 8px; gap: 8px; }

    /* Vaste hoofdrij zichtbaar; oude smalle home-strip verdwijnt */
    .mbar { display: flex; }
    .home { display: none; }

    /* Zoekbalk ingeklapt tot de loep in .mbar; opent bij tikken */
    .searchform { display: none; }
    .searchform.open { display: flex; flex: 1 1 100%; }
    .searchbox { border-color: rgba(128,0,0,.35); }
    .searchbox input { font-size: 16px; padding: 9px 0; } /* 16px: geen zoom op iOS */
    .zoek { padding: 11px 15px; font-size: 14px; }

    /* Onderwerpen volle breedte, daaronder de knoppen 2 per rij */
    .pull-btn { min-height: 46px; }
    .navrow { flex-wrap: wrap; }
    .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
    .door { flex: none; min-height: 46px; flex-direction: row; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 12px; text-align: left; }
    .door .t { font-size: 15px; }
    .door .t .caret { margin-left: auto; }
    .admin { width: 100%; min-height: 46px; }

    /* Panelen: accordeon, één groep open */
    .drawer { padding: 10px; }
    .cols { grid-template-columns: 1fr !important; gap: 6px; }
    .grp { border: 1px solid rgba(128,0,0,.12); border-radius: 12px; background: #fff; overflow: hidden; }
    .grp .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; min-height: 46px; padding: 10px 13px; border-bottom: none; font-size: 14px; cursor: pointer; }
    .grp.open .h { background: rgba(128,0,0,.09); }
    .grp .h .cnt { display: inline; font-family: 'Mulish',sans-serif; font-size: 11.5px; color: #a99e9a; font-weight: 600; margin-left: auto; }
    .grp .h .gcaret { display: inline-grid; place-items: center; transition: transform .2s; flex: 0 0 auto; }
    .grp.open .h .gcaret { transform: rotate(180deg); }
    .grp .lk { display: none; padding: 2px 8px 8px; }
    .grp.open .lk { display: flex; }
    .drawer a.item { min-height: 44px; display: flex; align-items: center; padding: 6px 10px; font-size: 14.5px; border-radius: 0 8px 8px 0; }
    .drawer a.accent, .drawer a.support { min-height: 44px; display: flex; align-items: center; font-size: 14px; }

    /* Actiekaarten en teaser */
    .ctas { flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .cta { flex: none; padding: 11px 14px; }
    .perks { grid-template-columns: 1fr; }
    .btn-p, .btn-o { flex: 1 1 100%; text-align: center; }

    /* Onderbalk: 2 per rij, zusterplatforms achter "meer" */
    .band { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
    .band .left { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .band .left a, .band .left button { min-height: 44px; display: flex; align-items: center; justify-content: center; padding: 10px 12px; font-size: 14px; }
    .eco { display: none; flex-wrap: wrap; white-space: normal; justify-content: center; }
    .eco.open { display: flex; }
    .ecotoggle { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: none; background: transparent; color: #8a7f7c; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 13px; }
    .actueellinks a { min-height: 40px; display: inline-flex; align-items: center; }
  }

  /* ============ COMPACTE MODUS ============
     Standaard actief op elk scherm <= 700px, en te forceren met ?compact=1
     (of uit te zetten met ?compact=0) achter de iframe-URL. Dicht is het menu
     dan ~70px hoog i.p.v. ~450px, zodat de pagina eronder niet wordt
     weggedrukt. Alles blijft bereikbaar via de hamburger. */
  html.compact body { padding: 3px; }
  html.compact .card { border-radius: 14px; box-shadow: 0 6px 18px -14px rgba(90,0,0,.5); }
  html.compact .top { padding: 7px; gap: 7px; }
  html.compact .mbar { display: flex; }
  html.compact .mbar .mmenu { display: grid; }
  html.compact .mbar .mmenu.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  html.compact .home { display: none; }
  html.compact .searchrow { flex-wrap: wrap; gap: 7px; }
  html.compact .searchform { display: none; }
  html.compact .searchform.open { display: flex; flex: 1 1 100%; }
  html.compact .searchbox { border-color: rgba(128,0,0,.35); }
  html.compact .searchbox input { font-size: 16px; padding: 9px 0; }
  /* Dicht: alleen de hoofdrij. Open (hamburger): de rest verschijnt. */
  html.compact .pull, html.compact .navrow, html.compact .band { display: none; }
  html.compact.menuopen .pull { display: flex; flex: 1 1 100%; }
  html.compact.menuopen .navrow { display: flex; flex-wrap: wrap; }
  html.compact.menuopen .band { display: flex; }
  html.compact .pull-btn { min-height: 46px; }
  html.compact .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  html.compact .door { flex: none; min-height: 46px; flex-direction: row; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 12px; text-align: left; }
  html.compact .door .t { font-size: 15px; }
  html.compact .door .t .caret { margin-left: auto; }
  html.compact .admin { width: 100%; min-height: 46px; }
  /* Geen max-height/interne scroll: het iframe groeit mee via postMessage en de
     pagina eromheen scrollt \u2014 een scrollbalk in een scrollbalk is op mobiel
     onwerkbaar. */
  html.compact .drawer { padding: 10px; }
  html.compact .cols { grid-template-columns: 1fr !important; gap: 6px; }
  html.compact .grp { border: 1px solid rgba(128,0,0,.12); border-radius: 12px; background: #fff; overflow: hidden; }
  html.compact .grp .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; min-height: 46px; padding: 10px 13px; border-bottom: none; font-size: 14px; cursor: pointer; }
  html.compact .grp.open .h { background: rgba(128,0,0,.09); }
  html.compact .grp .h .cnt { display: inline; font-family: 'Mulish',sans-serif; font-size: 11.5px; color: #a99e9a; font-weight: 600; margin-left: auto; }
  html.compact .grp .h .gcaret { display: inline-grid; place-items: center; transition: transform .2s; flex: 0 0 auto; }
  html.compact .grp.open .h .gcaret { transform: rotate(180deg); }
  html.compact .grp .lk { display: none; padding: 2px 8px 8px; }
  html.compact .grp.open .lk { display: flex; }
  html.compact .drawer a.item { min-height: 44px; display: flex; align-items: center; padding: 6px 10px; font-size: 14.5px; border-radius: 0 8px 8px 0; }
  html.compact .drawer a.accent, html.compact .drawer a.support { min-height: 44px; display: flex; align-items: center; font-size: 14px; }
  html.compact .ctas { flex-direction: column; gap: 8px; margin-bottom: 12px; }
  html.compact .cta { flex: none; padding: 11px 14px; }
  html.compact .perks { grid-template-columns: 1fr; }
  html.compact .btn-p, html.compact .btn-o { flex: 1 1 100%; text-align: center; }
  html.compact .band { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }

  // ---- Build nav ----
  var doorsEl = document.getElementById("doors");
  var lock = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.85"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var caret = '<svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var gcaret = '<span class="gcaret"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span>';
  function doorHTML(d){
    var locked = (d[0] === "mijn" && !isMember);
    return { locked: locked, html: '<span class="t">' + d[1] + caret + (locked ? lock : '') + '</span><span class="s">' + d[2] + '</span>' };
  }
  DOOR_DEFS.forEach(function(d){
    var b = document.createElement("button");
    var dh = doorHTML(d);
    b.className = "door" + (dh.locked ? " locked" : "");
    b.setAttribute("data-door", d[0]);
    b.innerHTML = dh.html;
    doorsEl.appendChild(b);
  });

  // ---- Build band ----
  document.getElementById("bandleft").innerHTML =
    link(U("/profiles/blog/new"),"Plaats bericht","light") +
    link(U("/page/betaalpagina-berichten"),"Plaats advertentie","light") +
    link(U("/diensten"),"Diensten","fill") +
    '<button type="button" class="light" id="actueelbtn"><span class="dot" id="actueeldot" style="display:none"></span>Nu actueel</button>';

  // ---- Admin button ----
  var adminBtn = document.getElementById("adminbtn");
  function syncAdminBtn(){ adminBtn.classList.toggle("show", isAdmin); }
  syncAdminBtn();

  // ---- Drawer rendering ----
  var drawer = document.getElementById("drawer");

  function quickHTML(target){
    if (!isNarrow()) return "";
    var items = (MOBILE_QUICK[target] || []).slice();
    if (target === "mijn") { if (!isMember) return ""; items = [["Mijn pagina", myPage],["Mijn berichten", U("/profiles/blog/list?user="+uid)]]; }
    if (!items.length) return "";
    return '<div class="quick">' + items.map(function(l){ return link(l[1], l[0], ""); }).join("") + '</div>';
  }

  function groupsHTML(groups, cols, target){
    var narrow = isNarrow();
    var hide = (narrow && MOBILE_HIDE[target]) ? MOBILE_HIDE[target] : [];
    var list = groups.filter(function(g){ return hide.indexOf(g[0]) === -1; });
    var h = '<div class="cols" style="grid-template-columns:repeat('+cols+',1fr)">';
    list.forEach(function(g, i){
      // Op mobiel is elke groep een accordeon; de eerste staat open.
      var open = narrow && i === 0;
      h += '<div class="grp'+(open ? " open" : "")+'"><div class="h" role="button" tabindex="0">'+g[0]+'<span class="cnt">'+g[1].length+'</span>'+gcaret+'</div><div class="lk">';
      g[1].forEach(function(l){
        // Derde element: string = eigen klasse (bv. "support"), truthy = "accent",
        // leeg = gewoon "item". Vierde element (optioneel) forceert het target.
        var cls = (typeof l[2] === "string") ? l[2] : (l[2] ? "accent" : "item");
        h += link(l[1], l[0], cls, l[3]);
      });
      h += '</div></div>';
    });
    return h + '</div>';
  }

  function build(target){
    if (DOORS[target]) { drawer.innerHTML = quickHTML(target) + groupsHTML(DOORS[target].groups, isNarrow() ? 1 : DOORS[target].cols, target); bindGroups(); return; }
    if (target === "mijn") {
      if (isMember) { drawer.innerHTML = quickHTML("mijn") + groupsHTML(memberGroups(), isNarrow() ? 1 : 2, "mijn"); bindGroups(); return; }
      var p = PERKS.map(function(x){ return '<div class="perk"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'+x+'</div>'; }).join("");
      drawer.innerHTML = '<div class="teaser"><h3>Word gratis lid — dan kan er meer</h3><p>Als lid heeft u opties die bezoekers niet zien:</p><div class="perks">'+p+'</div><div class="btns">'+
        '<a class="btn-p" href="'+U("/main/authorization/signUp")+'" target="_parent">Word lid — gratis</a>'+
        '<a class="btn-o" href="'+U("/main/authorization/signIn")+'" target="_parent">Meld je aan</a></div></div>';
      return;
    }
    if (target === "admin") {
      drawer.innerHTML = '<div class="adminlinks"><span class="h">Beheer</span>' + ADMIN_LINKS.map(function(l){ return link(l[1], l[0], ""); }).join("") + '</div>';
      return;
    }
    if (target === "actueel") { drawer.innerHTML = actueelHTML(); return; }
    if (target === "msite") { drawer.innerHTML = msiteHTML(); return; }
    if (target === "topics") {
      var narrow = isNarrow();
      var c = '<div class="ctas">' + CTAS.map(function(x){
        var title = (x.live ? '<span class="dot"></span>' : '') + x.t;
        return '<a class="cta '+(x.fill?"fill":"tint")+'" href="'+x.href+'" target="'+tgt(x.href)+'"'+(tgt(x.href)==="_blank"?' rel="noopener"':'')+'><span class="ct">'+title+'</span><span class="cs">'+x.s+'</span></a>';
      }).join("") + '</div>';
      var topics = narrow ? TOPICS.slice(0, TOPICS_MOBILE_MAX) : TOPICS;
      c += '<div class="cols" style="grid-template-columns:'+(narrow ? '1fr' : 'repeat(auto-fill,minmax(160px,1fr))')+';gap:1px 18px">';
      topics.forEach(function(t){ c += link(t[1], t[0], t[2] ? "item emph" : "item"); });
      if (narrow && TOPICS.length > TOPICS_MOBILE_MAX) c += link(U("/page/rubrieken"), "Alle onderwerpen →", "item emph");
      c += '</div>';
      drawer.innerHTML = c;
      return;
    }
    drawer.innerHTML = "";
  }

  // Accordeon: één groep open tegelijk (alleen zichtbaar effect op mobiel).
  function bindGroups(){
    Array.prototype.forEach.call(drawer.querySelectorAll(".grp > .h"), function(h){
      function toggle(){
        var grp = h.parentNode, wasOpen = grp.classList.contains("open");
        Array.prototype.forEach.call(drawer.querySelectorAll(".grp"), function(g){ g.classList.remove("open"); });
        if (!wasOpen) grp.classList.add("open");
        report();
      }
      h.addEventListener("click", toggle);
      h.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
  }

  // ---- "Nu actueel" — compacte rij linkjes uit actueel.json
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function actueelLink(k){
    var href = (k && k.href) ? String(k.href) : "#";
    var t = tgt(href), rel = (t === "_blank") ? ' rel="noopener"' : '';
    var titleAttr = (k && k.tekst) ? ' title="' + esc(k.tekst) + '"' : '';
    return '<a href="' + href + '" target="' + t + '"' + rel + titleAttr + '>' + ((k && k.titel) || "") + '</a>';
  }
  function actueelHTML(){
    var kop = '<div class="actueellinks"><span class="h">Nu actueel</span>';
    if (ACTUEEL === null) return kop + '<span style="color:#8a7f7c;font-size:13px">wordt geladen…</span></div>';
    var items = (ACTUEEL.kaarten || []);
    if (!items.length) return kop + '<span style="color:#8a7f7c;font-size:13px">op dit moment niets bijzonders</span></div>';
    return kop + items.map(actueelLink).join("") + '</div>';
  }
  function laadActueel(){
    var klaar = function(j){
      ACTUEEL = (j && typeof j === "object") ? j : { kaarten: [] };
      var dot = document.getElementById("actueeldot");
      if (dot) dot.style.display = (ACTUEEL.kaarten || []).some(function(k){ return k && k.live; }) ? "" : "none";
      if (current === "actueel") { drawer.innerHTML = actueelHTML(); report(); }
    };
    var haal = function(url){ return fetch(url, { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }); };
    haal(ACTUEEL_URL)
      .then(function(j){ return j || haal(ACTUEEL_FALLBACK); })
      .catch(function(){ return haal(ACTUEEL_FALLBACK).catch(function(){ return null; }); })
      .then(klaar, function(){ klaar(null); });
  }

  // ---- Open/close ----
  var current = null;

  // FIX 1 (21-07-2026, behouden): meet de werkelijke kaarthoogte (niet
  // body.scrollHeight, want die is nooit kleiner dan het iframe-venster →
  // oneindige groei-lus). Meld alleen bij een gewijzigde waarde.
  var lastReported = 0, fitTimer = null;
  function report(){
    try {
      if (window.parent && window.parent !== window) {
        var card = document.querySelector(".card");
        if (!card) return;
        var h = Math.ceil(card.getBoundingClientRect().height) + 12; // + body-padding
        if (h !== lastReported) {
          lastReported = h;
          window.parent.postMessage({ nlfrMenuHeight: h }, "*");
          // Als de ouderpagina de hoogte NIET overneemt (oude embedcode, of een
          // mobiel thema zonder ons script), blijft dit iframe op zijn vaste
          // hoogte staan en zou een open paneel onbereikbaar zijn. Daarom:
          // meet na een moment of we werkelijk zijn meegegroeid; zo niet, dan
          // schakelen we het paneel over op interne scroll.
          if (h > window.innerHeight + 20) {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(function(){
              var grew = window.innerHeight >= h - 20;
              document.documentElement.classList.toggle("noresize", !grew);
            }, 450);
          } else {
            document.documentElement.classList.remove("noresize");
          }
        }
      }
    } catch(e){}
  }

  function closeAll(){
    current = null;
    drawer.classList.remove("open");
    Array.prototype.forEach.call(document.querySelectorAll(".door"), function(b){ b.classList.remove("active"); });
    document.getElementById("pullbtn").classList.remove("active");
    adminBtn.classList.remove("active");
  }
  function open(target, el){
    if (current === target) { closeAll(); report(); return; }
    closeAll();
    current = target;
    build(target);
    drawer.classList.add("open");
    if (el) el.classList.add("active");
    report();
  }
  Array.prototype.forEach.call(document.querySelectorAll(".door"), function(b){
    b.addEventListener("click", function(){ open(b.getAttribute("data-door"), b); });
  });
  document.getElementById("pullbtn").addEventListener("click", function(){ open("topics", this); });
  adminBtn.addEventListener("click", function(){ open("admin", this); });
  document.getElementById("actueelbtn").addEventListener("click", function(){ open("actueel", this); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") { closeAll(); report(); } });

  // ---- Mobiel: zoekbalk in/uitklappen ----
  var msearch = document.getElementById("msearch"), sform = document.getElementById("searchform");
  msearch.addEventListener("click", function(){
    var open = !sform.classList.contains("open");
    sform.classList.toggle("open", open);
    msearch.classList.toggle("active", open);
    msearch.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) { var i = document.getElementById("q"); if (i) i.focus(); }
    report();
  });

  // ---- /m: de korte lijst achter de hamburger ----
  var MSITE_ICONS = {
    schijn: '<path d="M12 3l2.4 6.2L21 11l-6.6 1.8L12 19l-2.4-6.2L3 11l6.6-1.8z"/>',
    foto: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-4 4 3 3-2 4 3"/>',
    plaats: '<path d="M12 5v14M5 12h14"/>',
    nieuws: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h7M7 13h10M7 16h6"/>',
    zoek: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    mijn: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4S18.1 16.4 19.5 20"/>',
    hulp: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.4v.4"/><path d="M12 17h.01"/>',
    diensten: '<path d="M4 7h16v12H4z"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>',
    verenig: '<circle cx="9" cy="9" r="3"/><path d="M3.5 19c.9-2.7 2.9-4.2 5.5-4.2S13.6 16.3 14.5 19"/><path d="M16 6.5a3 3 0 0 1 0 5.8M17.5 19c-.3-1.4-.8-2.5-1.5-3.3"/>'
  };
  function ico(k){ return '<span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (MSITE_ICONS[k] || "") + '</svg></span>'; }
  function mrow(href, icon, label, sub){
    var t = tgt(href), rel = (t === "_blank") ? ' rel="noopener"' : '';
    return '<a href="' + href + '" target="' + t + '"' + rel + '>' + ico(icon) + '<span>' + label + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</span></a>';
  }
  function msiteHTML(){
    var h = '<div class="mlist">';
    h += mrow(U("/profiles/blog/list?promoted=1"), "schijn", "In de schijnwerpers", "Uitgelichte berichten");
    h += mrow(U("/page/dagelijks-frankrijknieuws"), "nieuws", "Frankrijknieuws", "Dagelijks bijgewerkt");
    h += mrow(U("/page/rubrieken"), "zoek", "Rubrieken", "Alle onderwerpen");
    h += mrow(U("/photo"), "foto", "Foto's");
    h += '<div class="sep">Zelf doen</div>';
    h += mrow(U("/profiles/blog/new"), "plaats", "Plaats een bericht");
    h += mrow(isMember ? myPage : U("/main/authorization/signIn"), "mijn", isMember ? "Mijn pagina" : "Meld je aan", isMember ? "" : "of word gratis lid");
    h += '<div class="sep">Handig</div>';
    h += mrow(U("/diensten"), "diensten", "Diensten");
    h += mrow(U("/page/nederlandse-verenigingen-in-frankrijk"), "verenig", "NL-verenigingen");
    h += mrow(U("/page/hulpverlening-in-frankrijk"), "hulp", "Hulp vinden");
    h += '<a class="full" href="' + U("/") + '" target="_parent">Naar de volledige website</a>';
    return h + '</div>';
  }

  // ---- Compacte modus: hamburger opent/sluit de rest van het menu ----
  var mmenu = document.getElementById("mmenu");
  mmenu.addEventListener("click", function(){
    var root = document.documentElement, willOpen = !root.classList.contains("menuopen");
    root.classList.toggle("menuopen", willOpen);
    mmenu.classList.toggle("active", willOpen);
    mmenu.setAttribute("aria-expanded", willOpen ? "true" : "false");
    if (MSITE) { if (willOpen) open("msite", null); else closeAll(); report(); return; }
    if (!willOpen) closeAll(); // dichtklappen sluit ook een open paneel
    report();
  });

  // ---- Mobiel: zusterplatforms in/uitklappen ----
  var ecoT = document.getElementById("ecotoggle"), eco = document.getElementById("eco");
  ecoT.addEventListener("click", function(){
    var open = !eco.classList.contains("open");
    eco.classList.toggle("open", open);
    ecoT.setAttribute("aria-expanded", open ? "true" : "false");
    report();
  });

  // ---- Profiel-ontvangst (cross-origin, vanuit embedcode op nederlanders.fr) ----
  window.addEventListener("message", function(e){
    if (e.origin !== PARENT_ORIGIN) return;
    if (!e.data || !("nlfrProfile" in e.data)) return;
    setProfile(e.data.nlfrProfile);
    Array.prototype.forEach.call(document.querySelectorAll(".door"), function(b){
      var key = b.getAttribute("data-door");
      var def = null;
      DOOR_DEFS.forEach(function(d){ if (d[0] === key) def = d; });
      if (!def) return;
      var dh = doorHTML(def);
      b.classList.toggle("locked", dh.locked);
      var wasActive = b.classList.contains("active");
      b.innerHTML = dh.html;
      if (wasActive) b.classList.add("active");
    });
    syncAdminBtn();
    if (current === "mijn" || current === "admin") { build(current); report(); }
  });

  // ---- Search: opent de AI-zoek app ----
  var q = document.getElementById("q"), clr = document.getElementById("clear"), sbox = document.getElementById("searchbox");
  function doSearch(){ var v = q.value.trim(); if (!v) return; var url = ZOEK_APP + encodeURIComponent(v); try { window.top.location.href = url; } catch(e) { window.open(url, "_blank", "noopener"); } }
  document.getElementById("searchform").addEventListener("submit", function(e){ e.preventDefault(); doSearch(); });
  q.addEventListener("input", function(){ clr.classList.toggle("show", q.value.length > 0); });
  q.addEventListener("focus", function(){ sbox.classList.add("focus"); });
  q.addEventListener("blur", function(){ sbox.classList.remove("focus"); });
  clr.addEventListener("click", function(){ q.value = ""; clr.classList.remove("show"); q.focus(); });

  // ---- Herbouwen bij wisseling mobiel <-> breed (draaien van het toestel) ----
  if (window.matchMedia) {
    var mq = window.matchMedia(MOBILE_MQ);
    var onChange = function(){ applyCompact(); if (current) build(current); report(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);
  }

  // ---- "Nu actueel" alvast ophalen ----
  laadActueel();

  // ---- Height sync ----
  window.addEventListener("load", report);
  window.addEventListener("resize", report);
  report();
})();
</script>
</body>
</html>
