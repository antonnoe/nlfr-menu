<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>NLFR hoofdmenu</title>
<!--
  NLFR HOOFDMENU — externe versie voor GitHub/Vercel
  Herbouw naar het goedgekeurde ontwerp (04-09-2026).

  Dit bestand wordt gehost op Vercel en op nederlanders.fr geladen via een
  iframe: op desktop op elke pagina (955px breed, hoogte via postMessage
  nlfrMenuHeight), op /m op één mobiele pagina. Zie README.md voor de
  embedcode. Voor de bezoeker is dit iframe op desktop de ENIGE navigatie —
  de tabbalk van Ning is alleen voor beheerders zichtbaar. Elke link die hier
  in staat is dus de enige weg naar die pagina.

  OPBOUW, VAN BOVEN NAAR BENEDEN
    1. Banner (Café Jeudi), volle breedte, alleen als hij aanstaat — komt uit
       /api/banner, opmaak uit lib/banner.js. Beheer op /banner-beheer.
    2. Strip: één bordeaux balk met home, Menu, zoeken, Plaats bericht,
       Nu actueel en (alleen voor de beheerder) het tandwiel. Dit is het eerste
       element in de kaart; de afronding komt van de kaart zelf.
    3. Lade: de uitklappers van "Plaats bericht", "Nu actueel", het tandwiel en
       /m. IN-FLOW, niet position:absolute — een overlay wordt in een iframe
       met hoogte-sync afgeknipt.
    4. Paneel: vijf kolommen (Lezen, Meedoen, Vinden, Mijn NLFR, Nieuws), op
       desktop standaard dicht, open via "Menu"; op mobiel accordeons.

  GEEN KAARTKOP MEER (04-09-2026). Er stond een blok met "Nederlanders.fr" en
  de slogan boven de strip. Op nederlanders.fr staat NING's eigen sitekop met
  dezelfde naam en dezelfde slogan direct boven dit iframe, dus dat stond
  dubbel. Weggehaald in alle modi; de banner is nu het eerste element en
  daaronder komt meteen de strip.

  WAT ER T.O.V. DE VORIGE VERSIE IS VERVALLEN
    Het "Onderwerpen"-uitklapmenu met TOPICS en CTAS, de vijf losse deurknoppen
    met subtitels, de onderbalk, MOBILE_QUICK/MOBILE_HIDE en de
    accent/support/emph-klassen. Alle links hebben nu hetzelfde gewicht. De
    unieke TOPICS-items zijn naar een deur verhuisd (zie DOORS hieronder);
    /page/rubrieken is vervallen.

  ONDERHOUD — alles wat je normaal wijzigt staat in het <script>-blok:
    - DOORS ........ de inhoud van de vijf kolommen
    - memberGroups   het ledenmenu (Mijn NLFR, ingelogd)
    - ADMIN_LINKS .. de beheerlade achter het tandwiel
    - PERKS ........ de teaser voor wie niet is ingelogd
    - ZUSTERS ...... de rij zusterplatforms onderin het paneel
    - PANEELKNOPPEN  de knoppen links onderin het paneel
    De knop "Nu actueel" toont linkjes die LIVE uit actueel.json komen; de
    banner komt live uit /api/banner. Beheer-ID: ADMIN_ID. Zoek: ZOEK_APP.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* --- Auto-dark blokkeren: het menu is een lichte kaart, altijd. ---
     Chrome/Android draait de pagina anders zelf om ("auto dark theme") en dan
     is bordeaux #800000 onleesbaar. color-scheme:only light plus expliciete
     achtergronden op elk vlak: er valt niets te inverteren. */
  :root { color-scheme: only light; --brand: #800000; --brand-dark: #5c0f0f; --actueel: #2f6b3a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Mulish', system-ui, sans-serif; line-height: 1.6; color: #3a3330; padding: 6px; }
  a { color: var(--brand); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---- Banner (opmaak zelf staat in lib/banner.js, gedeeld met /banner-beheer) ---- */
  #bannerhost { background: transparent; }
  #bannerhost:not(:empty) { margin-bottom: 8px; }

  /* ---- Kaart ---- */
  .card { background: #fff; border: 1px solid rgba(128,0,0,.12); border-radius: 16px;
          box-shadow: 0 12px 40px -26px rgba(90,0,0,.55); overflow: hidden; }

  /* ---- Strip: één bordeaux balk ----
     Dit is het eerste element in de kaart. De kaart heeft overflow:hidden, dus
     de strip krijgt de bovenste afronding vanzelf mee. */
  .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
           min-height: 56px; padding: 10px 14px; background: var(--brand); }
  .sknop { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
           min-height: 44px; padding: 0 14px; border-radius: 9px;
           border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12);
           color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 16px; }
  .sknop:hover { background: rgba(255,255,255,.2); }
  .sknop:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .shome { flex: none; width: 44px; height: 44px; padding: 0; }
  .smenu { flex: none; }
  .splaats { flex: none; background: #fff; border-color: #fff; color: var(--brand); font-size: 15px; }
  .splaats:hover { background: #f7ecea; }
  .sactueel { flex: none; background: transparent; border-color: rgba(255,255,255,.4); font-size: 15px; }
  .sadmin { flex: none; width: 44px; height: 44px; padding: 0; margin-left: auto; display: none; }
  .sadmin.show { display: inline-flex; }
  .sknop.active { background: rgba(255,255,255,.28); }
  /* Groene stip: pulseert alleen als er werkelijk iets live is. */
  .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--actueel); flex: none;
         box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
  .dot.live { animation: puls 2.4s ease-out infinite; }
  @keyframes puls {
    0%   { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 0 rgba(47,107,58,.6); }
    70%  { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 8px rgba(47,107,58,0); }
    100% { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 0 rgba(47,107,58,0); }
  }
  .caret { flex: none; opacity: .85; }

  /* Zoekveld */
  .szoek { flex: 1 1 160px; min-width: 160px; display: flex; }
  .zoekbox { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px;
             padding: 0 6px 0 12px; border-radius: 9px; background: rgba(255,255,255,.78); }
  .zoekbox:focus-within { background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
  .zoekbox input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
                   font-family: 'Mulish', sans-serif; font-size: 14px; color: #3a3330; }
  .zoekbox input::placeholder { color: #8a7f7c; }
  .zoekbox .wis { display: none; flex: none; width: 28px; height: 28px; border: 0; border-radius: 999px;
                  background: transparent; color: #8a7f7c; align-items: center; justify-content: center; }
  .zoekbox .wis.show { display: inline-flex; }
  .zoekbox .ga { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 34px;
                 padding: 0 12px; border: 0; border-radius: 7px; background: var(--brand); color: #fff;
                 font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; }

  /* Alleen mobiel */
  .sforum, .sloep { display: none; }

  /* ---- Lade: een compacte kaart die onder zijn eigen knop hangt ----
     IN-FLOW, nooit position:absolute of fixed. Dit iframe is precies zo hoog
     als het meldt; alles wat buiten de documentstroom valt, wordt door de
     moederpagina afgeknipt. De kaart hangt dus niet ergens overheen maar wordt
     met een marge onder zijn knop geschoven (zie richtLade()). De rest van de
     strook onder de strip blijft leeg. */
  .lade { display: none; background: #fff; padding: 8px 14px 14px; }
  .lade.open { display: block; }
  /* Het pijltje naar de knop. position:relative houdt het IN de stroom en
     zorgt alleen dat het over de rand van de kaart heen valt. */
  .ladepijl { position: relative; z-index: 1; width: 14px; height: 14px; margin: 0 0 -7px 0;
              background: #fff; border-left: 1px solid rgba(128,0,0,.14);
              border-top: 1px solid rgba(128,0,0,.14); transform: rotate(45deg); }
  .ladekaart { background: #fff; border: 1px solid rgba(128,0,0,.14); border-radius: 12px;
               box-shadow: 0 12px 34px -16px rgba(90,0,0,.45); padding: 14px 16px; max-width: 100%; }
  .ladekaart.plaats { width: 560px; }
  .ladekaart.actueel { width: 340px; }
  .ladekaart.admin { width: 300px; }
  .lade .h { display: block; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 11.5px;
             letter-spacing: .06em; text-transform: uppercase; color: #a99e9a; margin-bottom: 6px; }
  .lade .ladekaart > a { display: flex; align-items: center; min-height: 44px;
                         font-size: 14px; color: #5b524f; padding: 5px 0; background: #fff; }
  .lade .ladekaart > a:hover { color: var(--brand); }
  .lade .leeg { font-size: 13px; color: #8a7f7c; }

  /* De twee kolommen achter "Plaats bericht" */
  .plaatskolommen { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .plaatskolom { min-width: 0; }
  .plaatskolom h4 { margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700;
                    font-size: 14.5px; color: var(--brand-dark); }
  .pil { display: inline-block; margin-top: 5px; padding: 2px 9px; border-radius: 999px;
         font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 10.5px;
         letter-spacing: .06em; color: #fff; }
  .pil.gratis { background: var(--actueel); }
  .pil.betaald { background: var(--brand); }
  .plaatskolom p { margin: 7px 0 11px; font-family: 'Mulish', sans-serif; font-size: 13px;
                   line-height: 1.5; color: #5b524f; }
  .plaatsknop { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
                padding: 0 16px; border-radius: 9px; background: var(--brand); color: #fff;
                font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; }
  .plaatsknop:hover { filter: brightness(1.12); }

  /* ---- Paneel ---- */
  .paneel { display: none; background: #fdfbfa; border-top: 1px solid rgba(128,0,0,.10); padding: 24px; }
  .paneel.open { display: block; }
  /* Zes sporen bij de iframe-breedte van 955px. Lezen heeft 43 links en zou als
     één kolom drie keer zo hoog worden als de vier andere; hij pakt daarom twee
     sporen en verdeelt zijn groepen daarbinnen over twee kolommen, met één
     deurkop erboven. Het paneel is daardoor zo hoog als de langste van die
     twee, niet als de hele lijst. */
  .kolommen { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 18px; align-items: start; }
  .deur { background: #fdfbfa; min-width: 0; }
  .deur[data-deur="lezen"] { grid-column: span 2; }
  .deurbody.tweekolommen { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; align-items: start; }
  .deurbody.tweekolommen > .kolom { min-width: 0; }
  .deurkop { display: block; background: #fdfbfa; border-bottom: 1px solid rgba(128,0,0,.10);
             padding-bottom: 7px; margin-bottom: 10px; }
  .deurkop .dn { display: block; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; color: var(--brand-dark); }
  .deurkop .ds { display: block; font-family: 'Mulish', sans-serif; font-size: 11.5px; color: #a99e9a; }
  .deurkop .dc, .deurkop .dcaret { display: none; }
  .deurbody { display: block; background: #fdfbfa; }
  .grp { margin-bottom: 12px; background: #fdfbfa; }
  .grp:last-child { margin-bottom: 0; }
  .gk { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: .06em;
        text-transform: uppercase; color: #a99e9a; margin-bottom: 2px; }
  /* Op desktop staat elke groep gewoon open; teller en caret horen bij de
     accordeon die alleen op mobiel bestaat. */
  .gk .gc, .gk .gcaret { display: none; }
  .gl { display: block; }
  /* ALLE links hetzelfde gewicht: geen bold, geen bordeaux, geen emoji. */
  .grp a { display: block; font-family: 'Mulish', sans-serif; font-size: 13.5px; line-height: 1.35;
           color: #5b524f; padding: 5px 0; }
  .grp a:hover { color: var(--brand); }

  /* Abonneerknop onderin de Nieuws-kolom */
  .abonneer { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; margin-top: 4px;
              padding: 0 12px; border: 1px solid rgba(128,0,0,.22); border-radius: 9px; background: #fff;
              color: var(--brand); font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; }
  .abonneer:hover { background: rgba(128,0,0,.06); }

  /* Teaser in de kolom Mijn NLFR (niet ingelogd) */
  .teaser { background: #fff; border: 1px solid rgba(128,0,0,.14); border-radius: 12px; padding: 12px; }
  .teaser h3 { margin: 0 0 6px; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 13.5px; color: var(--brand); }
  .teaser .perk { display: flex; gap: 7px; align-items: flex-start; font-size: 12.5px; color: #5b524f; line-height: 1.3; margin-bottom: 5px; }
  .teaser .perk svg { flex: none; margin-top: 3px; }
  .teaser .btns { display: grid; gap: 6px; margin-top: 10px; }
  /* De kolommen zijn smaller sinds Lezen er twee pakt; 12px houdt
     "Word lid — gratis" op één regel in plaats van halverwege af te breken. */
  .teaser .btn-p, .teaser .btn-o { display: flex; align-items: center; justify-content: center; min-height: 44px;
                                   padding: 0 8px; border-radius: 9px; text-align: center; line-height: 1.2;
                                   font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 12px; }
  html.compact .teaser .btn-p, html.compact .teaser .btn-o { font-size: 13px; }
  .teaser .btn-p { background: var(--brand); color: #fff; }
  .teaser .btn-o { background: #fff; border: 1px solid rgba(128,0,0,.25); color: var(--brand); }

  /* ---- Voetrij van het paneel ---- */
  .paneelvoet { display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
                margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(128,0,0,.10); }
  .paneelvoet .vlinks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pknop { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px;
           border: 1px solid rgba(128,0,0,.22); border-radius: 9px; background: #fff; color: var(--brand);
           font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; }
  .pknop:hover { background: rgba(128,0,0,.06); }
  .zusters { flex: 1 1 auto; text-align: center; font-family: 'Poppins', sans-serif; font-weight: 600;
             font-size: 12.5px; color: var(--actueel); }
  .zusters a { color: var(--actueel); }
  .zusters a:hover { text-decoration: underline; }
  .zusters .sep { opacity: .5; padding: 0 5px; }
  .sluitknop { margin-left: auto; }

  /* ---- Mobiel (<=700px en html.compact) ---- */
  @media (max-width: 700px) {
    .card { border-radius: 14px; }
  }
  html.compact .shome { display: none; }
  html.compact .sforum { display: inline-flex; order: 2; flex: 1 1 auto; min-height: 44px; padding: 0 12px;
                         border-radius: 9px; background: #fff; border: 1px solid #fff; color: var(--brand);
                         align-items: center; justify-content: center; gap: 7px;
                         font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; }
  html.compact .sloep { display: inline-flex; order: 3; flex: 0 0 44px; width: 44px; height: 44px; padding: 0;
                        align-items: center; justify-content: center; }
  html.compact .smenu { order: 1; }
  /* Het zoekveld klapt open ONDER de eerste rij; flex-basis:100% dwingt de
     regelovergang af, zodat de rijen altijd hetzelfde vallen. */
  html.compact .szoek { order: 4; flex: 0 0 100%; display: none; }
  html.compact .szoek.open { display: flex; }
  /* Twee gelijke knoppen op een eigen regel: samen precies 100% + gap. */
  html.compact .splaats { order: 5; flex: 1 1 calc(50% - 4px); }
  html.compact .sactueel { order: 6; flex: 1 1 calc(50% - 4px); }
  html.compact .sadmin { order: 7; margin-left: 0; }
  html.compact .paneel { padding: 14px; }
  html.compact .kolommen { grid-template-columns: 1fr; gap: 8px; }
  /* Accordeon: op mobiel is elke deur een rij die open- en dichtklapt. */
  html.compact .deur { border: 1px solid rgba(128,0,0,.12); border-radius: 12px; background: #fff; overflow: hidden; }
  html.compact .deurkop { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 14px;
                          margin: 0; border-bottom: 0; background: #fff; }
  html.compact .deur.open .deurkop { border-bottom: 1px solid rgba(128,0,0,.10); }
  html.compact .deurkop .dn { flex: 1; }
  html.compact .deurkop .ds { display: none; }
  html.compact .deurkop .dc { display: inline-block; font-family: 'Mulish', sans-serif; font-size: 12px; color: #a99e9a; }
  html.compact .deurkop .dcaret { display: inline-flex; color: #a99e9a; transition: transform 180ms ease; }
  html.compact .deur.open .deurkop .dcaret { transform: rotate(180deg); }
  html.compact .deurbody { display: none; padding: 10px 14px 12px; background: #fff; }
  html.compact .deur.open .deurbody { display: block; }
  html.compact .grp { background: #fff; margin-bottom: 0; border-top: 1px solid rgba(128,0,0,.08); }
  html.compact .grp:first-child { border-top: 0; }
  /* Tweede accordeon, binnen de deur: de groepen zelf klappen open en dicht,
     één tegelijk, de eerste open — zoals het oude menu deed. */
  html.compact .gk { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 0;
                     cursor: pointer; -webkit-tap-highlight-color: transparent; }
  html.compact .gk .gn { flex: 1; }
  html.compact .gk .gc { display: inline-block; font-family: 'Mulish', sans-serif;
                         font-size: 12px; letter-spacing: 0; text-transform: none; color: #a99e9a; }
  html.compact .gk .gcaret { display: inline-flex; color: #a99e9a; transition: transform 180ms ease; }
  html.compact .grp.open .gk .gcaret { transform: rotate(180deg); }
  html.compact .gl { display: none; padding-bottom: 6px; }
  html.compact .grp.open .gl { display: block; }
  html.compact .grp a { min-height: 44px; display: flex; align-items: center; }
  /* De twee sporen van Lezen zijn een desktopmiddel; op mobiel staat alles
     gewoon onder elkaar in de accordeon. */
  html.compact .deur[data-deur="lezen"] { grid-column: auto; }
  html.compact .deurbody.tweekolommen { display: block; }
  /* De lade mag op een telefoon de volle breedte nemen; dan is er ook geen
     knop om een pijltje naar te richten. */
  html.compact .lade { padding: 10px 12px 12px; }
  html.compact .ladepijl { display: none; }
  html.compact .ladekaart { width: auto !important; margin-left: 0 !important; }
  html.compact .plaatskolommen { grid-template-columns: 1fr; gap: 16px; }
  html.compact .paneelvoet { flex-direction: column; align-items: stretch; }
  html.compact .paneelvoet .vlinks { display: grid; grid-template-columns: 1fr 1fr; }
  html.compact .pknop { width: 100%; }
  html.compact .sluitknop { margin-left: 0; }
  html.compact .zusters { text-align: center; }
  /* Raakvlakken van minstens 44px: op een telefoon mik je anders mis. De
     zusterlinks staan in een lopende zin, dus ze blijven inline — alleen hun
     tikhoogte gaat omhoog. */
  html.compact .zusters a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }

  /* ---- /m (html.msite): bewust beperkt, zoals /m altijd al was ---- */
  html.msite .paneel { display: none !important; }
  html.msite .splaats, html.msite .sactueel, html.msite .sforum { display: none !important; }
  html.msite .mlijst { display: flex; flex-direction: column; gap: 6px; }
  html.msite .mlijst a { display: flex; align-items: center; gap: 11px; min-height: 50px; padding: 10px 14px;
                         border-radius: 12px; background: #fff; border: 1px solid rgba(128,0,0,.14);
                         color: #3a3330; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 15px; }
  html.msite .mlijst a:active { background: rgba(128,0,0,.08); }
  html.msite .mlijst a .ic { flex: 0 0 auto; display: grid; place-items: center; width: 34px; height: 34px;
                             border-radius: 9px; background: rgba(128,0,0,.07); color: var(--brand); }
  html.msite .mlijst a .sub { display: block; font-family: 'Mulish', sans-serif; font-weight: 400;
                              font-size: 12.5px; color: #8a7f7c; line-height: 1.25; }
  html.msite .mlijst .sep { margin: 6px 2px 2px; font-family: 'Poppins', sans-serif; font-weight: 700;
                            font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: #a99e9a; }
  html.msite .mlijst a.full { background: var(--brand); color: #fff; border-color: var(--brand); justify-content: center; }

  /* Noodrem: de ouderpagina neemt onze hoogte niet over (oude embedcode of een
     mobiel thema zonder het sync-script). Paneel en lade krijgen dan interne
     scroll binnen de vaste iframe-hoogte, zodat niets onbereikbaar wordt. */
  html.noresize .paneel, html.noresize .lade { max-height: calc(100vh - 190px); overflow-y: auto; -webkit-overflow-scrolling: touch; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .dot.live { animation: none; }
  }
</style>
</head>
<body>
<div id="alles">
  <div id="bannerhost"></div>

      ["Steunen", [["Waarom aanmelden",U("/profiles/blogs/waarom-zou-u-lid-worden-van-nederlanders-fr")],["Doneer",U("/page/fundraising-en-donaties")],["Word sponsor",U("/page/sponsorprogramma")],["Word abonnee","https://infofrankrijk.com/abonnement/","_top"]]]
    ]},
    vinden: { naam: "Vinden", sub: "tools &amp; hulp", groups: [

      ["Regels &amp; hulp", [["Huisregels",U("/page/huisregels")],["Hulp vinden",U("/page/hulpverlening-in-frankrijk")],["Contact beheerder",U("/profiles/message/newFromProfile?screenName=3pjypz5h1ilpc&amp;target=https%3A%2F%2Fwww.nederlanders.fr%2Fprofiles%2Fprofile%2Fshow%3Fid%3DAntonNoe%26")]]],
      ["Adressen", [["Wegwijs Franse overheid",U("/profiles/blogs/wegwijs-franse-overheid")],["Handige sites",U("/page/handige-sites")],["Nedergids","https://nedergids.nl/"]]],
      ["Uitgelicht", [["In de schijnwerpers",U("/profiles/blog/list?promoted=1")],["Groepen",U("/groups")],["Onze sponsors",U("/page/sponsors")],["Auteurs",U("/profiles/friend/listFeatured")]]]

      ["Abonneren", [["Dagelijkse nieuwsbrief","https://laposta.nl/f/ssysinmqgflb"],["RSS — berichten",U("/profiles/blog/feed?xn_auth=no")],["RSS — activiteit",U("/activity/log/list?fmt=rss")]]]
    ]}
  };

  // Mijn NLFR is de vijfde kolom, maar hangt aan de ingelogde gebruiker en

    ["Leden", [["Ledenlijst",U("/profiles/members/")],["Leden zoeken",U("/profiles/members/advancedSearch")],["Veelgestelde vragen",U("/page/veelgestelde-vragen-en-goede-antwoorden")],["Ledenservice",U("/profiles/blog/list?tag=Ledenservice")],["Boîte à idées",U("/boite-a-idees")]]],
    ["Mijn eigen", [["Mijn pagina",myPage],["Profiel bewerken",U("/profiles/settings/editProfileInfo")],["Mijn foto's",U("/photo/photo/listForContributor?screenName="+uid)],["Mijn berichten",U("/profiles/blog/list?user="+uid)],["Mijn vrienden",U("/profiles/friend/list?user="+uid)]]]
  ]; }

  var ADMIN_LINKS = [["Banner beheren","/banner-beheer","_blank"],["Dashboard",U("/main/dashboard")],["Tags",U("/page/tags")],["Standaard teksten",U("/page/standard-berichten")],["Bestandsbeheer",U("/main/filemanager/list")],["Mijn pagina's",U("/page/page/listForContributor")]];
  var PERKS = ["Uw eigen profielpagina","Chat met leden die online zijn","Ledenlijst &amp; leden zoeken in uw regio","Gratis berichten en advertenties plaatsen"];

  var ZUSTERS = [["Infofrankrijk","https://infofrankrijk.com/"],["Café Claude","https://www.cafeclaude.fr/"],["Nedergids","https://nedergids.nl/"],["Communities Abroad","https://www.communitiesabroad.com"]];
  var PANEELKNOPPEN = [["Plaats bericht",U("/profiles/blog/new")],["Plaats advertentie",U("/page/betaalpagina-berichten")],["Diensten",U("/diensten")]];

  // De twee kolommen achter de knop "Plaats bericht". Naast elkaar op desktop,

  var caretSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';

  // ---- Hoogte melden ----------------------------------------------------
  // Meet de werkelijke hoogte van #alles (banner + kaart), niet
  // body.scrollHeight: die is nooit kleiner dan het iframe-venster, wat een
  // oneindige groei-lus geeft. Alleen melden bij een gewijzigde waarde.
  var lastReported = 0, fitTimer = null;
  function report(){
    try {
      if (window.parent && window.parent !== window) {
        var alles = document.getElementById("alles");
        if (!alles) return;
        var h = Math.ceil(alles.getBoundingClientRect().height) + 12; // + body-padding
        if (h !== lastReported) {
          lastReported = h;
          window.parent.postMessage({ nlfrMenuHeight: h }, "*");
          // Neemt de ouderpagina de hoogte NIET over (oude embedcode of een
          // mobiel thema zonder ons script), dan blijft dit iframe op zijn
          // vaste hoogte staan en zou een open paneel onbereikbaar zijn.
          // Meet daarom of we werkelijk zijn meegegroeid; zo niet, dan interne
          // scroll.
          if (h > window.innerHeight + 20) {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(function(){
              var gegroeid = window.innerHeight >= h - 20;
              document.documentElement.classList.toggle("noresize", !gegroeid);
            }, 450);
          } else {
            document.documentElement.classList.remove("noresize");
          }
        }
      }
    } catch(e){}
  }

  // Eén groep: kop met teller en caret (alleen zichtbaar op mobiel, waar de
  // groepen accordeons zijn), daaronder de links.
  function groepHTML(g){
    return '<div class="grp">' +
      '<div class="gk" role="button" tabindex="0" aria-expanded="false">' +
        '<span class="gn">' + g[0] + '</span>' +
        '<span class="gc">' + g[1].length + '</span>' +
        '<span class="gcaret">' + caretSvg + '</span>' +
      '</div>' +
      '<div class="gl">' + g[1].map(function(l){ return link(l[1], l[0], l[2]); }).join("") + '</div>' +
    '</div>';
  }

  // De groepen van Lezen over twee kolommen, evenwichtig op aantal links.
  // Elke groep weegt zijn links plus zijn kop; een groep gaat naar de eerste
  // kolom zolang zijn MIDDEN nog vóór de helft ligt. Zo blijft een groep
  // heel — hem opsplitsen zou de kop van zijn links scheiden.
  function verdeelGroepen(groups){
    var gewicht = function(g){ return g[1].length + 1; };
    var totaal = 0;
    groups.forEach(function(g){ totaal += gewicht(g); });
    var helft = totaal / 2, som = 0, a = [], b = [];
    groups.forEach(function(g){
      var w = gewicht(g);
      if (b.length === 0 && som + w / 2 <= helft) { a.push(g); som += w; }
      else b.push(g);
    });
    // Nooit een lege tweede kolom: dan is één kolom eerlijker.
    if (!b.length) { b.push(a.pop()); }
    return [a, b];
  }

  function kolomHTML(sleutel){
    var groups, naam, sub;

      groups = isMember ? memberGroups() : null;
    } else {
      var d = DOORS[sleutel];
      naam = d.naam; sub = d.sub; groups = d.groups;
    }

    var aantal = 0;
    if (groups) groups.forEach(function(g){ aantal += g[1].length; });

    var h = '<div class="deur" data-deur="'+sleutel+'">';
    h += '<div class="deurkop" role="button" tabindex="0" aria-expanded="false">' +
         '<span class="dn">'+naam+'</span><span class="ds">'+sub+'</span>' +
         '<span class="dc">'+(groups ? aantal : "")+'</span>' +
         '<span class="dcaret">'+caretSvg+'</span></div>';
    // Lezen verdeelt zijn groepen over twee kolommen binnen dezelfde deur.
    var tweekolommen = (sleutel === "lezen") && groups;
    h += '<div class="deurbody' + (tweekolommen ? " tweekolommen" : "") + '">';

    if (!groups) {
      // Niet ingelogd: de teaser staat compact in deze kolom.
      var p = PERKS.map(function(x){
        return '<div class="perk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'+x+'</div>';
      }).join("");
      h += '<div class="teaser"><h3>Word gratis lid</h3>'+p+
           '<div class="btns">'+
           '<a class="btn-p" href="'+U("/main/authorization/signUp")+'" target="_parent">Word lid — gratis</a>'+
           '<a class="btn-o" href="'+U("/main/authorization/signIn")+'" target="_parent">Meld je aan</a>'+
           '</div></div>';
    } else if (tweekolommen) {
      verdeelGroepen(groups).forEach(function(kolom){
        h += '<div class="kolom">' + kolom.map(groepHTML).join("") + '</div>';
      });
    } else {
      h += groups.map(groepHTML).join("");
      if (sleutel === "nieuws") {
        h += '<a class="abonneer" href="'+U("/profiles/blog/feed?xn_auth=no")+'" target="_parent">' +
             '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg>' +
             'Abonneren</a>';
      }
    }
    return h + '</div></div>';
  }

  function bouwPaneel(){
    var h = '<div class="kolommen">' + DEUR_VOLGORDE.map(kolomHTML).join("") + '</div>';
    h += '<div class="paneelvoet"><div class="vlinks">' +
         PANEELKNOPPEN.map(function(k){
           var t = tgt(k[1]), rel = (t === "_blank") ? ' rel="noopener"' : '';
           return '<a class="pknop" href="'+k[1]+'" target="'+t+'"'+rel+'>'+k[0]+'</a>';
         }).join("") + '</div>';
    h += '<div class="zusters">Zusterplatforms: ' +
         ZUSTERS.map(function(z){
           return '<a href="'+z[1]+'" target="_blank" rel="noopener">'+z[0]+'</a>';
         }).join('<span class="sep">·</span>') + '</div>';
    h += '<button type="button" class="pknop sluitknop" id="sluitbtn">Menu sluiten</button></div>';
    paneel.innerHTML = h;
    bindDeuren();
    var sluit = document.getElementById("sluitbtn");
    if (sluit) sluit.addEventListener("click", function(){ zetPaneel(false); });
  }

  // Accordeon: op mobiel één deur open tegelijk. Op desktop staan alle vijf de
  // kolommen open en doet de klasse niets (zie CSS).
  function bindDeuren(){
    Array.prototype.forEach.call(paneel.querySelectorAll(".deur > .deurkop"), function(kop){
      function toggle(){
        var deur = kop.parentNode, wasOpen = deur.classList.contains("open");
        Array.prototype.forEach.call(paneel.querySelectorAll(".deur"), function(d){
          d.classList.remove("open");
          var k = d.querySelector(".deurkop");
          if (k) k.setAttribute("aria-expanded", "false");
        });
        if (!wasOpen) {
          deur.classList.add("open");
          kop.setAttribute("aria-expanded", "true");
          openEersteGroep(deur);
        }
        report();
      }
      kop.addEventListener("click", toggle);
      kop.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });
    bindGroepen();
  }

  // Tweede accordeon, binnen de deur: op mobiel klappen de groepen zelf ook
  // open en dicht, één tegelijk binnen dezelfde deur. Op desktop staan ze
  // allemaal open en doet de klasse niets (zie CSS).
  function bindGroepen(){
    Array.prototype.forEach.call(paneel.querySelectorAll(".grp > .gk"), function(kop){
      function toggle(){
        var grp = kop.parentNode, wasOpen = grp.classList.contains("open");
        var deur = grp.closest ? grp.closest(".deur") : null;
        var buren = (deur || paneel).querySelectorAll(".grp");
        Array.prototype.forEach.call(buren, function(g){
          g.classList.remove("open");
          var k = g.querySelector(".gk");
          if (k) k.setAttribute("aria-expanded", "false");
        });
        if (!wasOpen) { grp.classList.add("open"); kop.setAttribute("aria-expanded", "true"); }
        report();
      }
      kop.addEventListener("click", toggle);
      kop.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });
  }

  function openEersteGroep(deur){
    if (!isNarrow() || !deur) return;
    if (deur.querySelector(".grp.open")) return;
    var eerste = deur.querySelector(".grp");
    if (!eerste) return;
    eerste.classList.add("open");
    var k = eerste.querySelector(".gk");
    if (k) k.setAttribute("aria-expanded", "true");
  }

  function zetPaneel(open){
    if (open) sluitLade();
    paneel.classList.toggle("open", open);
    menubtn.classList.toggle("active", open);
    menubtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open && isNarrow()) {
      // Op mobiel begint de accordeon dicht; de eerste deur alvast open zodat
      // er iets te zien is.
      var eerste = paneel.querySelector(".deur");
      if (eerste && !paneel.querySelector(".deur.open")) {
        eerste.classList.add("open");
        eerste.querySelector(".deurkop").setAttribute("aria-expanded", "true");
        openEersteGroep(eerste);
      }
    }
    report();
  }

  // ---- Lade (in-flow, één tegelijk) -------------------------------------
  var ladeNu = null;

  function sluitLade(){
    ladeNu = null;
    lade.classList.remove("open");
    [plaatsbtn, actueelbtn, adminbtn, menubtn].forEach(function(b){
      if (b === menubtn && !MSITE) return;
      b.classList.remove("active");
      b.setAttribute("aria-expanded", "false");
    });
  }

  // Welke kant de kaart onder zijn knop uitlijnt. "Nu actueel" en het tandwiel
  // staan rechts in de strip; hun kaart hangt daar met de rechterrand onder.
  var LADE_RECHTS = { actueel: 1, admin: 1 };
  var ladeKnop = null;

  // De kaart onder zijn eigen knop schuiven. Dit gebeurt met een MARGE, niet
  // met position:absolute: het iframe is precies zo hoog als het meldt en zou
  // alles buiten de documentstroom afknippen.
  function richtLade(){
    var kaart = lade.querySelector(".ladekaart");
    var pijl = lade.querySelector(".ladepijl");
    if (!kaart) return;
    kaart.style.marginLeft = "";
    if (pijl) pijl.style.marginLeft = "";
    if (isNarrow() || !ladeKnop || !ladeNu) return;   // mobiel: volle breedte

    var lr = lade.getBoundingClientRect();
    var cs = window.getComputedStyle ? window.getComputedStyle(lade) : null;
    var padL = cs ? (parseFloat(cs.paddingLeft) || 0) : 0;
    var padR = cs ? (parseFloat(cs.paddingRight) || 0) : 0;
    var links = lr.left + padL;
    var ruimte = lr.width - padL - padR;
    var kb = ladeKnop.getBoundingClientRect();
    var kw = kaart.getBoundingClientRect().width;

    var x = LADE_RECHTS[ladeNu] ? (kb.right - links - kw) : (kb.left - links);
    x = Math.max(0, Math.min(x, Math.max(0, ruimte - kw)));
    kaart.style.marginLeft = Math.round(x) + "px";

    if (pijl) {
      // Het pijltje wijst naar het midden van de knop, maar blijft binnen de
      // kaart (anders zweeft het los in de strook).
      var px = kb.left + kb.width / 2 - links - 7;
      px = Math.max(x + 12, Math.min(px, x + kw - 26));
      pijl.style.marginLeft = Math.round(px) + "px";
    }
  }

  function openLade(naam, knop){
    if (!naam || ladeNu === naam) { sluitLade(); report(); return; }
    sluitLade();
    if (naam !== "msite") zetPaneel(false);
    ladeNu = naam;
    ladeKnop = knop || null;
    lade.innerHTML = ladeHTML(naam);
    lade.classList.add("open");
    if (knop) { knop.classList.add("active"); knop.setAttribute("aria-expanded", "true"); }
    richtLade();
    report();
  }

  // De twee kolommen achter "Plaats bericht".
  function plaatsHTML(){
    return '<div class="plaatskolommen">' + PLAATS_KOLOMMEN.map(function(k){
      return '<div class="plaatskolom">' +
        '<h4>' + k.kop + '</h4>' +
        '<span class="pil ' + k.pil + '">' + k.label + '</span>' +
        '<p>' + esc(k.tekst) + '</p>' +
        '<a class="plaatsknop" href="' + k.url + '" target="_parent">' + k.knop + '</a>' +
      '</div>';
    }).join("") + '</div>';
  }

  // De inhoud van een lade, altijd in een kaart met een pijltje naar de knop.
  function ladeHTML(naam){
    var binnen = ladeInhoud(naam);
    if (binnen == null) return "";
    if (naam === "msite") return '<div class="ladekaart msite">' + binnen + '</div>';
    return '<div class="ladepijl"></div><div class="ladekaart ' + naam + '">' + binnen + '</div>';
  }

  function ladeInhoud(naam){
    if (naam === "plaats") return plaatsHTML();
    if (naam === "actueel") return actueelHTML();
    if (naam === "admin") {
      return '<span class="h">Beheer</span>' + ADMIN_LINKS.map(function(l){
        return link(l[1], l[0], l[2]);
      }).join("");
    }
    if (naam === "msite") return msiteHTML();
    return null;
  }

  // ---- "Nu actueel" — compacte rij linkjes uit actueel.json --------------
  function actueelLink(k){
    var href = (k && k.href) ? String(k.href) : "#";
    var t = tgt(href), rel = (t === "_blank") ? ' rel="noopener"' : '';
    var titel = (k && k.tekst) ? ' title="' + esc(k.tekst) + '"' : '';
    return '<a href="' + esc(href) + '" target="' + t + '"' + rel + titel + '>' + ((k && k.titel) || "") + '</a>';
  }
  function actueelHTML(){
    var kop = '<span class="h">Nu actueel</span>';
    if (ACTUEEL === null) return kop + '<span class="leeg">wordt geladen…</span>';
    var items = (ACTUEEL.kaarten || []);
    if (!items.length) return kop + '<span class="leeg">op dit moment niets bijzonders</span>';
    return kop + items.map(actueelLink).join("");
  }
  function laadActueel(){
    var klaar = function(j){
      ACTUEEL = (j && typeof j === "object") ? j : { kaarten: [] };
      var dot = document.getElementById("actueeldot");
      if (dot) dot.classList.toggle("live", (ACTUEEL.kaarten || []).some(function(k){ return k && k.live; }));
      // Alleen de inhoud van de kaart verversen; de kaart en zijn pijltje
      // blijven staan waar richtLade() ze heeft neergezet.
      if (ladeNu === "actueel") {
        var kaart = lade.querySelector(".ladekaart");
        if (kaart) { kaart.innerHTML = actueelHTML(); richtLade(); }
        report();
      }
    };
    var haal = function(url){ return fetch(url, { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }); };
    haal(ACTUEEL_URL)
      .then(function(j){ return j || haal(ACTUEEL_FALLBACK); })
      .catch(function(){ return haal(ACTUEEL_FALLBACK).catch(function(){ return null; }); })
      .then(klaar, function(){ klaar(null); });
  }

  // ---- Banner ------------------------------------------------------------
  // De opmaak komt uit lib/banner.js, hetzelfde bestand dat /banner-beheer
  // voor zijn voorbeeld gebruikt — zo kan het voorbeeld niet gaan afwijken van
  // wat het menu toont. Lukt het laden of ophalen niet, of staat de banner uit,
  // dan komt er simpelweg geen banner en blijft het menu ongestoord.
  function laadModule(src){
    return new Promise(function(klaar, mislukt){
      var s = document.createElement("script");
      s.type = "module";
      s.src = src;
      s.onload = function(){ window.NLFR_BANNER ? klaar() : mislukt(); };
      s.onerror = mislukt;
      document.head.appendChild(s);
    });
  }
  function bannerModule(){
    if (window.NLFR_BANNER) return Promise.resolve();
    return laadModule(BANNER_MODULE).catch(function(){ return laadModule(BANNER_MODULE_FALLBACK); });
  }

  function toonBanner(record){
    var host = document.getElementById("bannerhost");
    if (!host || !window.NLFR_BANNER) return;
    var html = window.NLFR_BANNER.bannerHTML(record);
    if (!html) { host.innerHTML = ""; report(); return; }

    // De CSS van de banner één keer injecteren, uit hetzelfde bestand.
    if (!document.getElementById("bnrcss")) {
      var st = document.createElement("style");
      st.id = "bnrcss";
      st.textContent = window.NLFR_BANNER.BANNER_CSS;
      document.head.appendChild(st);
    }
    host.innerHTML = html;

    // De [?]-uitleg is een IN-FLOW blok onder de banner: geen window.open en
    // geen overlay, want in een iframe met hoogte-sync wordt een overlay
    // afgeknipt. Escape sluit hem, net als nogmaals op [?] tikken.
    var vraag = document.getElementById("bnrvraag");
    var uitleg = document.getElementById("bnruitleg");
    var knop = document.getElementById("bnrknop");
    function zetUitleg(open){
      if (!uitleg) return;
      uitleg.hidden = !open;
      if (vraag) vraag.setAttribute("aria-expanded", open ? "true" : "false");
      report();
    }
    if (vraag && uitleg) vraag.addEventListener("click", function(){ zetUitleg(uitleg.hidden); });
    if (knop && uitleg) knop.addEventListener("click", function(){ zetUitleg(uitleg.hidden); });
    report();
  }

  function laadBanner(){
    var haal = function(url){ return fetch(url, { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }); };
    Promise.all([
      bannerModule().then(function(){ return true; }, function(){ return false; }),
      haal(BANNER_URL).catch(function(){ return null; })
        .then(function(j){ return j || haal(BANNER_FALLBACK).catch(function(){ return null; }); })
    ]).then(function(uit){
      if (!uit[0] || !uit[1]) return;   // geen module of geen record: geen banner
      toonBanner(uit[1]);
    }, function(){});
  }

  // ---- /m: de korte lijst achter de hamburger ---------------------------
  var MSITE_ICONS = {
    mobiel: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
    schijn: '<path d="M12 3l2.4 6.2L21 11l-6.6 1.8L12 19l-2.4-6.2L3 11l6.6-1.8z"/>',
    foto: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-4 4 3 3-2 4 3"/>',
    plaats: '<path d="M12 5v14M5 12h14"/>',
    nieuws: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h7M7 13h10M7 16h6"/>',
    zoek: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    mijn: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4S18.1 16.4 19.5 20"/>',
    hulp: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.4v.4"/><path d="M12 17h.01"/>',
    diensten: '<path d="M4 7h16v12H4z"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>',
    verenig: '<circle cx="9" cy="9" r="3"/><path d="M3.5 19c.9-2.7 2.9-4.2 5.5-4.2S13.6 16.3 14.5 19"/><path d="M16 6.5a3 3 0 0 1 0 5.8M17.5 19c-.3-1.4-.8-2.5-1.5-3.3"/>'
  };
  function ico(k){ return '<span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (MSITE_ICONS[k] || "") + '</svg></span>'; }
  function mrij(href, icon, label, sub){
    var t = tgt(href), rel = (t === "_blank") ? ' rel="noopener"' : '';
    return '<a href="' + href + '" target="' + t + '"' + rel + '>' + ico(icon) + '<span>' + label + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</span></a>';
  }
  function msiteHTML(){
    var h = '<div class="mlijst">';
    h += mrij("https://www.nederlanders.fr/m?id=3295325%3AMobilePage%3A1374046", "mobiel", "NLFR Mobiel", "De mobiele startpagina");
    h += mrij(U("/profiles/blog/list?promoted=1"), "schijn", "In de schijnwerpers", "Uitgelichte berichten");
    h += mrij(U("/page/dagelijks-frankrijknieuws"), "nieuws", "Frankrijknieuws", "Dagelijks bijgewerkt");
    h += mrij(U("/profiles/blog/list"), "zoek", "Alle berichten", "Het hele forum");
    h += mrij(U("/photo"), "foto", "Foto's");
    h += '<div class="sep">Zelf doen</div>';
    h += mrij(U("/profiles/blog/new"), "plaats", "Plaats een bericht");
    h += mrij(isMember ? myPage : U("/main/authorization/signIn"), "mijn", isMember ? "Mijn pagina" : "Meld je aan", isMember ? "" : "of word gratis lid");
    h += '<div class="sep">Handig</div>';
    h += mrij(U("/diensten"), "diensten", "Diensten");
    h += mrij(U("/page/nederlandse-verenigingen-in-frankrijk"), "verenig", "NL-verenigingen");
    h += mrij(U("/page/hulpverlening-in-frankrijk"), "hulp", "Hulp vinden");
    h += '<a class="full" href="' + U("/") + '" target="_parent">Naar de volledige website</a>';
    return h + '</div>';
  }

  // ---- Knoppen -----------------------------------------------------------
  menubtn.addEventListener("click", function(){
    if (MSITE) { openLade(ladeNu === "msite" ? null : "msite", menubtn); return; }
    zetPaneel(!paneel.classList.contains("open"));
  });
  plaatsbtn.addEventListener("click", function(){ openLade("plaats", plaatsbtn); });
  actueelbtn.addEventListener("click", function(){ openLade("actueel", actueelbtn); });
  adminbtn.addEventListener("click", function(){ openLade("admin", adminbtn); });

  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    var uitleg = document.getElementById("bnruitleg");
    if (uitleg && !uitleg.hidden) {
      uitleg.hidden = true;
      var vraag = document.getElementById("bnrvraag");
      if (vraag) vraag.setAttribute("aria-expanded", "false");
      report();
      return;
    }
    if (ladeNu) { sluitLade(); report(); return; }
    if (paneel.classList.contains("open")) zetPaneel(false);
  });

  function syncAdmin(){ adminbtn.classList.toggle("show", isAdmin); }
  syncAdmin();

  // ---- Mobiel: zoekveld in/uitklappen -----------------------------------
  var loep = document.getElementById("loepbtn"), sform = document.getElementById("searchform");
  loep.addEventListener("click", function(){
    var open = !sform.classList.contains("open");
    sform.classList.toggle("open", open);
    loep.classList.toggle("active", open);
    loep.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) { var i = document.getElementById("q"); if (i) i.focus(); }
    report();
  });

  // ---- Zoeken ------------------------------------------------------------
  var q = document.getElementById("q"), wis = document.getElementById("wis");
  function doeZoek(){
    var v = q.value.trim();
    if (!v) return;
    var url = ZOEK_APP + encodeURIComponent(v);
    try { window.top.location.href = url; } catch(e) { window.open(url, "_blank", "noopener"); }
  }
  sform.addEventListener("submit", function(e){ e.preventDefault(); doeZoek(); });
  q.addEventListener("input", function(){ wis.classList.toggle("show", q.value.length > 0); });
  wis.addEventListener("click", function(){ q.value = ""; wis.classList.remove("show"); q.focus(); });

  // ---- Profiel-ontvangst (cross-origin, vanuit embedcode op nederlanders.fr) ----
  window.addEventListener("message", function(e){
    if (e.origin !== PARENT_ORIGIN) return;
    if (!e.data || !("nlfrProfile" in e.data)) return;
    setProfile(e.data.nlfrProfile);
    syncAdmin();
    var wasOpen = paneel.classList.contains("open");
    bouwPaneel();
    if (wasOpen) paneel.classList.add("open");
    if (ladeNu) { lade.innerHTML = ladeHTML(ladeNu); richtLade(); }
    report();
  });

  // ---- Herbouwen bij wisseling mobiel <-> breed (draaien van het toestel) ----
  if (window.matchMedia) {
    var mq = window.matchMedia(MOBILE_MQ);
    var bijWissel = function(){
      applyCompact();
      var wasOpen = paneel.classList.contains("open");
      bouwPaneel();
      if (wasOpen) paneel.classList.add("open");
      richtLade();
      report();
    };
    if (mq.addEventListener) mq.addEventListener("change", bijWissel);
    else if (mq.addListener) mq.addListener(bijWissel);
  }

  // ---- Opstarten ---------------------------------------------------------
  bouwPaneel();
  laadActueel();
  laadBanner();

  window.addEventListener("load", report);
  window.addEventListener("resize", function(){ richtLade(); report(); });
  report();
})();
</script>
