<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Actueel — Frankrijknieuws</title>
<!--
  NLFR ACTUEEL — Nederlandstalige nieuwspagina, embed via iframe op
  https://www.nederlanders.fr/page/actueel-frankrijknieuws (zie EMBED.md).
  Hoofdinhoud is NL: redactiesyntheses (pers), NL-overheidsberichten per thema,
  verenigingen en schoolvakanties. De Franse brontitels staan onderaan,
  standaard ingeklapt. Hoogte-sync via postMessage({nlfrActueelHeight}).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brand: #800000; --actueel: #2f6b3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Mulish', system-ui, sans-serif; line-height: 1.8em; color: #3a3330; padding: 6px; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { font-family: 'Poppins', sans-serif; line-height: 1.3; }

  .card { background: #fff; border: 1px solid rgba(128,0,0,.12); border-radius: 18px; box-shadow: 0 12px 40px -26px rgba(90,0,0,.55); overflow: hidden; }
  .head { padding: 16px 18px 10px; border-bottom: 1px solid rgba(128,0,0,.1); }
  .head h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--brand); }
  .head .sub { font-size: 13px; color: #8a7f7c; margin-top: 2px; }
  .body { padding: 14px 18px 6px; }

  section { margin-bottom: 24px; }
  section > h2 { font-size: 15px; font-weight: 700; color: var(--brand); margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid rgba(128,0,0,.12); }

  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.5); } }
  .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--actueel); animation: pulse 1.6s ease-in-out infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }

  /* 1) Redactiesyntheses (pers). */
  .pub { border: 1px solid rgba(47,107,58,.35); background: rgba(47,107,58,.06); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .pub .label { font-family: 'Poppins',sans-serif; font-weight: 700; font-size: 12px; color: var(--actueel); margin-bottom: 8px; }
  .pub .tekst { font-size: 15px; color: #3a3330; white-space: pre-wrap; }
  .bronblok { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(47,107,58,.2); font-size: 12.5px; color: #6d6360; }
  .bronblok b { font-family: 'Poppins',sans-serif; font-weight: 600; color: var(--actueel); font-size: 11.5px; display: block; margin-bottom: 4px; }
  .bronblok a { display: block; padding: 1px 0; }

  /* 2) Overheid NL per thema. */
  .thema { margin-bottom: 16px; }
  .thema h3 { font-size: 13.5px; font-weight: 700; color: var(--brand); margin: 0 0 8px; }
  .ovitem { padding: 8px 0 10px 12px; border-left: 3px solid rgba(128,0,0,.2); margin-bottom: 8px; }
  .ovitem .tekst { font-size: 14.5px; }
  .ovitem .bron { margin-top: 4px; font-size: 12.5px; }
  .ovitem .bron a { font-family: 'Poppins',sans-serif; font-weight: 600; }

  /* 3) Verenigingen. */
  .ver { padding: 6px 0 8px 12px; border-left: 3px solid rgba(47,107,58,.3); margin-bottom: 8px; }
  .ver .titel { font-size: 14.5px; }
  .ver .titel a { font-family: 'Poppins',sans-serif; font-weight: 600; }
  .ver .tekst { font-size: 13.5px; color: #5b524f; }
  .ver .meta { font-size: 11.5px; color: #a99e9a; }

  /* Schoolvakanties. */
  .vak { border: 1px solid rgba(47,107,58,.35); background: rgba(47,107,58,.06); border-radius: 12px; padding: 12px 16px; }
  .vak h2 { color: var(--actueel); border: none; margin-bottom: 6px; }
  .vak table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .vak td { padding: 4px 6px; border-bottom: 1px solid rgba(47,107,58,.14); vertical-align: top; line-height: 1.4; }
  .vak td.zone { font-family: 'Poppins',sans-serif; font-weight: 600; color: var(--actueel); white-space: nowrap; }
  .vak .link { margin-top: 8px; font-size: 12.5px; }

  /* Ingeklapte Franse koppen. */
  details.koppen { border: 1px solid rgba(128,0,0,.14); border-radius: 12px; background: #fdfbfa; margin-bottom: 20px; }
  details.koppen > summary { cursor: pointer; padding: 12px 16px; font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 14px; color: var(--brand); list-style: none; }
  details.koppen > summary::-webkit-details-marker { display: none; }
  details.koppen > summary::after { content: '▾'; float: right; color: #a99e9a; }
  details.koppen[open] > summary::after { content: '▴'; }
  details.koppen .inhoud { padding: 0 16px 12px; }
  details.koppen .kt { font-size: 12.5px; font-weight: 700; color: var(--brand); text-transform: capitalize; margin: 10px 0 4px; font-family: 'Poppins',sans-serif; }
  details.koppen a.kop { display: block; padding: 3px 0 3px 10px; border-left: 2px solid rgba(128,0,0,.14); color: #5b524f; font-size: 13px; margin: 1px 0; }
  details.koppen a.kop:hover { background: rgba(128,0,0,.05); color: var(--brand); text-decoration: none; }
  details.koppen a.kop .meta { color: #a99e9a; font-size: 11px; }

  .bronstatus { border-top: 1px solid rgba(128,0,0,.1); padding: 10px 18px 14px; font-size: 12px; color: #8a7f7c; display: flex; flex-wrap: wrap; gap: 6px 14px; background: #fdf9f8; line-height: 1.5; }
  .bronstatus .b { display: inline-flex; align-items: center; gap: 5px; }
  .bronstatus .ok { color: var(--actueel); }
  .bronstatus .nok { color: var(--brand); }

  .leeg { color: #8a7f7c; font-size: 13.5px; padding: 4px 0; }
  .laden { color: #8a7f7c; font-size: 14px; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>Actueel — Frankrijknieuws</h1>
    <div class="sub" id="sub">wordt geladen…</div>
  </div>
  <div class="body" id="body">
    <div class="laden">Nieuws wordt opgehaald…</div>
  </div>
  <div class="bronstatus" id="bronstatus"></div>
</div>

<script>
(function(){
  "use strict";
  var bodyEl = document.getElementById("body");
  var subEl = document.getElementById("sub");
  var statusEl = document.getElementById("bronstatus");

  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function datum(iso){ try { var d=new Date(iso); return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } }
  function dag(iso){ try { return new Date(iso).toLocaleDateString("nl-NL",{day:"numeric",month:"short"}); } catch(e){ return ""; } }
  function vakDatum(iso){ try { return new Date(iso).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"}); } catch(e){ return iso; } }
  function themaLabel(t){ return String(t||"").replace(/-/g," "); }

  function render(data){
    var html = "";

    // 1) Redactiesyntheses (pers), bovenaan.
    (data.persSyntheses||[]).forEach(function(p){
      var bron = (p.bronnen||[]).map(function(b){
        return '<a href="'+esc(b.url)+'" target="_top" rel="noopener">'+esc(b.naam || b.titel || b.url)+'</a>';
      }).join("");
      html += '<div class="pub">'+
        '<div class="label">'+(p.hot?'<span class="dot"></span>':'')+esc(p.label)+'</div>'+
        '<div class="tekst">'+esc(p.tekst)+'</div>'+
        (bron ? '<div class="bronblok"><b>Bronnen</b>'+bron+'</div>' : '')+
      '</div>';
    });

    // 2) Overheid NL, per thema.
    if ((data.overheid||[]).length){
      html += '<section><h2>Van de Franse overheid</h2>';
      data.overheid.forEach(function(g){
        html += '<div class="thema"><h3>'+esc(g.label||themaLabel(g.thema))+'</h3>';
        (g.items||[]).forEach(function(it){
          html += '<div class="ovitem"><div class="tekst">'+esc(it.samenvatting)+'</div>'+
            '<div class="bron">Bron: <a href="'+esc(it.url)+'" target="_top" rel="noopener">'+esc(it.bron)+' →</a> <span style="color:#a99e9a">· '+esc(dag(it.datum))+'</span></div></div>';
        });
        html += '</div>';
      });
      html += '</section>';
    }

    // 3) Verenigingen (al NL).
    if ((data.verenigingen||[]).length){
      html += '<section><h2>Nederlandse verenigingen in Frankrijk</h2>';
      data.verenigingen.forEach(function(v){
        html += '<div class="ver"><div class="titel"><a href="'+esc(v.url)+'" target="_top" rel="noopener">'+esc(v.titel)+'</a></div>'+
          (v.samenvatting?'<div class="tekst">'+esc(v.samenvatting)+'</div>':'')+
          '<div class="meta">'+esc(v.bron)+' · '+esc(dag(v.datum))+'</div></div>';
      });
      html += '</section>';
    }

    // (schoolvakanties wordt na de tweede fetch toegevoegd)
    // 4) Alle Franse koppen (ingeklapt).
    if ((data.franseKoppen||[]).length){
      var kop = '<details class="koppen"><summary>Alle Franse koppen</summary><div class="inhoud">';
      data.franseKoppen.forEach(function(t){
        kop += '<div class="kt">'+esc(themaLabel(t.thema))+'</div>';
        (t.items||[]).forEach(function(i){
          kop += '<a class="kop" href="'+esc(i.url)+'" target="_top" rel="noopener">'+esc(i.titel)+
            ' <span class="meta">— '+esc(i.bron)+' · '+esc(dag(i.datum))+'</span></a>';
        });
      });
      kop += '</div></details>';
      html += kop;
    }

    if (!(data.persSyntheses||[]).length && !(data.overheid||[]).length && !(data.verenigingen||[]).length && !(data.franseKoppen||[]).length){
      html += '<div class="leeg">Op dit moment geen nieuws opgehaald.</div>';
    }

    bodyEl.innerHTML = html;
    subEl.textContent = "Bijgewerkt " + datum(data.bijgewerkt);
    renderStatus(data.bronStatus||[]);
    koppelDetails();
    report();
  }

  function renderStatus(lijst){
    if (!lijst.length){ statusEl.innerHTML = ""; return; }
    statusEl.innerHTML = '<span class="b" style="font-weight:600">Bronnen:</span>' + lijst.map(function(b){
      var cls = b.ok ? "ok" : "nok";
      var teken = b.ok ? "●" : "○";
      return '<span class="b '+cls+'">'+teken+' '+esc(b.naam)+' ('+(b.aantal||0)+')</span>';
    }).join("");
  }

  function renderVakanties(v){
    if (!v || !v.zones || !v.zones.length) return "";
    var rijen = v.zones.map(function(z){
      return '<tr><td class="zone">'+esc(z.zone)+'</td><td>'+esc(z.vakantie)+
        '<br><span style="color:#8a7f7c">'+esc(vakDatum(z.start))+' – '+esc(vakDatum(z.eind))+'</span></td></tr>';
    }).join("");
    return '<section class="vak"><h2>Schoolvakanties</h2><table>'+rijen+'</table>'+
      '<div class="link"><a href="'+esc(v.servicePublic)+'" target="_top" rel="noopener">Officiële kalender &amp; regels (service-public.gouv.fr) →</a></div></section>';
  }

  // <details> opnieuw hoogte melden bij open/dicht.
  function koppelDetails(){
    Array.prototype.forEach.call(document.querySelectorAll("details.koppen"), function(d){
      d.addEventListener("toggle", report);
    });
  }

  // ---- Hoogte-sync naar de moederpagina ----
  var lastH = 0;
  function report(){
    try {
      if (window.parent && window.parent !== window){
        var card = document.querySelector(".card");
        if (!card) return;
        var h = Math.ceil(card.getBoundingClientRect().height) + 12;
        if (h !== lastH){ lastH = h; window.parent.postMessage({ nlfrActueelHeight: h }, "*"); }
      }
    } catch(e){}
  }

  function laad(){
    Promise.all([
      fetch("/api/actueel", { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
      fetch("/api/schoolvakanties", { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
    ]).then(function(res){
      var data = res[0] || { bijgewerkt: new Date().toISOString(), persSyntheses: [], overheid: [], verenigingen: [], franseKoppen: [], bronStatus: [] };
      render(data);
      // Schoolvakanties tussen verenigingen en de Franse koppen plaatsen: vóór de
      // ingeklapte sectie invoegen.
      var vak = renderVakanties(res[1]);
      if (vak){
        var det = bodyEl.querySelector("details.koppen");
        if (det) det.insertAdjacentHTML("beforebegin", vak);
        else bodyEl.insertAdjacentHTML("beforeend", vak);
        koppelDetails();
        report();
      }
    });
  }

  window.addEventListener("load", report);
  window.addEventListener("resize", report);
  laad();
  setInterval(laad, 5 * 60 * 1000);
})();
</script>
</body>
</html>
