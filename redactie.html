<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NLFR · Redactie</title>
<link rel="icon" type="image/svg+xml" href="/assets/redactie-icoon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Eenvoudig redactiescherm (besluit opdrachtgever 26-11-2026, mock-up goedgekeurd): één lijst "vandaag",
   per bericht alleen Weg, de rest achter een tik op de kop. De nieuwsmotor (Nieuwsvoorziening) doet alles,
   de beheerder grijpt alleen in. Huisstijl: Manrope en Source Serif 4 via Google Fonts, alleen op deze pagina
   (test/fonts.test.mjs); valt de download weg, dan Georgia en het systeemfont. Maat: telefoon 390 px,
   tikvlakken minstens 44 px, ook goed op laptopbreedte. */
:root{--maroon:#800000;--wit:#faf7f4;--inkt:#1f1a18;--lijn:#e7dfd8;--lijn2:#cfc5bc;--groen:#2f6b3a;--grijs:#6f6660;--kaart:#ffffff;--zacht:#f3eee9;--rood:#9b1c1c;--roodzacht:#fbeeee;--peil-groen:#2f6b3a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--wit);color:var(--inkt);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:var(--maroon);font-weight:700;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.serif,h1,h2,h3,.t{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.kop{background:var(--kaart);border-bottom:1px solid var(--lijn)}
.kop .wrap{display:flex;align-items:center;justify-content:space-between;min-height:68px;gap:12px}
.kop h1{font-weight:700;font-size:26px;line-height:1.1}
.kop .dag{font-size:14px;color:var(--grijs);margin-top:2px}
.lk{background:none;border:0;color:var(--maroon);font-weight:700;font-size:15px;min-height:48px;padding:0 4px;display:inline-flex;align-items:center;white-space:nowrap}
.terugk{margin-left:-4px}
main{padding-bottom:40px}
body.met-toast main{padding-bottom:110px}
.storing{background:var(--roodzacht);color:var(--rood);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px;font-weight:700}
.wacht{margin-top:10px;border:1px solid var(--lijn2);border-radius:16px;padding:12px 14px 6px;background:var(--zacht)}
.wacht .r{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--grijs)}
.wacht h3{font-weight:600;font-size:17px;line-height:1.25;margin:2px 0 8px}
.wacht .regel{font-size:14px;line-height:1.35;color:#3b3430;margin:0 0 6px}
.wacht .regel s{color:var(--grijs)}
.wacht .twijfel{font-size:13px;line-height:1.35;color:var(--grijs);margin:0 0 8px}
.twee{display:flex;gap:8px;margin-bottom:6px}
.knop{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--lijn2);background:var(--kaart);font-weight:700;font-size:15px;padding:0 14px}
.knop.hoofd{background:var(--inkt);color:#fff;border-color:var(--inkt)}
.knop.weg{color:var(--rood);border-color:var(--rood);width:100%}
.knop.peilknop{width:100%;flex:none;min-height:48px;margin-bottom:0}
.knop.peilknop.groen{background:var(--peil-groen,#2f6b3a);border-color:var(--peil-groen,#2f6b3a);color:#fff}
.knop.peilknop.oranje{background:#EF9F27;border-color:#EF9F27;color:#412402}
.tekstlinks{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;margin-top:0}
.tekstlinks button,.tekstlinks a{min-height:44px;background:none;border:0;color:var(--maroon);font-weight:700;font-size:14px;padding:0;display:inline-flex;align-items:center;white-space:nowrap}
.tekstlinks a{margin-left:auto}
.nog{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:48px;margin-top:6px;padding:0 4px;background:none;border:0;border-bottom:1px solid var(--lijn);color:var(--maroon);font-weight:700;font-size:15px;text-align:left}
.stand{font-size:13px;color:var(--grijs);padding:16px 2px 6px}
.lijst{border-top:1px solid var(--lijn)}
.rij{display:flex;align-items:center;gap:10px;padding:6px 0 6px 2px;border-bottom:1px solid var(--lijn)}
.open-knop{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 0;min-height:56px}
.rij .k{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:17px;line-height:1.3}
.rij .m{display:block;font-size:13px;color:var(--grijs);margin-top:3px}
.rij .m b{font-weight:600;color:var(--inkt)}
.wegk{flex:none;min-width:64px;min-height:44px;border-radius:10px;border:1px solid var(--lijn2);background:var(--kaart);font-weight:600;font-size:14px;color:var(--grijs);padding:0 12px}
.rij.isweg .k{color:var(--grijs);text-decoration:line-through}
.rij.isweg .wegk{color:var(--maroon);border-color:var(--maroon)}
.leeg{padding:18px 2px;color:var(--grijs);font-size:15px}
.onder{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;font-size:15px}
.onder span{color:var(--grijs)}
.open{padding:14px 0}
.open .r{font-size:13px;color:var(--grijs)}
.open h2{font-weight:700;font-size:21px;line-height:1.3;margin:6px 0 8px}
.open .sam{font-size:16px;line-height:1.5;color:#3b3430;margin:0 0 14px;white-space:pre-line}
.sch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;background:none;border:0;border-top:1px solid var(--lijn);border-bottom:1px solid var(--lijn);font-size:16px;text-align:left;padding:0}
.sch small{display:block;font-size:13px;color:var(--grijs);margin-top:2px;font-weight:400}
.sw{width:50px;height:30px;border-radius:15px;background:var(--lijn2);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff}
[aria-checked="true"] .sw{background:var(--inkt)}
[aria-checked="true"] .sw:after{left:23px}
.lijstk button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:54px;background:none;border:0;border-bottom:1px solid var(--lijn);font-size:16px;text-align:left;padding:0}
.lijstk button span{color:var(--grijs);font-size:14px}
.plekken{background:var(--zacht);border-radius:12px;margin:8px 0}
.plekken .sch{border:0;border-top:1px solid var(--lijn);padding:0 12px}
.plekken .sch:first-child{border-top:0}
.ruimte{height:18px}
.veld{display:block;font-size:13px;font-weight:700;color:var(--grijs);margin:14px 0 6px}
.inv,.veld input,.veld textarea,.veld select{display:block;width:100%;min-height:48px;font:inherit;font-size:16px;font-weight:400;color:var(--inkt);border:1px solid var(--lijn2);border-radius:10px;padding:10px 12px;background:var(--kaart);line-height:1.4}
textarea.inv{height:190px;resize:vertical}
textarea.inv.kort{height:84px}
select.inv{appearance:auto}
.hint{font-size:13px;color:var(--grijs);margin:8px 0 0;line-height:1.4}
.vast{position:fixed;left:0;right:0;bottom:0;padding:12px 18px 18px;background:var(--wit);border-top:1px solid var(--lijn)}
.vast .knop{max-width:524px;display:block;margin:0 auto;width:100%}
.verbeter{padding-bottom:100px}
h2.sec{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:20px;margin:22px 0 8px}
.blok{background:var(--kaart);border:1px solid var(--lijn);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.blok h3{font-weight:600;font-size:18px;margin-bottom:4px}
.blok p{font-size:15px;color:var(--grijs)}
.regel2{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-top:1px solid var(--lijn);font-size:15px;gap:10px}
.regel2>span:first-child{color:var(--grijs);flex:1;min-width:0}
.regel2 a,.regel2 .linkknop{display:inline-flex;align-items:center;min-height:44px}
.linkknop{background:none;border:0;color:var(--maroon);font-weight:700;font-size:15px;padding:0;min-height:44px;white-space:nowrap;flex:none}
.blok .twee{margin-top:12px}
.links{padding-top:4px;padding-bottom:4px}.links .regel2:first-child{border-top:0}
.bewerk{background:var(--wit);border:1px solid var(--lijn);border-radius:14px;padding:4px 14px 14px;margin-top:8px}
.rij2{display:flex;gap:10px}.rij2>*{flex:1;min-width:0}
.kleuren{display:flex;gap:10px;margin-top:6px}
.kleuren button{width:44px;height:44px;border-radius:50%;border:3px solid var(--kaart);box-shadow:0 0 0 1px var(--lijn)}
.kleuren button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--inkt)}
.melding{font-size:14px;margin-top:8px;color:var(--grijs)}.melding.fout{color:var(--rood);font-weight:700}
.passkey{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;border-top:1px solid var(--lijn);font-size:15px}
.nietk{padding:12px 2px;border-bottom:1px solid var(--lijn)}
.nietk .k{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:17px;line-height:1.3}
.nietk .reden{font-size:14px;color:var(--grijs);margin-top:3px}.nietk .reden b{color:var(--inkt)}
.nietk .s{font-size:15px;color:#3b3430;margin:6px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nietk .twee .knop{min-height:44px;font-size:14px}
.toast{position:fixed;left:12px;right:12px;bottom:14px;z-index:9;background:var(--inkt);color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:15px;max-width:536px;margin:0 auto}
.toast span{flex:1}
.toast button{min-height:44px;border-radius:10px;border:0;background:transparent;color:#fff;text-decoration:underline;font-weight:700;padding:0 12px}
</style>
</head>
<body>
<header class="kop"><div class="wrap" id="kop"></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden role="status"><span id="toast-tekst"></span><button type="button" id="toast-terug" hidden></button></div>

<script src="/assets/inlog.js"></script>
<script>
(function () {
  "use strict";
  var NV = "https://nieuws.infofrankrijk.com";
  var RUBRIEK = { "algemeen": "Algemeen", "politiek": "Politiek", "economie en ondernemen": "Economie", "reizen en verkeer": "Reizen en verkeer", "natuur en rampen": "Natuur en rampen", "toerisme en evenementen": "Toerisme", "merkwaardig": "Merkwaardig" };
  var RUBRIEK_VOL = { "algemeen": "Algemeen", "politiek": "Politiek", "economie en ondernemen": "Economie en ondernemen", "reizen en verkeer": "Reizen en verkeer", "natuur en rampen": "Natuur en rampen", "toerisme en evenementen": "Toerisme en evenementen", "merkwaardig": "Merkwaardig" };
  var ANDERE = [["actueel", "Nederlanders.fr nieuws"], ["infopoche", "Infopoche"], ["zijbalk", "Zijbalk van het forum"], ["infofrankrijk", "Infofrankrijk"]];
  var KLEUREN = ["#2f6b3a", "#6b3a8f", "#a97a1f", "#1f6b7a"];
  var MND = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
  var DAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
  var PEIL_KEUZE_REGIE = { vastgesteld: "b", verwacht: "a", raakt_niet: "niets" };
  var st = { berichten: [], peilNv: [], nvFout: null, run: null, regie: null, cj: null, banner: null, actueel: null, blok: null, view: "lijst", id: null, plekkenOpen: false, geladenOp: 0, bezig: false };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function veilig(u) { return /^https:\/\//.test(String(u || "")) ? String(u) : ""; }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
  var TZ = "Europe/Amsterdam";
  function tijd(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit", timeZone: TZ }); }
  function dagSleutel(d) { return new Date(d).toLocaleDateString("sv-SE", { timeZone: TZ }); }
  function datumLang(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); if (!m) return ""; var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return DAGEN[d.getUTCDay()] + " " + (+m[3]) + " " + MND[+m[2] - 1]; }
  function datumKort(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? (+m[3]) + " " + MND[+m[2] - 1] + " " + m[1] : String(iso || ""); }
  function hoofdletter(t) { t = String(t || ""); return t.charAt(0).toUpperCase() + t.slice(1); }

  // ---- verkeer met de servers ------------------------------------------------
  function api(pad, opties) {
    opties = opties || {};
    var o = { credentials: "same-origin", cache: "no-store", method: opties.method || "GET", headers: {} };
    if (opties.body) { o.method = "POST"; o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(opties.body); }
    return fetch(pad, o).then(function (r) {
      if (r.status === 401) { location.href = "/login?terug=/redactie"; throw new Error("login"); }
      return r.json().catch(function () { return {}; }).then(function (d) { d = d || {}; d.__status = r.status; return d; });
    });
  }
  function stil(e) { if (e && e.message === "login") return; }

  // ---- melding onderaan, met ongedaan maken (5 seconden) -----------------------------
  var toastTimer = null, toastTik = null, toastUndo = false, houdToast = false;
  function sluitToast() { clearInterval(toastTik); clearTimeout(toastTimer); toastUndo = false; $("toast").hidden = true; document.body.classList.remove("met-toast"); }
  // Bij navigeren naar een ander scherm gaat de melding weg, behalve de ongedaan-maken-melding als je in de lijst komt.
  function naNavigatie(view) { if (houdToast) { houdToast = false; return; } if (!(view === "lijst" && toastUndo)) sluitToast(); }
  function toast(tekst, terug) {
    clearInterval(toastTik); clearTimeout(toastTimer);
    $("toast-tekst").textContent = tekst; $("toast").hidden = false; document.body.classList.add("met-toast");
    var kn = $("toast-terug"); toastUndo = !!terug;
    if (!terug) { kn.hidden = true; toastTimer = setTimeout(sluitToast, 3500); return; }
    var rest = 5; kn.hidden = false; kn.textContent = "Ongedaan maken (" + rest + ")";
    kn.onclick = function () { sluitToast(); terug(); };
    toastTik = setInterval(function () { rest--; if (rest <= 0) sluitToast(); else kn.textContent = "Ongedaan maken (" + rest + ")"; }, 1000);
  }

  // ---- de nieuwsmotor --------------------------------------------------------
  function laadNv() {
    return api("/api/redactie-nv?dagen=2").then(function (d) {
      if (d.ok && Array.isArray(d.berichten)) { st.berichten = d.berichten; st.run = d.laatsteRun || null; st.nvFout = null; st.peilNv = Array.isArray(d.peil) ? d.peil : []; }
      else { st.nvFout = d.fout || "De nieuwsmotor is nu niet bereikbaar."; st.run = null; st.peilNv = []; }
    }).catch(function (e) { stil(e); st.nvFout = "De nieuwsmotor is nu niet bereikbaar. Probeer het zo opnieuw."; st.peilNv = []; });
  }
  function vandaagLijst() {
    var nu = dagSleutel(Date.now());
    return st.berichten.filter(function (b) {
      if (b.redactie === "weg") return b.redactieOp && dagSleutel(b.redactieOp) === nu && (b.geplaatst || b.gepubliceerdOp);
      return b.geplaatst && b.gepubliceerdOp && dagSleutel(b.gepubliceerdOp) === nu;
    }).sort(function (a, b) { return String(b.gepubliceerdOp || b.redactieOp).localeCompare(String(a.gepubliceerdOp || a.redactieOp)); });
  }
  function tijdVan(b) {
    var t = b.gepubliceerdOp ? Date.parse(b.gepubliceerdOp) : 0;
    (b.bronnen || []).forEach(function (x) { var p = Date.parse(x.datum); if (p > t) t = p; });
    return t || 0;
  }
  function nietLijst() {
    var grens = Date.now() - 24 * 3600 * 1000;
    return st.berichten.filter(function (b) { return !b.geplaatst && b.redactie !== "weg" && tijdVan(b) > grens; })
      .sort(function (a, b) { return tijdVan(b) - tijdVan(a); });
  }
  function vind(id) { for (var i = 0; i < st.berichten.length; i++) if (st.berichten[i].id === id) return st.berichten[i]; return null; }
  function zetBericht(nieuw) { if (!nieuw) return; for (var i = 0; i < st.berichten.length; i++) if (st.berichten[i].id === nieuw.id) st.berichten[i] = nieuw; }
  function kanaalAan(b, k) { return !b.kanalen || b.kanalen[k] !== false; }
  function rubriekNaam(b) { return b.soort === "overheid" ? "Overheid" : (RUBRIEK[b.categorie] || b.categorie || ""); }
  function stuur(opdracht) {
    return api("/api/redactie-nv", { body: opdracht }).then(function (d) {
      if (d.ok && d.bericht) { zetBericht(d.bericht); return d; }
      var e = new Error(d.fout || "Het lukte niet."); e.melding = true; throw e;
    });
  }
  function fout(e) { if (e && e.message === "login") return; toast((e && e.melding) ? e.message : "Het lukte niet. Probeer het zo opnieuw."); }

  // Reden in gewone taal, nooit met getallen. De motor levert `redenTekst`; zonder dat veld
  // vertalen we de bekende redenen zelf.
  function redenKort(b) {
    var t = String(b.redenTekst || "").trim();
    if (t) return t.replace(/\.$/, "");
    var r = String(b.reden || "") + " " + (b.blokkadeRedenen || []).join(" "), l = r.toLowerCase();
    if (!r.trim()) return "De motor plaatste dit bericht niet";
    if (/krantennaam|perslink|persnaam/.test(l)) return "De tekst noemt een krant";
    if (/letterlijk overgenomen|te dicht bij|te veel op/.test(l)) return "De tekst lijkt te veel op het origineel";
    if (/relevantie|drempel|score|landelijke politiek|geen gevolg|raakt .* niet/.test(l)) return "Te weinig van belang voor onze lezers";
    if (/(één|1|een) bron|minimaal|onafhankelijke bron|te weinig bronnen/.test(l)) return "Maar één bron gevonden";
    if (/te kort|leeg/.test(l)) return "De tekst is te kort";
    if (/alinea/.test(l)) return "De tekst heeft geen alinea's";
    if (/praat over invoer|volgens de bronnen/.test(l)) return "De tekst praat over de bronnen";
    if (/link of domeinnaam/.test(l)) return "Er staat een link in de tekst";
    if (/bedrag niet in bron/.test(l)) return "Er staat een bedrag in dat niet in de bronnen staat";
    if (/herschrijven/.test(l)) return "Opnieuw schrijven gaf geen goed bericht";
    return "De kwaliteitscontrole hield dit bericht tegen";
  }

  // ---- PEIL: twee bronnen, één kaart --------------------------------------------------
  // Nieuwe motor: veld `peil` in de GET. Bestaande bewaking: st.regie.peil.besluiten met keuzes b, a en niets.
  function peilOpenRegie() {
    var p = st.regie && st.regie.peil, b = (st.regie && st.regie.besluiten) || {};
    return ((p && p.besluiten) || []).filter(function (x) { return !b[x.mutatie]; });
  }
  function kaartUitMotor(p) {
    if (!p || p.id == null || p.id === "") return null;
    var soort = p.soort === "ontbreekt" ? "ontbreekt" : "wijziging";
    var zeker = p.zekerheid === "groen" ? "groen" : "oranje";
    var advies = soort === "ontbreekt" ? "lijst" : (p.advies === "verwacht" || p.advies === "vastgesteld") ? p.advies : (zeker === "groen" ? "vastgesteld" : "verwacht");
    return { bron: "nv", id: String(p.id), soort: soort, zekerheid: zeker, advies: advies, titel: p.titel || "", huidige: p.huidige || "", nieuw: p.nieuw || "", vanaf: p.vanaf || "", twijfel: p.twijfel || "", berichtKop: p.berichtKop || "", bronUrl: veilig(p.bronUrl) };
  }
  // Groen als beide oordelen een citaat hebben dat klopt en dezelfde nieuwe waarde noemen, anders oranje.
  function kaartUitRegie(p) {
    var oo = (p.oordelen || []).slice(0, 2);
    var w = oo.map(function (o) { return String(o.nieuwe_waarde || "").trim(); });

        (b.samenvatting ? '<div class="s">' + esc(b.samenvatting) + "</div>" : "") +
        '<div class="twee">' + plaats + '<button type="button" class="knop" data-actie="herschrijf" data-id="' + esc(b.id) + '"' + (b.handmatigOp ? " disabled" : "") + ">Opnieuw laten schrijven</button></div>" +
        (b.handmatigOp ? '<p class="hint">Handmatig aangepast: wordt nooit automatisch herschreven.</p>' : "") + "</div>";
    }).join("");
  }
  function vwInstellingen() {
    return '<h2 class="sec">Café Jeudi</h2><div class="blok" id="cj"></div>' +
      '<h2 class="sec">Dit apparaat</h2><div class="blok" id="apparaat"><p id="wieben"></p><div id="passkeylijst"></div>' +
      '<div class="regel2"><span>Inloggen met vingerafdruk op dit apparaat</span><button type="button" class="linkknop" id="passkeynieuw" hidden>Instellen ›</button></div>' +
      '<div class="regel2"><span>Klaar op een geleend toestel?</span><button type="button" class="linkknop" id="uitlog">Uitloggen</button></div><p class="melding" id="appmelding" role="status"></p></div>' +
      '<h2 class="sec">Bronnen</h2><div class="blok" id="bronnen"><p>Laden…</p></div>' +
      '<h2 class="sec">Zo staat het er nu</h2><div class="blok links">' +
      [["https://nieuws.infofrankrijk.com", "Nieuws op nieuws.infofrankrijk.com"], ["https://www.nederlanders.fr/page/actueel-frankrijknieuws", "Nieuwspagina van Nederlanders.fr"], ["https://nlfr-nieuwsbrief.vercel.app/api/nieuwsbrief", "Laatste nieuwsbrief"], ["https://infopoche.fr", "Infopoche"], ["https://www.nederlanders.fr/forum", "Forum met zijbalk"], ["https://infofrankrijk.com", "Infofrankrijk"]].map(function (l) {
        return '<a class="regel2" href="' + l[0] + '" target="_blank" rel="noopener">' + l[1] + " ↗</a>";
      }).join("") + "</div>";
  }
  function teken() {
    var b = st.id ? vind(st.id) : null;
    if ((st.view === "open" || st.view === "verbeter") && !b) { st.view = "lijst"; st.id = null; }
    var h;
    if (st.view === "open") h = vwOpen(b);
    else if (st.view === "verbeter") h = vwVerbeter(b);
    else if (st.view === "niet") h = vwNiet();
    else if (st.view === "instellingen") h = vwInstellingen();
    else h = vwLijst();
    $("kop").innerHTML = kopHtml();
    $("app").innerHTML = h;
    if (st.view === "instellingen") { tekenCj(); tekenBronnen(); laadApparaat(); }
  }
  // Na een wijziging op de achtergrond: alleen opnieuw tekenen waar dat niets verstoort.
  function bijwerken() {
    if (st.view === "verbeter") return;
    if (st.view === "instellingen") { tekenCj(); tekenBronnen(); return; }
    teken();
  }

  // ---- navigatie (ook met de terugknop van de telefoon) --------------------------------------
  var diepte = 0;
  function ga(view, id) {
    naNavigatie(view);
    st.view = view; st.id = id || null; st.plekkenOpen = false;
    diepte++; try { history.pushState({ v: view, id: st.id, n: diepte }, ""); } catch (e) {}
    teken(); window.scrollTo(0, 0);
    if (view === "instellingen" && !st.blok) laadBlok().then(tekenBronnen);
  }
  function terug() {
    if (diepte > 0) { try { history.back(); return; } catch (e) {} }
    naNavigatie("lijst"); st.view = "lijst"; st.id = null; teken();
  }
  window.addEventListener("popstate", function (e) {
    var s = e.state || { v: "lijst", n: 0 };
    naNavigatie(s.v || "lijst");
    diepte = s.n || 0; st.view = s.v || "lijst"; st.id = s.id || null; st.plekkenOpen = false; teken(); window.scrollTo(0, 0);
  });

  // ---- handelingen ----------------------------------------------------------------------------
  function weg(id) {
    stuur({ id: id, actie: "weg" }).then(function () {
      if (st.view === "open") { diepte > 0 ? terug() : (st.view = "lijst", st.id = null); }
      teken(); toast("Weggehaald.", function () { stuur({ id: id, actie: "terug" }).then(function () { bijwerken(); }).catch(fout); });
    }).catch(fout);
  }
  function actie(id, a) {
    if (a === "weg") weg(id);
    else if (a === "terug") stuur({ id: id, actie: "terug" }).then(function () { teken(); toast("Teruggezet op dezelfde plekken."); }).catch(fout);
    else if (a === "plaats") stuur({ id: id, actie: "plaats" }).then(function () { teken(); toast("Geplaatst."); }).catch(fout);
    else if (a === "herschrijf") stuur({ id: id, actie: "herschrijf" }).then(function () { teken(); toast("De motor schrijft dit bericht bij de volgende controle opnieuw."); }).catch(fout);
  }
  function zetKanaal(id, kanaal, aan) {
    var b = vind(id); if (!b) return;
    var naam = kanaal === "nieuwsbrief" ? "de brief" : (ANDERE.filter(function (p) { return p[0] === kanaal; })[0] || [0, kanaal])[1];
    stuur({ id: id, actie: "kanaal", kanaal: kanaal, aan: aan }).then(function () {
      teken();
      toast(aan ? "Weer in " + naam : "Niet in " + naam, function () { stuur({ id: id, actie: "kanaal", kanaal: kanaal, aan: !aan }).then(function () { bijwerken(); }).catch(fout); });
    }).catch(function (e) { fout(e); teken(); });
  }
  function bewaarVerbetering(id) {
    var o = { id: id, actie: "bewerk", kop: $("vb-kop").value.trim(), samenvatting: $("vb-sam").value.trim(), categorie: $("vb-cat").value };
    if (!o.kop) { toast("De kop mag niet leeg zijn."); return; }
    stuur(o).then(function () {
      // Terug naar het geopende bericht via de geschiedenis, zodat één tik terug naar de lijst volstaat.
      if (diepte > 0) { houdToast = true; setTimeout(function () { houdToast = false; }, 500); try { history.back(); } catch (e) { houdToast = false; st.view = "open"; st.id = id; teken(); } }
      else { st.view = "open"; st.id = id; teken(); window.scrollTo(0, 0); }
      toast("Bewaard. De motor laat kop en samenvatting met rust.");
    }).catch(fout);
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button,a") : null; if (!t) return;
    var g = function (k) { return t.getAttribute(k); }, heeft = function (k) { return t.hasAttribute(k); };
    if (heeft("data-ga")) { ga(g("data-ga")); return; }
    if (heeft("data-terug")) { terug(); return; }
    if (heeft("data-open")) { ga("open", g("data-open")); return; }
    if (heeft("data-verbeter")) { ga("verbeter", g("data-verbeter")); return; }
    if (heeft("data-wacht")) { st.wachtOpen = !st.wachtOpen; teken(); return; }
    if (heeft("data-plekken")) { st.plekkenOpen = !st.plekkenOpen; teken(); return; }
    if (heeft("data-kanaal")) { zetKanaal(g("data-id"), g("data-kanaal"), g("aria-checked") !== "true"); return; }
    if (heeft("data-actie")) { actie(g("data-id"), g("data-actie")); return; }
    if (heeft("data-bewaar-vb")) { bewaarVerbetering(g("data-bewaar-vb")); return; }
    if (heeft("data-peil-keuze")) { peilKies(g("data-peil-bron"), g("data-peil-id"), g("data-peil-keuze")); return; }
    if (heeft("data-cj")) { cjZet(g("data-cj") === "ja"); return; }
    if (t.id === "cj-wijzig") { st.cjWijzig = true; tekenCj(); return; }
    if (t.id === "cj-aanpassen") { cjForm(); return; }
    if (t.id === "f-sluit") { $("cj-form").innerHTML = ""; return; }
    if (t.id === "f-bewaar") { bewaarBanner(); return; }
    if (heeft("data-kleur")) { [].forEach.call(document.querySelectorAll("#f-kleuren button"), function (x) { x.setAttribute("aria-pressed", x === t ? "true" : "false"); }); return; }
    if (t.id === "bron-toon") { st.bronnenOpen = !st.bronnenOpen; tekenBronnen(); return; }
    if (heeft("data-blokkeer") || heeft("data-deblokkeer")) {
      var blok = heeft("data-blokkeer");
      api("/api/selectie", { body: { actie: blok ? "blokkeer" : "deblokkeer", bron: g(blok ? "data-blokkeer" : "data-deblokkeer") } }).then(function (d) {
        if (d.ok) { st.blok = st.blok || {}; st.blok.geblokkeerd = d.bronnen; tekenBronnen(); toast(blok ? "Bron geblokkeerd." : "Bron weer aan."); } else toast("Niet gelukt: " + (d.fout || "onbekende fout"));
      }).catch(function (er) { stil(er); });
      return;
    }
    if (t.id === "uitlog") { inlog().then(function (sb) { return sb.auth.signOut({ scope: "local" }); }).catch(function () {}).then(function () { location.replace("/login?reden=uitgelogd"); }); return; }
    if (t.id === "passkeynieuw") {
      t.disabled = true; appMelding("");
      inlog().then(function (sb) { return sb.auth.registerPasskey(); }).then(function (r) { if (r.error) throw r.error; appMelding("Ingesteld. Vanaf nu log je op dit apparaat in met één handeling."); laadApparaat(); })
        .catch(function (er) { appMelding(NLFRAuth.foutTekst(er), true); }).then(function () { t.disabled = false; });
      return;
    }
    if (heeft("data-passkey")) {
      if (!window.confirm("Dit apparaat verwijderen?\n\nInloggen met dat apparaat werkt daarna niet meer. Een inloglink per mail blijft werken.")) return;
      var pid = g("data-passkey");
      inlog().then(function (sb) { return sb.auth.passkey.delete({ passkeyId: pid }); }).then(function (r) { if (r && r.error) throw r.error; laadApparaat(); }).catch(function (er) { appMelding(NLFRAuth.foutTekst(er), true); });
    }
  });

  // ---- laden: bij openen en bij terugkomen in het tabblad (geen herlaadknop) ---------------------
  function alles() {
    st.geladenOp = Date.now();
    return Promise.all([
      laadNv().then(bijwerken),
      api("/api/regie").then(function (d) { st.regie = d.ok ? d : null; bijwerken(); }).catch(function (e) { stil(e); }),
      laadCj().then(bijwerken),
      laadActueel().then(function () { if (st.view === "instellingen") tekenBronnen(); })
    ]);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - st.geladenOp > 15000) alles();
  });
  try { history.replaceState({ v: "lijst", n: 0 }, ""); } catch (e) {}
  teken();
  alles();
})();
</script>
</body>
</html>
