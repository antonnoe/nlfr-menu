<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NLFR — Redactie actueel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brand:#800000; --actueel:#2f6b3a; }
  * { box-sizing:border-box; }
  body { font-family:'Mulish',system-ui,sans-serif; line-height:1.7; color:#3a3330; background:#fdf9f8; margin:0; padding:12px; max-width:760px; margin:0 auto; }
  h1 { font-family:'Poppins',sans-serif; font-size:20px; color:var(--brand); margin:6px 0 2px; }
  .sub { color:#8a7f7c; font-size:13px; margin-bottom:14px; }
  h2 { font-family:'Poppins',sans-serif; font-size:15px; color:var(--brand); border-bottom:1px solid rgba(128,0,0,.12); padding-bottom:6px; margin:22px 0 12px; }

  .balk { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .balk .tel { font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; color:var(--brand); margin-right:auto; }
  .balk button { font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; border-radius:999px; padding:8px 14px; cursor:pointer; min-height:40px; border:1px solid rgba(128,0,0,.2); background:rgba(128,0,0,.06); color:var(--brand); }
  .balk button:hover { background:rgba(128,0,0,.12); }
  .balk button.gevaar { border-color:rgba(128,0,0,.3); }

  .kaart { background:#fff; border:1px solid rgba(128,0,0,.14); border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 10px 30px -24px rgba(90,0,0,.5); }
  .kaart.pub { border-color:rgba(47,107,58,.4); background:rgba(47,107,58,.05); }
  .meta { font-size:12px; color:#8a7f7c; margin-bottom:8px; }
  .meta b { font-family:'Poppins',sans-serif; color:var(--actueel); font-weight:600; }
  .kop { font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; color:#3a3330; margin:2px 0 8px; }
  textarea { width:100%; min-height:180px; font-family:'Mulish',sans-serif; font-size:14.5px; line-height:1.7; color:#3a3330; border:1px solid rgba(128,0,0,.2); border-radius:10px; padding:10px 12px; resize:vertical; }
  textarea:focus { outline:none; border-color:rgba(128,0,0,.5); }
  .tekst { white-space:pre-wrap; font-size:14.5px; }
  .bronnen { margin-top:10px; font-size:12.5px; color:#6d6360; }
  .bronnen b { font-family:'Poppins',sans-serif; font-weight:600; color:var(--actueel); font-size:11.5px; display:block; margin-bottom:3px; }
  .bronnen a { display:block; padding:1px 0; color:var(--brand); text-decoration:none; }

  .pager { display:flex; align-items:center; gap:10px; margin:12px 0 4px; }
  .pager .nav { font-family:'Poppins',sans-serif; font-weight:600; font-size:14px; border-radius:9px; padding:9px 14px; border:1px solid rgba(128,0,0,.2); background:#fff; color:var(--brand); cursor:pointer; min-height:44px; }
  .pager .nav:disabled { opacity:.4; cursor:default; }
  .pager .pos { font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; color:#8a7f7c; margin:0 auto; }

  .knoppen { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button.actie { font-family:'Poppins',sans-serif; font-weight:600; font-size:14px; border-radius:9px; padding:10px 16px; border:none; cursor:pointer; min-height:44px; }
  .pubbtn { background:var(--actueel); color:#fff; }
  .pubbtn:hover { filter:brightness(1.08); }
  .wegbtn { background:rgba(128,0,0,.06); color:var(--brand); border:1px solid rgba(128,0,0,.2); }
  .wegbtn:hover { background:rgba(128,0,0,.12); }
  .bewaarbtn { background:rgba(128,0,0,.06); color:var(--brand); border:1px solid rgba(128,0,0,.2); }

  .kop-balk { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .nb-link { flex:none; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; text-decoration:none; border-radius:999px; padding:8px 14px; min-height:40px; display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(47,107,58,.3); background:rgba(47,107,58,.08); color:var(--actueel); white-space:nowrap; margin-top:4px; }
  .nb-link:hover { background:rgba(47,107,58,.15); }
  .melding { padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; }
  .fout { background:rgba(128,0,0,.08); color:var(--brand); border:1px solid rgba(128,0,0,.25); }
  /* Waarschuwing binnen een conceptkaart: te smalle bronbasis of een door de
     server geweigerde publicatie. */
  .waarschuwing { margin:10px 0 0; padding:10px 12px; border-radius:10px; font-size:13.5px;
    background:rgba(176,90,0,.09); border:1px solid rgba(176,90,0,.35); color:#8a4500; }
  .waarschuwing b { font-family:'Poppins',sans-serif; font-weight:700; display:block; margin-bottom:2px; }
  .geweigerd { background:rgba(128,0,0,.08); border-color:rgba(128,0,0,.3); color:var(--brand); }
  .outlets { font-family:'Poppins',sans-serif; font-weight:600; }
  /* Markering: de synthese leverde geen bruikbare bronopgave, dus onder dit
     concept staat nog de volledige clusterlijst (mogelijk met bijvangst). */
  .terugval { font-family:'Poppins',sans-serif; font-weight:600; color:#8a4500; }
  .info { background:rgba(47,107,58,.08); color:var(--actueel); border:1px solid rgba(47,107,58,.25); }
  .leeg { color:#8a7f7c; font-size:14px; }
</style>
</head>
<body>
  <div class="kop-balk">
    <div>
      <h1>Redactie — Actueel</h1>
      <div class="sub">Concepten worden nooit vanzelf gepubliceerd en verlopen na 48 uur. Beoordeel ze één voor één; bewerk de tekst gerust vóór publicatie.</div>
    </div>
    <a id="nbLink" class="nb-link" target="_blank" rel="noopener">Nieuwsbrief ↗</a>
  </div>
  <div id="melding"></div>
  <div id="inhoud"><div class="leeg">Laden…</div></div>

<script>
(function(){
  "use strict";
  // Bestemming van de "Nieuwsbrief"-knop. Wijzig alleen deze regel als de
  // nieuwsbrief op een ander adres draait.
  var NIEUWSBRIEF_URL = "https://nlfr-nieuwsbrief.vercel.app";

  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var nbEl = document.getElementById("nbLink");
  if (nbEl){ if (NIEUWSBRIEF_URL){ nbEl.href = NIEUWSBRIEF_URL; } else { nbEl.style.display = "none"; } }
  var meldingEl = document.getElementById("melding");
  var inhoudEl = document.getElementById("inhoud");
  var state = { concepten: [], index: 0, duplicaten: 0, totaal: 0, publicaties: [], overheid: [] };

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function datum(iso){ try { return new Date(iso).toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } }
  function melding(tekst, soort){ meldingEl.innerHTML = tekst ? '<div class="melding '+(soort||"info")+'">'+esc(tekst)+'</div>' : ""; }

  function api(method, body){
    var url = "/api/review?token=" + encodeURIComponent(token);
    var opties = { method: method, headers: { "X-Review-Token": token } };
    if (body){ opties.headers["Content-Type"] = "application/json"; opties.body = JSON.stringify(body); }
    return fetch(url, opties).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, data: j }; }); });
  }

  function bronnenHtml(bronnen){
    if (!bronnen || !bronnen.length) return "";
    var perBron = {}, volgorde = [];
    bronnen.forEach(function(b){
      var naam = b.naam || b.url || "bron";
      if (!perBron[naam]){ perBron[naam] = []; volgorde.push(naam); }
      perBron[naam].push(b);
    });
    var rijen = volgorde.map(function(naam){
      var links = perBron[naam].map(function(b){
        return '<a href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(b.datum?datum(b.datum):"link")+'</a>';
      }).join(" · ");
      return '<div>'+esc(naam)+' — '+links+'</div>';
    }).join("");
    return '<div class="bronnen"><b>Bronnen</b>'+rijen+'</div>';
  }

  // Aantal ONAFHANKELIJKE outlets achter een concept (verschillende kranten én
  // verschillende koppen; wire-copy telt als één). De server rekent dit uit in
  // /api/review, ook voor oude concepten uit de opslag.
  function outletMeta(c){
    // Geen poort-uitslag meegekregen (oude serverversie)? Val terug op het
    // aantal bronlinks in plaats van een misleidend outletgetal te tonen.
    if (!c.poort) return '<b>'+(c.aantalBronnen||"?")+' bronnen</b>';
    var p = c.poort;
    if (!p.persconcept) return '<b>overheid/vereniging</b>';
    var n = (p.onafhankelijkeOutlets == null) ? "?" : p.onafhankelijkeOutlets;
    var namen = (p.outletNamen || []).join(", ");
    // Teller en namen komen van de GEFILTERDE bronnenlijst — precies wat de
    // lezer onder het artikel te zien krijgt.
    return '<b>'+n+' onafhankelijke outlet'+(n===1?"":"s")+'</b>'+(namen?' <span class="outlets">('+esc(namen)+')</span>':'')+
      (c.bronnenTerugval?' · <span class="terugval">bronnenlijst ongefilterd</span>':'');
  }

  // Waarschuwingsblok bij een te smalle bronbasis. Zo'n concept hoort door de
  // serverpoort niet meer publiceerbaar te zijn; de teller staat er sowieso.
  function outletWaarschuwing(c){
    var p = c.poort || {};
    if (!p.persconcept || p.publiceerbaar !== false) return "";
    if (p.code === "faits-divers"){
      return '<div class="waarschuwing geweigerd"><b>Publiceren geblokkeerd — faits divers</b>'+
        'Minstens één bronkop komt niet door de faits-divers-zeef (misdaad, vermissing, verdrinking). '+
        'Dit concept hoort niet op de feed.</div>';
    }
    var n = (p.onafhankelijkeOutlets == null) ? "?" : p.onafhankelijkeOutlets;
    return '<div class="waarschuwing geweigerd"><b>Publiceren geblokkeerd — één bron</b>'+
      'Dit concept steunt op '+esc(String(n))+' onafhankelijke outlet'+(n===1?"":"s")+
      ((p.outletNamen||[]).length?' ('+esc(p.outletNamen.join(", "))+')':"")+
      '. De huisregel eist er minstens twee: twee berichten van dezelfde krant — of twee kranten '+
      'die dezelfde persbureaukop overnemen — tellen samen als één bron.</div>';
  }

  function render(){
    var html = "";

    // ---- Concepten: pager (één voor één) ----
    html += '<h2>Concepten</h2>';
    html += '<div class="balk"><span class="tel">'+state.concepten.length+' concept'+(state.concepten.length===1?"":"en")+
      (state.duplicaten?' · '+state.duplicaten+' duplicaten':"")+'</span>';
    if (state.duplicaten){ html += '<button id="ontdubbel">Ontdubbelen ('+state.duplicaten+')</button>'; }
    if (state.totaal){ html += '<button id="wisAlles" class="gevaar" title="Leegt alleen de wachtrij met persconcepten. Gepubliceerde artikelen en de overheidsberichten blijven staan.">Wachtrij persconcepten wissen</button>'; }
    html += '</div>';

    if (!state.concepten.length){
      html += '<div class="leeg">Geen concepten om te beoordelen. Nieuwe verschijnen zodra een verhaal door 2+ onafhankelijke bronnen wordt gemeld.</div>';
    } else {
      if (state.index >= state.concepten.length) state.index = state.concepten.length - 1;
      if (state.index < 0) state.index = 0;
      var c = state.concepten[state.index];
      html += '<div class="pager">'+
        '<button class="nav" id="vorige"'+(state.index<=0?" disabled":"")+'>‹ Vorige</button>'+
        '<span class="pos">'+(state.index+1)+' / '+state.concepten.length+'</span>'+
        '<button class="nav" id="volgende"'+(state.index>=state.concepten.length-1?" disabled":"")+'>Volgende ›</button>'+
      '</div>';
      html += '<div class="kaart" data-id="'+esc(c.id)+'">'+
        '<div class="meta">'+outletMeta(c)+' · '+(c.aantalBronnen||"?")+' bronlink'+((c.aantalBronnen===1)?"":"s")+
          ' · gemaakt '+esc(datum(c.aangemaaktOp))+' · model '+esc(c.model||"?")+(c.afgekapt?' · <span style="color:#b58b00">mogelijk afgekapt</span>':'')+'</div>'+
        (c.kop?'<div class="kop">'+esc(c.kop)+'</div>':'')+
        '<textarea>'+esc(c.tekst)+'</textarea>'+
        bronnenHtml(c.bronnen)+
        outletWaarschuwing(c)+
        '<div class="poortmelding"></div>'+
        '<div class="knoppen">'+
          '<button class="actie pubbtn" data-act="publiceer">Publiceer</button>'+
          '<button class="actie bewaarbtn" data-act="bewerk">Bewaar tekst</button>'+
          '<button class="actie wegbtn" data-act="weg">Weg</button>'+
        '</div></div>';
    }

    // ---- Gepubliceerd (pers) ----
    html += '<h2>Gepubliceerd — pers ('+(state.publicaties||[]).length+')</h2>';
    if (!(state.publicaties||[]).length){ html += '<div class="leeg">Nog niets gepubliceerd.</div>'; }
    (state.publicaties||[]).forEach(function(p){
      html += '<div class="kaart pub" data-id="'+esc(p.id)+'">'+
        '<div class="meta">gepubliceerd '+esc(datum(p.gepubliceerdOp))+(p.gearchiveerd?' · <b>in archief</b>':'')+'</div>'+
        (p.kop?'<div class="kop">'+esc(p.kop)+'</div>':'')+
        '<div class="tekst">'+esc(p.tekst)+'</div>'+
        bronnenHtml(p.bronnen)+
        '<div class="knoppen">'+
          (p.gearchiveerd?'':'<button class="actie bewaarbtn" data-act="archiveer">Toevoegen aan archief</button>')+
          '<button class="actie wegbtn" data-act="depubliceer">Van de site halen</button>'+
        '</div>'+
      '</div>';
    });

    // ---- Overheid (kill-switch) ----
    html += '<h2>Overheid — automatisch live ('+(state.overheid||[]).length+')</h2>';
    if (!(state.overheid||[]).length){ html += '<div class="leeg">Nog geen NL-overheidsberichten.</div>'; }
    (state.overheid||[]).forEach(function(o){
      html += '<div class="kaart" data-id="'+esc(o.id)+'">'+
        '<div class="meta"><b>'+esc(o.bron||"")+'</b> · '+esc(o.thema||"")+' · '+esc(datum(o.gepubliceerdOp))+'</div>'+
        (o.kop?'<div class="kop">'+esc(o.kop)+'</div>':'')+
        '<div class="tekst">'+esc(o.samenvatting)+'</div>'+
        (o.url?'<div class="bronnen"><a href="'+esc(o.url)+'" target="_blank" rel="noopener">Bron →</a></div>':'')+
        '<div class="knoppen"><button class="actie wegbtn" data-act="verwijder-overheid">Van de site halen</button></div>'+
      '</div>';
    });

    inhoudEl.innerHTML = html;
    koppel();
  }

  function koppel(){
    var vorige = document.getElementById("vorige");
    var volgende = document.getElementById("volgende");
    if (vorige) vorige.addEventListener("click", function(){ state.index--; render(); });
    if (volgende) volgende.addEventListener("click", function(){ state.index++; render(); });

    var ontdubbelBtn = document.getElementById("ontdubbel");
    if (ontdubbelBtn) ontdubbelBtn.addEventListener("click", function(){
      ontdubbelBtn.disabled = true; ontdubbelBtn.textContent = "…";
      api("POST", { actie: "ontdubbel" }).then(function(res){
        if (res.ok && res.data.ok){ melding("Duplicaten verwijderd: "+res.data.verwijderd+". Over: "+res.data.over+".", "info"); laad(); }
        else { melding((res.data&&res.data.fout)||"Mislukt.", "fout"); ontdubbelBtn.disabled=false; }
      });
    });
    var wisAllesBtn = document.getElementById("wisAlles");
    if (wisAllesBtn) wisAllesBtn.addEventListener("click", function(){
      if (!window.confirm("De wachtrij met "+state.totaal+" persconcepten wissen?\n\nAlleen nog niet gepubliceerde persconcepten verdwijnen. Gepubliceerde artikelen, de overheidsberichten (live én archief) en de verenigingsitems blijven ongewijzigd.")) return;
      wisAllesBtn.disabled = true; wisAllesBtn.textContent = "…";
      api("POST", { actie: "wis-alles" }).then(function(res){
        if (res.ok && res.data.ok){
          melding("Persconcepten gewist ("+res.data.verwijderd+")."+(res.data.overgeslagen?" Overgeslagen (geen persconcept): "+res.data.overgeslagen+".":""), "info");
          laad();
        }
        else { melding((res.data&&res.data.fout)||"Mislukt.", "fout"); wisAllesBtn.disabled=false; }
      });
    });

    inhoudEl.querySelectorAll("button[data-act]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var kaart = btn.closest(".kaart");
        var id = kaart.getAttribute("data-id");
        var act = btn.getAttribute("data-act");
        var ta = kaart.querySelector("textarea");
        var body = { actie: act, id: id };
        if (ta && (act === "publiceer" || act === "bewerk")) body.tekst = ta.value;
        var oudLabel = btn.textContent;
        btn.disabled = true; btn.textContent = "…";
        api("POST", body).then(function(res){
          if (res.ok && res.data.ok){
            melding(act==="publiceer"?"Gepubliceerd.":act==="weg"?"Verwijderd.":act==="depubliceer"?"Van de site gehaald.":act==="verwijder-overheid"?"Van de site gehaald.":act==="archiveer"?"Naar archief verplaatst.":"Bewaard.", "info");
            if (act === "publiceer" || act === "weg"){
              state.concepten = state.concepten.filter(function(x){ return x.id !== id; });
              state.totaal = Math.max(0, state.totaal - 1);
              if (act === "publiceer"){ laad(); } else { render(); }
            } else if (act === "bewerk"){
              btn.disabled = false; btn.textContent = "Bewaar tekst";
            } else {
              laad();
            }
          } else {
            var reden = (res.data && res.data.fout) || "Er ging iets mis.";
            melding(reden, "fout");
            // Weigering door de publicatiepoort: de reden ook bij het concept
            // zelf tonen, zodat hij niet wegvalt bij het scrollen.
            var vak = kaart.querySelector(".poortmelding");
            if (vak){
              vak.innerHTML = (res.data && res.data.geweigerd)
                ? '<div class="waarschuwing geweigerd"><b>Publicatie geweigerd door de server</b>'+esc(reden)+'</div>'
                : "";
            }
            btn.disabled = false;
            btn.textContent = oudLabel;
          }
        }).catch(function(){ melding("Netwerkfout.", "fout"); btn.disabled = false; btn.textContent = oudLabel; });
      });
    });
  }

  function laad(){
    if (!token){ melding("Geen token in de URL. Voeg ?token=… toe.", "fout"); inhoudEl.innerHTML = ""; return; }
    api("GET").then(function(res){
      if (res.ok && res.data.ok){
        melding("");
        state.concepten = res.data.concepten || [];
        state.duplicaten = res.data.duplicatenAantal || 0;
        state.totaal = res.data.totaalConcepten || state.concepten.length;
        state.publicaties = res.data.publicaties || [];
        state.overheid = res.data.overheid || [];
        if (state.index >= state.concepten.length) state.index = 0;
        render();
      } else { melding((res.data && res.data.fout) || "Toegang geweigerd.", "fout"); inhoudEl.innerHTML = ""; }
    }).catch(function(){ melding("Netwerkfout.", "fout"); });
  }

  laad();
})();
</script>
</body>
</html>
