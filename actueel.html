<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Actueel — Frankrijknieuws</title>
<!--
  NLFR ACTUEEL — Nederlandstalige nieuwspagina, embed via iframe op
  https://www.nederlanders.fr/page/actueel-frankrijknieuws (zie EMBED.md).
  Visueel herontwerp naar de Cdesign-handoff: 4 categorie-tabs (Nieuws /
  Overheid / NL'ers in FR / Archief) filteren de tegels; per tegel 4-niveau
  drill-down (tegel -> artikel -> NL-tekst -> Bronnen). Icoontegels (inline SVG),
  getinte koppen, warme schaduw. Vaste-hoogte paneel met interne scroll; hoogte
  via postMessage. Nooit scrollIntoView(): dat scrollt ook de voorouders en dus
  de moederpagina. Scrollen gebeurt uitsluitend met scrollerEl.scrollTo(), wat
  gegarandeerd binnen de eigen scrollcontainer blijft.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf9f8; --kaart:#fff; --kaart-archief:#fdfdfc;
    --ink:#241c1c; --ink-body:#3d3735; --ink-body2:#4d4441; --ink-meta:#6f6663; --ink-zwak:#8a7d79;
    --hair:#f0e8e5; --hair2:#ece4e1; --hair3:#e6dcd9;
    --brand:#800000; --brand-dark:#5f0000;
    --groen:#2f6b3a;
    --sh-rust:0 1px 2px rgba(38,17,17,.05);
    --sh-hover:0 2px 4px rgba(38,17,17,.06), 0 8px 18px -8px rgba(38,17,17,.16);
    --disp:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --body:'Mulish',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  /* Categorie-tokens (op tegel én tab gezet). NL'ers deelt het groen. */
  .cat-nieuws,.cat-nlers{ --c-main:#2f6b3a; --c-dark:#22522c; --c-tint:#eef4ef; --c-rand:#d5e4d9; --c-meta:#4b5c4f; --c-chip:#f6faf7; }
  .cat-overheid{ --c-main:#800000; --c-dark:#5f0000; --c-tint:#fbf0ee; --c-rand:#ecd9d5; --c-meta:#6b4a46; --c-chip:#fdf6f5; }
  .cat-archief{ --c-main:#5c5f5c; --c-dark:#4a4d4a; --c-tint:#f3f2f0; --c-rand:#e2e0dc; --c-meta:#6f6663; --c-chip:#f8f8f6; }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; background:transparent; -webkit-text-size-adjust:100%; }
  body{ font-family:var(--body); color:var(--ink-body); }
  .ic{ width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

  /* ---- Paneelraamwerk ---- */
  .panel{ height:100%; min-height:420px; display:grid; grid-template-rows:auto auto 1fr auto; background:var(--bg);
          border:1px solid var(--hair2); border-radius:14px; overflow:hidden; }

  /* Knoppenbalk */
  .bar{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 12px; background:#fff; border-bottom:1px solid var(--hair); }
  .bar .knop{ display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 14px; border:1px solid var(--c-rand,#ecd9d5); border-radius:8px; background:#fff; font-family:var(--disp); font-weight:600; font-size:13px; color:var(--brand-dark); cursor:pointer; }
  @media (hover:hover) and (pointer:fine){ .bar .knop:hover{ background:#fbf0ee; border-color:#e0c3bd; } }
  .bar .knop:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .bar .bijwerk{ display:inline-flex; align-items:center; gap:6px; font-family:var(--body); font-weight:500; font-size:12.5px; color:var(--ink-meta); white-space:nowrap; }
  .bar .bijwerk .ic{ width:14px; height:14px; }
  /* Bescheiden doorverwijzing naar het duurzame regelgevingsarchief. */
  .bar .barrechts{ display:inline-flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
  .bar .reglink{ font-family:var(--disp); font-weight:600; font-size:12.5px; color:var(--brand-dark); text-decoration:none;
                 border-bottom:1px solid rgba(128,0,0,.25); white-space:nowrap; }
  @media (hover:hover) and (pointer:fine){ .bar .reglink:hover{ color:var(--brand); border-bottom-color:var(--brand); } }

  /* Tabbalk */
  .tabs{ display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--bg); border-bottom:1px solid var(--hair); overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; scroll-padding-inline:12px; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabgroep{ display:inline-flex; gap:4px; flex:none; background:#fff; border:1px solid var(--hair2); border-radius:999px; padding:4px; }
  .tabgroep.archiefgroep{ border-color:var(--hair3); }
  .tabsplit{ flex:none; width:1px; height:24px; background:var(--hair3); }
  .tab{ display:inline-flex; align-items:center; gap:6px; flex:none; min-height:40px; padding:0 14px; border:0; border-radius:999px; background:transparent; cursor:pointer; white-space:nowrap;
        font-family:var(--disp); font-weight:500; font-size:13px; color:var(--ink-body2); scroll-snap-align:center;
        transition:background 180ms cubic-bezier(.2,.6,.3,1), color 180ms; }
  .tab .ic{ width:15px; height:15px; color:var(--c-main); }
  .tab[aria-selected="true"]{ background:var(--c-main); color:#fff; font-weight:600; box-shadow:0 1px 2px rgba(38,17,17,.14); }
  .tab[aria-selected="true"] .ic{ color:#fff; }
  .tab:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  @media (min-width:600px){ .tab{ min-height:36px; } }

  /* Scroller (enige scrollcontainer) + de vervaag-rand eronder.
     De wrap vult de 1fr-rij van het paneel; min-height:0 houdt de scroller
     binnen die rij in plaats van hem te laten uitdijen. */
  .scrollwrap{ position:relative; min-height:0; display:grid; }
  .scroller{ overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:10px; padding:12px; animation:paneelin 120ms ease; }
  .scroller > *{ flex:none; }
  @media (min-width:600px){ .scroller{ padding:20px; gap:12px; } }
  @keyframes paneelin{ from{opacity:0;} to{opacity:1;} }

  /* "Hier zit meer"-signaal: vaste vervaag-rand onderaan het scrollpaneel.
     Alleen zichtbaar zolang er inhoud onder de vouw zit (klasse .aan, gezet
     door werkVervaagBij()); vervaagt zodra het einde in beeld komt. Vangt geen
     klikken (pointer-events:none), zodat de knoppen eronder bereikbaar blijven.
     De doorzichtige stop is bewust rgba(...,0) en niet `transparent`: sommige
     browsers interpoleren `transparent` via zwart en geven dan een grijze waas. */
  .vervaag{ position:absolute; left:1px; right:1px; bottom:0; height:44px; pointer-events:none; z-index:1;
            background:linear-gradient(to bottom, rgba(253,249,248,0) 0%, rgba(253,249,248,.72) 55%, var(--bg) 100%);
            opacity:0; transition:opacity 220ms cubic-bezier(.2,.6,.3,1); }
  .vervaag.aan{ opacity:1; }

  /* ---- Tegel (niveau 1) ---- */
  .tegel{ background:var(--kaart); border:1px solid var(--c-rand); border-radius:12px; overflow:hidden; box-shadow:var(--sh-rust); transition:box-shadow 180ms cubic-bezier(.2,.6,.3,1); }
  .tegel.cat-archief{ background:var(--kaart-archief); }
  @media (hover:hover) and (pointer:fine){ .tegel:hover{ box-shadow:var(--sh-hover); } }
  .kop{ display:flex; align-items:flex-start; gap:12px; width:100%; min-height:56px; padding:14px 16px; background:var(--c-tint); border:0; text-align:left; cursor:pointer; font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  .tegel.open .kop{ border-bottom:1px solid var(--c-rand); }
  .kop:focus-visible{ outline:2px solid var(--brand); outline-offset:-2px; }
  .icotegel{ flex:none; width:32px; height:32px; border-radius:8px; background:#fff; border:1px solid var(--c-rand); display:grid; place-items:center; color:var(--c-main); }
  .icotegel .ic{ width:18px; height:18px; }
  .koptekst{ flex:1; min-width:0; display:grid; gap:2px; }
  .catlabel{ display:flex; align-items:center; gap:8px; font-family:var(--body); font-weight:600; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--c-dark); }
  .kop h3{ margin:0; font-family:var(--disp); font-weight:600; font-size:15px; line-height:21px; color:var(--ink); }
  .kopmeta{ font-family:var(--body); font-weight:500; font-size:12.5px; line-height:17px; color:var(--c-meta); }
  .chevbox{ flex:none; width:32px; height:32px; display:grid; place-items:center; color:var(--c-meta); }
  .chevbox .ic{ width:18px; height:18px; transition:transform 180ms cubic-bezier(.2,.6,.3,1); }
  [aria-expanded="true"] .chevbox .ic{ transform:rotate(90deg); }

  /* Hot-markering */
  .hot{ display:inline-flex; align-items:center; gap:5px; font-family:var(--body); font-weight:600; font-size:11px; color:var(--brand); }
  .hotdot{ width:7px; height:7px; border-radius:999px; background:var(--brand); animation:hotpuls 2.4s ease-out infinite; }
  @keyframes hotpuls{ 0%{box-shadow:0 0 0 0 rgba(128,0,0,.30);} 70%{box-shadow:0 0 0 7px rgba(128,0,0,0);} 100%{box-shadow:0 0 0 0 rgba(128,0,0,0);} }

  /* Body van de tegel */
  .body{ display:none; padding:14px 16px; }
  .tegel.open > .body{ display:grid; gap:12px; }
  ul.bullets{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  ul.bullets li{ position:relative; padding-left:18px; font-size:15px; line-height:24px; color:var(--ink-body2); }
  ul.bullets li::before{ content:""; position:absolute; left:2px; top:9px; width:6px; height:6px; border-radius:2px; background:var(--c-main); opacity:.6; }
  .archief-intro{ font-size:13px; line-height:20px; color:var(--ink-meta); }
  .archief-intro a{ color:var(--brand); font-weight:600; text-decoration:none; border-bottom:1px solid rgba(128,0,0,.3); }
  .archief-intro a:hover{ border-bottom-color:var(--brand); }
  .platblok{ font-size:15px; line-height:24px; color:var(--ink-body2); display:grid; gap:8px; }
  .platlink a, .agendalink a{ font-family:var(--disp); font-weight:600; font-size:13px; color:var(--c-main); text-decoration:none; }
  .platlink a:hover, .agendalink a:hover{ text-decoration:underline; }
  .agrij{ display:flex; gap:12px; padding:6px 0; border-bottom:1px solid var(--hair); }
  .agrij:last-child{ border-bottom:none; }
  .agrij .dat{ flex:0 0 108px; font-family:var(--disp); font-weight:600; font-size:12px; color:var(--c-main); }
  .agrij .wat{ font-size:13.5px; }
  .agrij .wat .sub{ color:var(--ink-zwak); font-size:11.5px; }

  /* ---- Artikel (niveau 2) ---- */
  .artikelen{ display:grid; gap:10px; }
  .artikel{ border:1px solid var(--hair2); border-radius:8px; background:#fff; overflow:hidden; }
  .artkop{ display:flex; gap:10px; align-items:flex-start; width:100%; min-height:56px; padding:12px 14px; background:none; border:0; text-align:left; cursor:pointer; font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; }
  .artkop:focus-visible{ outline:2px solid var(--brand); outline-offset:-2px; }
  .artkop .tk{ flex:1; min-width:0; display:grid; gap:3px; }
  .artkop .att{ font-family:var(--disp); font-weight:600; font-size:14.5px; line-height:20px; color:var(--ink); }
  .artkop .asum{ font-size:15px; line-height:24px; color:var(--ink-body2); }
  .artkop .ameta{ font-family:var(--body); font-weight:500; font-size:12.5px; color:var(--ink-meta); }
  .artkop .rest{ font-weight:600; color:var(--ink-zwak); }
  .artkop .chevbox{ margin-top:-4px; }
  .artkop .chevbox .ic{ color:var(--ink-zwak); }

  /* ---- Niveau 3: volledige NL-tekst ---- */
  .uitleg{ display:none; padding:0 14px 14px; }
  .artikel.open .uitleg{ display:block; }
  .artikel.open .asum{ display:none; } /* teaser is voor de dichte staat; open toont de volledige tekst — geen dubbeling */
  .uitleg .tekst{ border-left:1px solid var(--hair); padding-left:12px; display:grid; gap:10px; }
  .redlabel{ font-family:var(--body); font-weight:600; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--groen); }
  .uitleg p{ margin:0; font-size:16px; line-height:26px; color:var(--ink-body); max-width:68ch; text-wrap:pretty; }
  /* Laadstaat van de tweede levering (tekst + bronnen). Zichtbaar zolang die
     nog onderweg is, of als hij mislukte; de summary staat er dan al. */
  .uitleg p.tekstlaad{ font-size:13px; line-height:20px; color:var(--ink-zwak); font-style:italic; }

  /* ---- Niveau 4: bronnen ---- */
  .bronknop{ display:inline-flex; align-items:center; gap:6px; margin-top:10px; min-height:36px; padding:0 10px; border-radius:4px; border:1px solid var(--c-rand); background:var(--c-chip); color:var(--c-main); font-family:var(--body); font-weight:600; font-size:12.5px; cursor:pointer; }
  .bronknop .ic{ width:13px; height:13px; }
  .bronknop:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .bronknop.leeg{ color:var(--ink-zwak); background:#fff; cursor:default; }
  .bronlijst{ display:none; list-style:none; margin:10px 0 0; padding:0; }
  .artikel .bronwrap.open .bronlijst{ display:grid; gap:6px; }
  .bronlijst li{ display:grid; gap:2px; background:var(--bg); border:1px solid var(--hair); border-radius:4px; padding:8px 10px; }
  .bronlijst a{ font-family:var(--body); font-weight:600; font-size:13px; line-height:18px; color:var(--ink-body); text-decoration:none; }
  .bronlijst a:hover{ text-decoration:underline; }
  .bronlijst .uitg{ font-family:var(--body); font-weight:500; font-size:12px; color:var(--ink-meta); }
  /* Bron zonder bruikbare URL: zelfde plek in de lijst, maar duidelijk geen link. */
  .bronlijst .bronzonderlink{ font-family:var(--body); font-weight:600; font-size:13px; line-height:18px; color:var(--ink-meta); }

  /* Redactionele verwijzing naar Infofrankrijk. BEWUST GESCHEIDEN VAN DE
     BRONNEN: de bronnenlijst is attributie (de Franse originelen waar de
     synthese op steunt), dit is "verder lezen" op onze eigen site. Door
     elkaar zetten zou de lezer misleiden en de attributie vertroebelen. */
  .verwijs{ margin-top:12px; padding:10px 12px; border-radius:4px; border:1px solid var(--hair); border-left:3px solid var(--groen); background:var(--bg); }
  .verwijs b{ display:block; font-family:var(--disp); font-weight:600; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--groen); margin-bottom:5px; }
  .verwijs ul{ list-style:none; margin:0; padding:0; display:grid; gap:4px; }
  /* Elke verwijzing is een blokje met eigen hoogte, niet een kale tekstregel:
     op een telefoon moet je hem kunnen raken zonder te mikken (gemeten op
     390px breed was de kale regel 15px hoog). */
  .verwijs a{ display:block; padding:12px 0; min-height:20px; font-family:var(--body); font-weight:600; font-size:13px; line-height:20px; color:var(--ink-body); text-decoration:none; }
  .verwijs a:hover{ text-decoration:underline; }
  /* Pijltje als aanwijzing dat je de site verlaat — dezelfde vorm als de link
     "Regelgevingsarchief →" bovenaan. In CSS, niet in de tekst, zodat de
     linktitel zelf onaangeroerd blijft. */
  .verwijs a::after{ content:" \2192"; color:var(--groen); }

  /* Sluitknop onder de tegel */
  .sluitrij{ padding:2px 16px 14px; }
  .sluit{ display:inline-flex; align-items:center; gap:6px; background:none; border:0; cursor:pointer; font-family:var(--disp); font-weight:600; font-size:11.5px; color:var(--ink-zwak); padding:6px 2px; }
  .sluit:hover{ color:var(--c-main); }
  .sluit .ic{ width:14px; height:14px; }

  /* ---- Lege staat ---- */
  .leeg{ border:1px dashed var(--hair3); border-radius:12px; background:var(--bg); padding:28px 20px; display:grid; justify-items:center; gap:8px; text-align:center; }
  .leeg .rond{ width:40px; height:40px; border-radius:999px; background:#fff; border:1px solid var(--hair2); display:grid; place-items:center; color:var(--ink-zwak); }
  .leeg .rond .ic{ width:20px; height:20px; }
  .leeg h3{ margin:0; font-family:var(--disp); font-weight:600; font-size:15px; color:var(--ink-body); }
  .leeg p{ margin:0; font-size:14px; line-height:22px; color:var(--ink-meta); max-width:34ch; }
  .leeg .gecheckt{ font-family:var(--body); font-weight:500; font-size:12.5px; color:var(--ink-zwak); }

  /* ---- Skeleton ---- */
  .skelkaart{ background:#fff; border:1px solid var(--hair2); border-radius:12px; padding:16px; display:grid; gap:10px; }
  .skel{ height:12px; border-radius:4px; background:#f7f1ef; }
  .skel.k{ height:14px; width:60%; background:#f3ece9; }
  .skel.m{ width:92%; } .skel.s{ width:78%; }

  /* ---- Bron-statusbalk ---- */
  .status{ background:var(--bg); border-top:1px solid var(--hair); padding:10px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; font-family:var(--body); font-weight:500; font-size:12.5px; color:var(--ink-meta); }
  .status .b{ display:inline-flex; align-items:center; gap:6px; }
  .status .sd{ width:6px; height:6px; border-radius:999px; flex:none; }
  .status .ok .sd{ background:var(--groen); } .status .nok .sd{ background:var(--brand); }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
    .hotdot{ animation:none; box-shadow:0 0 0 3px rgba(128,0,0,.12); }
  }
</style>
</head>

  <symbol id="ic-bronnen" viewBox="0 0 24 24"><path d="M10.2 13.6a3.6 3.6 0 0 0 5.1 0l2.8-2.8a3.6 3.6 0 0 0-5.1-5.1l-1 1"></path><path d="M13.8 10.4a3.6 3.6 0 0 0-5.1 0l-2.8 2.8a3.6 3.6 0 0 0 5.1 5.1l1-1"></path></symbol>
  <symbol id="ic-klok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"></circle><path d="M12 7.4V12l3.2 2.1"></path></symbol>
  <symbol id="ic-uitklap" viewBox="0 0 24 24"><path d="M7 10l5-5 5 5M7 14l5 5 5-5"></path></symbol>
  <symbol id="ic-inklap" viewBox="0 0 24 24"><path d="M7 5l5 5 5-5M7 19l5-5 5 5"></path></symbol>
  <symbol id="ic-natuur" viewBox="0 0 24 24"><path d="M12 20.5V11"></path><path d="M12 13.5c-3.4 0-6.2-2.6-6.2-6 2.1-.6 4-.3 5.4.8 1 .8 1.6 1.9 1.9 3.1"></path><path d="M12.6 11.4c.3-1.2.9-2.3 1.9-3.1 1.4-1.1 3.3-1.4 5.4-.8 0 3.4-2.8 6-6.2 6"></path></symbol>
  <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></symbol>
  <symbol id="ic-leeg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"></circle><path d="M8.4 13.8h7.2"></path></symbol>
</svg>

<div class="panel">
  <div class="bar">
    <button type="button" class="knop" id="allesBtn"><svg class="ic" aria-hidden="true"><use href="#ic-uitklap"/></svg><span id="allesLabel">Alles uitklappen</span></button>
    <span class="barrechts">
      <a class="reglink" href="/archief" target="_top">Regelgevingsarchief →</a>
      <span class="bijwerk"><svg class="ic" aria-hidden="true"><use href="#ic-klok"/></svg><span id="bijwerk">wordt geladen…</span></span>
    </span>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Categorieën"></div>
  <div class="scrollwrap">
    <div class="scroller" id="scroller"></div>
    <div class="vervaag" id="vervaag" aria-hidden="true"></div>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
(function(){
  "use strict";
  var VERENIGINGEN_PAGINA = "https://www.nederlanders.fr/page/nederlandse-verenigingen-in-frankrijk";
  // Kop boven het blok met redactionele verwijzingen naar Infofrankrijk.
  // Dezelfde tekst als IF_VERWIJZING_KOP in lib/config.js; test/verwijzing.test.mjs
  // houdt de twee gelijk, zodat ze niet stilletjes uiteen kunnen lopen.
  var VERWIJS_KOP = "Meer hierover op Infofrankrijk";
  var scrollerEl = document.getElementById("scroller");
  var vervaagEl = document.getElementById("vervaag");
  var tabsEl = document.getElementById("tabs");
  var statusEl = document.getElementById("status");
  var bijwerkEl = document.getElementById("bijwerk");
  var allesBtn = document.getElementById("allesBtn");
  var allesLabel = document.getElementById("allesLabel");

  // Categorieën (vaste volgorde) + iconen + labels.
  var CATS = [
    { key:"nieuws",   label:"Nieuws",       ic:"ic-nieuws" },
    { key:"overheid", label:"Overheid",     ic:"ic-overheid" },
    { key:"nlers",    label:"NL'ers in FR", ic:"ic-nlers" },
    { key:"archief",  label:"Archief",      ic:"ic-archief" }
  ];
  var THEMA_IC = {
    "geld-belasting":"ic-geld", economie:"ic-geld", ondernemen:"ic-geld", douane:"ic-overheid", praktisch:"ic-praktisch",
    "sociale-zekerheid":"ic-praktisch", wetgeving:"ic-overheid", "natuur-milieu":"ic-natuur",
    verkeer:"ic-verkeer", verenigingen:"ic-verenigingen", agenda:"ic-agenda", schoolvakanties:"ic-vakanties",
    infofrankrijk:"ic-nlers", bosbranden:"ic-nieuws", landelijk:"ic-nieuws", regionaal:"ic-nieuws",
    "nl-nieuws":"ic-nlers", "nl-overheid":"ic-overheid",
    vastgoed:"ic-geld", ambassade:"ic-nlers"
  };

  var laatste = null;         // laatste data (tegels per cat)
  var actief = "nieuws";      // actieve tab
  var open = load("nlfr_open", {});   // { tegelId: true }
  var artOpen = load("nlfr_art", {});  // { tegelId/artId: true }
  var bronOpen = {};                   // niveau 4, niet bewaard
  actief = load("nlfr_tab", "nieuws");

  function load(k, def){ try{ var v=sessionStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
  function save(k, v){ try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function ico(id, cls){ return '<svg class="ic'+(cls?" "+cls:"")+'" aria-hidden="true"><use href="#'+id+'"/></svg>'; }
  function tijd(iso){ try{ var d=new Date(iso); return d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
  function datum(iso){ try{ var d=new Date(iso); return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})+" "+tijd(iso); }catch(e){ return ""; } }
  function agendaDag(iso){ try{ return new Date(iso+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"long"}); }catch(e){ return iso; } }
  function meerv(n){ return n+" "+(n===1?"artikel":"artikelen"); }

  function catVan(soort){
    if(soort==="pers") return "nieuws";
    if(soort==="overheid") return "overheid";
    if(soort==="archief") return "archief";
    return "nlers";
  }
  function themaIco(t){ return THEMA_IC[t] || (CATS.filter(function(c){return c.key===catVan(t.soort);})[0]||{}).ic || "ic-nieuws"; }

  // Bouw per-categorie lijst van "tegels" (incl. agenda/schoolvakanties als platte tegels).
  function bouwCats(data, vak){
    var perCat = { nieuws:[], overheid:[], nlers:[], archief:[] };
    (data.tegels||[]).forEach(function(t){ perCat[catVan(t.soort)].push(t); });
    if (data.agenda && data.agenda.length){
      perCat.nlers.push({ soort:"agenda", id:"agenda", thema:"agenda", label:"Agenda — komende twee weken",
        meta:data.agenda.length+" activiteiten", plat:agendaBody(data.agenda) });
    }
    if (vak && vak.zin){
      perCat.nlers.push({ soort:"schoolvakanties", id:"schoolvakanties", thema:"schoolvakanties", label:"Schoolvakanties",
        meta:"", plat:vakBody(vak) });
    }
    // Vaste link-tegel: Nederlandse ambassade + reisadvies (Buitenlandse Zaken).
    // Social kanalen hebben geen feed; hier alleen als doorklik-links.
    perCat.nlers.push({ soort:"links", id:"ambassade", thema:"ambassade", label:"Nederlandse ambassade & reisadvies",
      meta:"", plat:ambassadeBody() });
    // Vaste link-tegel: officiële/handige links voor vastgoed en notariszaken.
    // Bewust ALLEEN links (geen overgenomen tekst): notaires.fr is redactionele
    // content en geen Licence Ouverte, dus we linken door i.p.v. te kopiëren.
    perCat.nlers.push({ soort:"links", id:"vastgoed-notaris", thema:"vastgoed", label:"Vastgoed & notaris",
      meta:"", plat:linksBody() });
    return perCat;
  }

  function ambassadeBody(){
    var links = [
      ["Reisadvies Frankrijk (Buitenlandse Zaken)", "https://www.nederlandwereldwijd.nl/reisadvies/frankrijk"],
      ["Nederlandse ambassade Parijs — contact &amp; info", "https://www.nederlandwereldwijd.nl/contact/ambassades-consulaten-generaal/frankrijk/ambassade-parijs"],
      ["Facebook — consulaire &amp; algemene info", "https://www.facebook.com/AmbassadePaysBasFrance"],
      ["LinkedIn — Embassy of the Netherlands in France", "https://www.linkedin.com/company/ambassadeparijs"],
      ["Instagram — cultuur (@culturepaysbas)", "https://www.instagram.com/culturepaysbas"]
    ];
    var rijen = links.map(function(l){
      return '<div class="platlink"><a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+l[0]+' →</a></div>';
    }).join("");
    return '<div class="platblok"><div>De Nederlandse ambassade in Frankrijk en het officiële reisadvies. Links openen in een nieuw tabblad.</div>'+rijen+'</div>';
  }

  function linksBody(){
    var links = [
      ["Vastgoedprijzen — kaart van verkoopprijzen (DVF, etalab.gouv.fr)", "https://app.dvf.etalab.gouv.fr"],
      ["Vastgoed kopen &amp; verkopen (Notaires de France)", "https://immobilier.notaires.fr"],
      ["Notaris-actualiteiten: erfrecht, schenking &amp; vastgoed", "https://www.notaires.fr/fr/actualites"]
    ];
    var rijen = links.map(function(l){
      return '<div class="platlink"><a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+l[0]+' →</a></div>';
    }).join("");
    return '<div class="platblok"><div>Handige officiële links voor vastgoed en notariszaken in Frankrijk. Je opent ze in een nieuw tabblad.</div>'+rijen+'</div>';
  }

  function agendaBody(agenda){
    var rijen = agenda.map(function(a){
      var det=[a.tijd,a.plaats].filter(Boolean).join(" · ");
      return '<div class="agrij"><span class="dat">'+esc(agendaDag(a.datum))+'</span><span class="wat">'+esc(a.titel)+
        '<span class="sub">'+(a.vereniging?" · "+esc(a.vereniging):"")+(det?" · "+esc(det):"")+'</span></span></div>';
    }).join("");
    return '<div class="platblok">'+rijen+'<div class="agendalink"><a href="'+VERENIGINGEN_PAGINA+'" target="_top" rel="noopener">Alle Nederlandse verenigingen in Frankrijk →</a></div></div>';
  }
  function vakBody(v){
    return '<div class="platblok"><div>'+esc(v.zin)+'</div><div class="platlink"><a href="'+esc(v.servicePublic)+'" target="_blank" rel="noopener">Officiële kalender &amp; regels (service-public.gouv.fr) →</a></div></div>';
  }

  function bronHTML(b){
    var t=b.titel||b.naam||"bron";
    var uitg = b.naam?'<span class="uitg">'+esc(b.naam)+(b.datum?" · "+esc(datum(b.datum)):"")+'</span>':'';
    // Geen bruikbare bron-URL (de server heeft hem geweigerd, zie
    // lib/bronurl.js) -> de bron blijft staan als attributie, maar zonder link.
    // Een <a href="null"> zou de lezer naar een kapotte of vreemde pagina
    // sturen; dat is precies de storing die dit voorkomt.
    if(!b.url) return '<li><span class="bronzonderlink">'+esc(t)+'</span>'+uitg+'</li>';
    return '<li><a href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(t)+'</a>'+uitg+'</li>';
  }

  // De tekst en de volledige bronnenlijst van één artikel. Die komen uit de
  // TWEEDE levering (/api/actueel-tekst), die op de achtergrond binnenkomt.
  // Terugval op het artikel zelf: levert de server toch de volledige vorm (een
  // ouder antwoord dat nog in de browsercache zit), dan werkt de pagina daar
  // gewoon mee door.
  function tekstVoor(aid, a){
    if (teksten && teksten[aid]) return teksten[aid];
    if (a && (a.tekst != null || a.bronnen)) return { tekst:a.tekst||"", bronnen:a.bronnen||[] };
    return null;
  }
  // Hoeveel bronnen heeft dit artikel? Uit de compacte levering (bronAantal),
  // of uit de volledige vorm als die er is.
  function bronAantalVan(a, extra){
    if (extra) return (extra.bronnen||[]).length;
    if (typeof a.bronAantal === "number") return a.bronAantal;
    return (a.bronnen||[]).length;
  }

  function artikelHTML(cat, t, a){
    var aid = t.id+"/"+a.id, isOpen = !!artOpen[aid];
    var extra = tekstVoor(aid, a);
    var aantal = bronAantalVan(a, extra);
    var paras = extra
      ? String(extra.tekst||"").split(/\n\n+/).filter(Boolean).map(function(p){ return "<p>"+esc(p)+"</p>"; }).join("")
      : "";
    if(!paras) paras="<p>"+esc(a.summary||"")+"</p>";
    // Nog niet binnen: de summary staat er al, met een korte laadstaat eronder.
    // Mislukt de tweede levering helemaal, dan blijft de summary staan — geen
    // lege bak. De 5-minutenlus probeert het vanzelf opnieuw.
    if(!extra){
      paras += '<p class="tekstlaad">'+(tekstStatus==="mislukt"
        ? "De volledige tekst kon niet worden geladen."
        : "Volledige tekst wordt geladen…")+'</p>';
    }
    var bronnen = extra ? (extra.bronnen||[]) : [];
    var bronBlok;
    if (extra && bronnen.length){
      bronBlok = '<div class="bronwrap"><button type="button" class="bronknop" data-bron="'+esc(aid)+'" aria-expanded="false">'+ico("ic-bronnen")+' Bronnen ('+bronnen.length+')</button><ul class="bronlijst">'+bronnen.map(bronHTML).join("")+'</ul></div>';
    } else if (!extra && aantal){
      // Wél bronnen, maar de lijst is er nog niet. Bewust de "leeg"-vorm: die is
      // niet aanklikbaar, dus geen knop die niets doet.
      bronBlok = '<div class="bronknop leeg">'+ico("ic-bronnen")+' Bronnen ('+aantal+') — '+
        (tekstStatus==="mislukt" ? "niet geladen" : "worden geladen…")+'</div>';
    } else {
      bronBlok = '<div class="bronknop leeg">'+ico("ic-bronnen")+' Geen externe bron</div>';
    }
    // Redactionele verwijzing naar een achtergrondartikel op Infofrankrijk.
    // Handmatig gekozen in de reviewtool; staat er dus alleen als de redactie
    // er een heeft aangeklikt. Komt uit dezelfde levering als de tekst, ONDER
    // de bronnen, in een eigen blok met een eigen kop.
    var verwijzingen = (extra && extra.verwijzingen) || a.verwijzingen || [];
    var verwijsBlok = verwijzingen.length
      ? '<div class="verwijs"><b>'+esc(VERWIJS_KOP)+'</b><ul>'+verwijzingen.map(function(v){
          return '<li><a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(v.titel||v.url)+'</a></li>';
        }).join("")+'</ul></div>'
      : "";
    // Onderregel. Een PERSSYNTHESE is eigen redactioneel werk op meerdere
    // bronnen; die onder de naam van de eerste krant uit de lijst zetten zou
    // suggereren dat het hun artikel is. Daar staat dus de redactie met de
    // publicatiedatum; de bronnenlijst hieronder is de attributie. Overheids-,
    // Infofrankrijk- en verenigingsitems hebben één afzender — daar klopt de
    // bronregel wél en blijft hij ongewijzigd.
    var rest = a.restDagen ? '<span class="rest">Blijft nog '+a.restDagen+' dag'+(a.restDagen===1?'':'en')+' in het archief</span>' : "";
    var meta;
    if (a.soort === "pers"){
      meta = "Redactie NLFR"+(a.datum?" · "+esc(datum(a.datum)):"")+(rest?" · "+rest:"");
    } else if (rest){
      meta = rest;
    } else {
      // De onderregel komt uit de COMPACTE levering: bronMeta is naam + datum
      // van de eerste bron. Terugval op de volledige vorm als die er is.
      var bm = a.bronMeta || (extra && extra.bronnen && extra.bronnen[0]) || null;
      meta = bm ? esc(bm.naam||"")+(bm.datum?" · "+esc(datum(bm.datum)):"") : "";
    }
    return '<div class="artikel'+(isOpen?" open":"")+'" data-art="'+esc(aid)+'">'+
      '<button type="button" class="artkop" aria-expanded="'+(isOpen?"true":"false")+'">'+
        '<span class="tk"><span class="att">'+esc(a.titel)+'</span>'+(a.summary?'<span class="asum">'+esc(a.summary)+'</span>':'')+(meta?'<span class="ameta">'+meta+'</span>':'')+'</span>'+
        '<span class="chevbox">'+ico("ic-chevron")+'</span>'+
      '</button>'+
      '<div class="uitleg"><div class="tekst">'+(cat==="nieuws"&&a.label?'<div class="redlabel">'+esc(a.label)+'</div>':'')+paras+bronBlok+verwijsBlok+'</div></div>'+
    '</div>';
  }

  function tegelHTML(cat, t){
    var isOpen = !!open[t.id];
    var body;
    if (t.plat){ body = t.plat; }
    else {
      // De archieftegel krijgt zijn artikelen uit een EIGEN levering
      // (/api/actueel-archief), die pas wordt opgehaald als de lezer hem opent.
      // Tot dat moment is `artikelen` leeg en staat `artikelenApart` op de tegel.
      var arts = t.artikelenApart ? (archiefArtikelen || []) : (t.artikelen||[]);
      // De archief-tegel bevat alleen nog perssyntheses; wet- en regelgeving
      // gaat naar het duurzame register op /archief.
      var intro = t.soort==="archief"
        ? '<div class="archief-intro">Verlopen nieuwsberichten, blijven hier maximaal 14 dagen staan. '+
          'Wet- en regelgeving verhuist naar het <a href="/archief" target="_top">Regelgevingsarchief</a>.</div>'
        : "";
      if (t.artikelenApart && !archiefArtikelen){
        // Nog onderweg, of mislukt. Zelfde soort laadstaat en terugval als bij
        // de tekst-levering: nooit een lege bak zonder uitleg.
        body = intro + '<div class="artikelen"><p class="tekstlaad">'+(archiefStatus==="mislukt"
          ? "Het archief kon niet worden geladen. Klap de tegel dicht en weer open om het opnieuw te proberen."
          : "Archief wordt geladen…")+'</p></div>';
      } else {
        // Geen aparte bullet-lijst meer: die herhaalde exact de titels van de
        // artikelen eronder. De artikellijst zelf ís nu het overzicht.
        body = intro + '<div class="artikelen">'+arts.map(function(a){ return artikelHTML(cat,t,a); }).join("")+'</div>';
      }
    }
    var catLabel = (CATS.filter(function(c){return c.key===cat;})[0]||{}).label || "";
    // `artikelAantal` komt uit de compacte levering en klopt ook als de
    // artikelen zelf nog niet zijn meegestuurd (de archieftegel).
    var aantalArt = typeof t.artikelAantal === "number" ? t.artikelAantal : (t.artikelen||[]).length;
    var telling = t.plat ? esc(t.meta||"") : meerv(aantalArt);
    var hot = t.hot ? '<span class="hot"><span class="hotdot"></span>Actueel</span>' : "";
    return '<article class="tegel cat-'+cat+(isOpen?" open":"")+'" data-tegel="'+esc(t.id)+'">'+
      '<button type="button" class="kop" aria-expanded="'+(isOpen?"true":"false")+'">'+
        '<span class="icotegel">'+ico(themaIco(t.thema||t.soort))+'</span>'+
        '<span class="koptekst"><span class="catlabel">'+esc(catLabel)+hot+'</span>'+
          '<h3>'+esc(t.label)+'</h3><span class="kopmeta">'+telling+'</span></span>'+
        '<span class="chevbox">'+ico("ic-chevron")+'</span>'+
      '</button>'+
      '<div class="body">'+body+(t.plat?"":'<div class="sluitrij"><button type="button" class="sluit" data-sluit="'+esc(t.id)+'">'+ico("ic-inklap")+' Inklappen</button></div>')+'</div>'+
    '</article>';
  }

  function leegHTML(){
    return '<div class="leeg"><span class="rond">'+ico("ic-leeg")+'</span>'+
      '<h3>Geen nieuwe berichten</h3>'+
      '<p>In deze categorie is op dit moment niets verschenen. We controleren elke 5 minuten.</p>'+
      '<span class="gecheckt">Laatst gecontroleerd '+esc(bijwerkEl.textContent)+'</span></div>';
  }

  function renderTabs(perCat){
    var g1 = ["nieuws","overheid","nlers"].map(function(k){
      var c = CATS.filter(function(x){return x.key===k;})[0];
      return '<button type="button" role="tab" class="tab cat-'+k+'" data-tab="'+k+'" aria-selected="'+(actief===k?"true":"false")+'">'+ico(c.ic)+esc(c.label)+'</button>';
    }).join("");
    var arch = '<button type="button" role="tab" class="tab cat-archief" data-tab="archief" aria-selected="'+(actief==="archief"?"true":"false")+'">'+ico("ic-archief")+'Archief</button>';
    tabsEl.innerHTML = '<span class="tabgroep">'+g1+'</span><span class="tabsplit"></span><span class="tabgroep archiefgroep">'+arch+'</span>';
  }

  function renderScroller(perCat){
    var lijst = perCat[actief] || [];
    if (!lijst.length){ scrollerEl.innerHTML = leegHTML(); }
    else { scrollerEl.innerHTML = lijst.map(function(t){ return tegelHTML(actief, t); }).join(""); }
    werkAllesLabelBij();
  }

  function render(){
    if(!laatste){ return; }
    renderTabs(laatste);
    renderScroller(laatste);
    meldHoogte();
  }

  function renderStatus(lijst){
    if(!lijst || !lijst.length){ statusEl.innerHTML=""; return; }
    statusEl.innerHTML = '<span class="b" style="font-weight:600">Bronnen:</span>' + lijst.map(function(b){
      return '<span class="b '+(b.ok?"ok":"nok")+'"><span class="sd"></span>'+esc(b.naam)+' ('+(b.aantal||0)+')</span>';
    }).join("");
  }

  // ---- Scroll-zichtbaarheid ---------------------------------------------
  // 1) Vervaag-rand: aan zolang er nog inhoud ONDER de vouw zit. De marge van
  //    8px voorkomt dat de rand blijft hangen op subpixel-resten aan het einde.
  var VERVAAG_MARGE = 8;
  function werkVervaagBij(){
    if(!vervaagEl) return;
    var rest = scrollerEl.scrollHeight - scrollerEl.clientHeight - scrollerEl.scrollTop;
    vervaagEl.classList.toggle("aan", rest > VERVAAG_MARGE);
  }

  // 2) Openklappen brengt de tegelkop bovenaan het zichtbare deel. Bewust
  //    scrollTo() op de scroller zelf en niet scrollIntoView(): die laatste
  //    scrollt ook de voorouders mee en zou de moederpagina verspringen.
  var ZACHT_UIT = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function scrollNaarTegel(tg){
    if(!tg) return;
    requestAnimationFrame(function(){ // laat de open-staat eerst uitlayouten
      var verschil = tg.getBoundingClientRect().top - scrollerEl.getBoundingClientRect().top;
      var max = Math.max(0, scrollerEl.scrollHeight - scrollerEl.clientHeight);
      var doel = Math.max(0, Math.min(scrollerEl.scrollTop + verschil - 8, max));
      if(Math.abs(doel - scrollerEl.scrollTop) < 2){ werkVervaagBij(); return; }
      try{ scrollerEl.scrollTo({ top:doel, behavior: ZACHT_UIT ? "auto" : "smooth" }); }
      catch(e){ scrollerEl.scrollTop = doel; }
      werkVervaagBij();
    });
  }

  function werkAllesLabelBij(){
    var koppen = scrollerEl.querySelectorAll(".kop");
    var allesOpen = koppen.length>0 && Array.prototype.every.call(koppen, function(k){ return k.getAttribute("aria-expanded")==="true"; });
    allesLabel.textContent = allesOpen ? "Alles inklappen" : "Alles uitklappen";
    allesBtn.querySelector("use").setAttribute("href", allesOpen ? "#ic-inklap" : "#ic-uitklap");
    allesBtn.setAttribute("aria-expanded", allesOpen?"true":"false");
  }

  // ---- Interactie ----
  tabsEl.addEventListener("click", function(e){
    var tab = e.target.closest(".tab"); if(!tab) return;
    actief = tab.getAttribute("data-tab"); save("nlfr_tab", actief);
    scrollerEl.scrollTop = 0;
    render();
  });
  tabsEl.addEventListener("keydown", function(e){
    if(e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
    var order = ["nieuws","overheid","nlers","archief"];
    var i = order.indexOf(actief);
    i = e.key==="ArrowRight" ? Math.min(order.length-1,i+1) : Math.max(0,i-1);
    actief = order[i]; save("nlfr_tab", actief); render();
    var t = tabsEl.querySelector('[data-tab="'+actief+'"]'); if(t) t.focus();
  });

  scrollerEl.addEventListener("click", function(e){
    var sluit = e.target.closest(".sluit");
    if(sluit){ zetTegel(sluit.getAttribute("data-sluit"), false); return; }
    var bron = e.target.closest(".bronknop");
    if(bron && !bron.classList.contains("leeg")){
      var wrap = bron.closest(".bronwrap"); var nu = wrap.classList.toggle("open");
      bron.setAttribute("aria-expanded", nu?"true":"false");
      bron.lastChild.textContent = nu ? " Bronnen verbergen" : (" Bronnen ("+wrap.querySelectorAll(".bronlijst li").length+")");
      meldHoogte(); return;
    }
    var artkop = e.target.closest(".artkop");
    if(artkop){
      var art = artkop.closest(".artikel"); var aid = art.getAttribute("data-art");
      var nu2 = art.classList.toggle("open"); artkop.setAttribute("aria-expanded", nu2?"true":"false");
      if(nu2) artOpen[aid]=true; else delete artOpen[aid]; save("nlfr_art", artOpen);
      meldHoogte(); return;
    }
    var kop = e.target.closest(".kop");
    if(kop){ var tg=kop.closest(".tegel"); zetTegel(tg.getAttribute("data-tegel"), !tg.classList.contains("open")); }
  });

  function zetTegel(id, wantOpen){
    var tg = scrollerEl.querySelector('.tegel[data-tegel="'+CSS.escape(id)+'"]'); if(!tg) return;
    tg.classList.toggle("open", wantOpen);
    tg.querySelector(".kop").setAttribute("aria-expanded", wantOpen?"true":"false");
    if(wantOpen) open[id]=true; else delete open[id];
    save("nlfr_open", open);
    werkAllesLabelBij(); meldHoogte();
    // Alleen bij OPENklappen naar de tegel scrollen; bij inklappen blijft de
    // scrollpositie staan waar de lezer hem had.
    if(wantOpen) scrollNaarTegel(tg);
    // Pas HIERNA de aparte levering ophalen: haalArchief() rendert de scroller
    // opnieuw, waarmee `tg` uit de DOM verdwijnt. De open-stand overleeft dat
    // (die zit in `open`), maar het werk hierboven moet wel eerst af zijn.
    // Bij een eerdere mislukking mag dicht-en-weer-open een nieuwe poging doen.
    if (wantOpen && heeftAparteArtikelen(id)){
      if (archiefStatus === "mislukt") archiefStatus = "niet-nodig";
      haalArchief();
    }
  }

  allesBtn.addEventListener("click", function(){
    var allesOpen = allesBtn.getAttribute("aria-expanded")==="true";
    scrollerEl.querySelectorAll(".tegel").forEach(function(tg){
      var id=tg.getAttribute("data-tegel");
      tg.classList.toggle("open", !allesOpen);
      tg.querySelector(".kop").setAttribute("aria-expanded", (!allesOpen)?"true":"false");
      if(!allesOpen) open[id]=true; else delete open[id];
    });
    save("nlfr_open", open);
    werkAllesLabelBij(); meldHoogte();
  });

  // ---- Hoogte-handshake (postMessage), gedebounced + afgerond op 8px ----
  var parentVenster = 0, lastH = 0, hTimer = null;
  function cap(){
    if(parentVenster>0) return Math.max(420, parentVenster);
    var s=(window.screen&&window.screen.height)||900;
    return Math.max(640, Math.min(1200, Math.round(s*0.9)));
  }
  function natuur(){
    var bar=document.querySelector(".bar"), st=statusEl;
    return (bar?bar.offsetHeight:0)+(tabsEl.offsetHeight||0)+(scrollerEl.scrollHeight||0)+(st.offsetHeight||0)+4;
  }
  function meldHoogte(){
    // Elke inhoudswijziging loopt hier langs (tegel/artikel/bronnen open of
    // dicht, tabwissel, render) — dus dit is ook het punt om de vervaag-rand
    // bij te werken. Bewust vóór de debounce-guard: de rand moet meteen kloppen.
    werkVervaagBij();
    if(hTimer) return;
    hTimer = setTimeout(function(){
      hTimer=null;
      try{
        if(window.parent && window.parent!==window){
          var h = Math.min(natuur(), cap());
          h = Math.round(h/8)*8;
          if(Math.abs(h-lastH)>=8){ lastH=h; window.parent.postMessage({ nlfrActueelHeight:h }, "*"); }
        }
      }catch(e){}
    }, 100);
  }
  window.addEventListener("message", function(e){
    if(e.data && typeof e.data.nlfrViewport==="number" && e.data.nlfrViewport>0){
      parentVenster=e.data.nlfrViewport; lastH=0; meldHoogte();
    }
  });
  // Verandert de paneelhoogte (moederpagina groeit/krimpt het iframe), dan
  // verandert ook of er nog iets onder de vouw zit.
  if(window.ResizeObserver){ new ResizeObserver(function(){ meldHoogte(); werkVervaagBij(); }).observe(scrollerEl); }
  scrollerEl.addEventListener("scroll", function(){
    save("nlfr_scroll", scrollerEl.scrollTop);
    werkVervaagBij();
  }, { passive:true });

  // De pagina wordt in TWEE leveringen geladen (zie lib/levering.js):
  //   1. /api/actueel        de compacte vorm — alles wat de DICHTE staat toont.
  //                          Hierop wordt meteen gerenderd.
  //   2. /api/actueel-tekst   de tekst en de bronnenlijsten, samen ruim 70% van
  //                          de oude payload. Die haalt de pagina op de
  //                          ACHTERGROND op; de eerste weergave wacht er niet op.
  // teksten blijft null tot levering 2 binnen is; artikelHTML() toont dan de
  // summary met een korte laadstaat. Mislukt levering 2, dan blijft de summary
  // staan en probeert de 5-minutenlus het vanzelf opnieuw.
  var teksten = null;
  var tekstStatus = "laden"; // laden | klaar | mislukt

  // De DERDE levering: de artikelen van de archieftegel plus hun tekst en
  // bronnen. Wordt PAS opgehaald als de lezer de archieftegel opent — niet op
  // de achtergrond meegeladen, want dat is precies het verbruik (80 kB van de
  // 105 kB) dat deze splitsing weghaalt.
  var archiefArtikelen = null;
  var archiefStatus = "niet-nodig"; // niet-nodig | laden | klaar | mislukt

  // Opnieuw renderen zonder de scrollpositie te verliezen: renderScroller()
  // vervangt de innerHTML, dus die springt anders naar boven.
  function herrender(){
    var sc = scrollerEl.scrollTop;
    render();
    scrollerEl.scrollTop = sc;
    werkVervaagBij();
  }

  function haalArchief(){
    if (archiefStatus === "laden" || archiefStatus === "klaar") return;
    archiefStatus = "laden";
    herrender(); // laadstaat meteen tonen
    fetch("/api/actueel-archief")
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
      .then(function(d){
        if (d && Array.isArray(d.artikelen)){
          archiefArtikelen = d.artikelen;
          // De teksten gaan in dezelfde map als die van levering 2, op dezelfde
          // sleutel tegelId/artikelId; artikelHTML() merkt geen verschil.
          if (d.teksten){
            if (!teksten) teksten = {};
            for (var k in d.teksten){ if (Object.prototype.hasOwnProperty.call(d.teksten,k)) teksten[k] = d.teksten[k]; }
          }
          archiefStatus = "klaar";
        } else {
          archiefStatus = "mislukt";
        }
        herrender();
      });
  }

  function haalTeksten(){
    return fetch("/api/actueel-tekst")
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
      .then(function(d){
        if (d && d.artikelen){
          teksten = d.artikelen;
          tekstStatus = "klaar";
        } else if (!teksten){
          // Alleen als er nog nooit iets binnenkwam; een eerder geslaagde
          // levering blijft staan als een latere ronde mislukt.
          tekstStatus = "mislukt";
        }
        // Opnieuw renderen met wat er nu is. De open/dicht-standen zitten in
        // `open` en `artOpen`, dus die overleven het.
        herrender();
      });
  }

  // Heeft deze tegel zijn artikelen in een aparte levering staan?
  function heeftAparteArtikelen(id){
    var lijst = (laatste && laatste[actief]) || [];
    for (var i=0;i<lijst.length;i++){ if (lijst[i].id === id) return !!lijst[i].artikelenApart; }
    return false;
  }

  function laad(){
    Promise.all([
      // Geen cache:"no-store" meer: de server zet max-age=120, dus de browser
      // mag het antwoord twee minuten hergebruiken (herbezoek en terug-
      // navigatie kosten dan niets). De 5-minutenlus hieronder haalt daarna
      // vanzelf een verse versie.
      fetch("/api/actueel").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch("/api/schoolvakanties",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    ]).then(function(res){
      var data = res[0] || { bijgewerkt:new Date().toISOString(), tegels:[], agenda:[], bronStatus:[] };
      bijwerkEl.textContent = tijd(data.bijgewerkt);
      laatste = bouwCats(data, res[1]);
      renderStatus(data.bronStatus||[]);
      render();
      var sc = load("nlfr_scroll", 0); if(sc){ scrollerEl.scrollTop = sc; }
      // Direct bij laden: staat er meer onder de vouw, dan meteen de rand tonen.
      werkVervaagBij();
      // Pas NA de eerste weergave, en zonder die op te houden.
      haalTeksten();
      // Stond de archieftegel al open (bewaarde stand, of een verversing terwijl
      // de lezer erin zat), dan hoort zijn inhoud er ook te zijn.
      if (open["archief"]) haalArchief();
    });
  }

  // Eerste, rustige skeleton.
  scrollerEl.innerHTML = '<div class="skelkaart"><div class="skel k"></div><div class="skel m"></div><div class="skel s"></div></div>';
  laad();
  setInterval(laad, 5*60*1000);
})();
</script>
</body>
</html>
