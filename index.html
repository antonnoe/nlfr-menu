<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>NLFR hoofdmenu</title>
<!--
  NLFR HOOFDMENU — externe versie voor GitHub/Vercel
  Herbouw naar het goedgekeurde ontwerp (04-09-2026).

  Dit bestand wordt gehost op Vercel en op nederlanders.fr geladen via een
  iframe: op desktop op elke pagina (955px breed, hoogte via postMessage
  nlfrMenuHeight), op /m op één mobiele pagina. Zie README.md voor de
  embedcode. Voor de bezoeker is dit iframe op desktop de ENIGE navigatie —
  de tabbalk van Ning is alleen voor beheerders zichtbaar. Elke link die hier
  in staat is dus de enige weg naar die pagina.

  OPBOUW, VAN BOVEN NAAR BENEDEN
    1. Banner (Café Jeudi), volle breedte, alleen als hij aanstaat — komt uit
       /api/banner, opmaak uit lib/banner.js. Beheer op /banner-beheer.
    2. Strip: één bordeaux balk met home, Menu, zoeken, Plaats bericht,
       Nu actueel en (alleen voor de beheerder) het tandwiel. Dit is het eerste
       element in de kaart; de afronding komt van de kaart zelf.
    3. Lade: de uitklappers van "Plaats bericht", "Nu actueel", het tandwiel en
       /m. IN-FLOW, niet position:absolute — een overlay wordt in een iframe
       met hoogte-sync afgeknipt.
    4. Paneel: vijf kolommen (Lezen, Meedoen, Vinden, Mijn NLFR, Nieuws), op
       desktop standaard dicht, open via "Menu"; op mobiel accordeons.

  GEEN KAARTKOP MEER (04-09-2026). Er stond een blok met "Nederlanders.fr" en
  de slogan boven de strip. Op nederlanders.fr staat NING's eigen sitekop met
  dezelfde naam en dezelfde slogan direct boven dit iframe, dus dat stond
  dubbel. Weggehaald in alle modi; de banner is nu het eerste element en
  daaronder komt meteen de strip.

  WEGWIJZER, GEEN INHOUDSOPGAVE (07-09-2026). Lezen, Meedoen, Vinden en Nieuws
  droegen samen 72 links in vier laden. Die inhoud staat nu op openbare
  categoriepagina's op nederlanders.fr zelf; deze vier ingangen zijn nog maar
  een link daarnaartoe. Mijn NLFR houdt zijn lade: die verschilt per bezoeker
  en kan dus geen openbare pagina zijn. Wat er uit het menu is verdwenen ligt
  URL voor URL vast in test/fixtures/menu-urls-verhuisd.json.

  WAT ER T.O.V. DE VORIGE VERSIE IS VERVALLEN
    Het "Onderwerpen"-uitklapmenu met TOPICS en CTAS, de vijf losse deurknoppen
    met subtitels, de onderbalk, MOBILE_QUICK/MOBILE_HIDE en de
    accent/support/emph-klassen. Alle links hebben nu hetzelfde gewicht.
    /page/rubrieken is vervallen.

  ONDERHOUD — alles wat je normaal wijzigt staat in het <script>-blok:
    - DEUREN_LINK .. de vier ingangen die rechtstreeks doorverwijzen
    - memberGroups   het ledenmenu (Mijn NLFR, ingelogd)
    - ADMIN_LINKS .. de beheerlade achter het tandwiel
    - WERVING ...... de wervende tekst voor wie niet is ingelogd
    - ZUSTERS ...... de rij zusterplatforms onderin het paneel
    - PANEELKNOPPEN  de knoppen links onderin het paneel
    De knop "Nu actueel" toont linkjes die LIVE uit actueel.json komen; de
    banner komt live uit /api/banner. Beheer-ID: ADMIN_ID. Zoek: ZOEK_APP.
-->
<style>
  /* --- Auto-dark blokkeren: het menu is een lichte kaart, altijd. ---
     Chrome/Android draait de pagina anders zelf om ("auto dark theme") en dan
     is bordeaux #800000 onleesbaar. color-scheme:only light plus expliciete
     achtergronden op elk vlak: er valt niets te inverteren. */
  :root { color-scheme: only light; --brand: #800000; --brand-dark: #5c0f0f; --actueel: #2f6b3a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Mulish', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #3a3330; padding: 6px; }
  a { color: var(--brand); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---- Banner (opmaak zelf staat in lib/banner.js, gedeeld met /banner-beheer) ---- */
  #bannerhost { background: transparent; }
  #bannerhost:not(:empty) { margin-bottom: 8px; }

  /* ---- Kaart ---- */
  /* Geen slagschaduw. Die tekende een rode waas onder het uitgeklapte paneel;
     de rand van de kaart zet het blok al genoeg af tegen de pagina. */
  .card { background: #fff; border: 1px solid rgba(128,0,0,.12); border-radius: 16px;
          overflow: hidden; }

  /* ---- Strip: één bordeaux balk ----
     Dit is het eerste element in de kaart. De kaart heeft overflow:hidden, dus
     de strip krijgt de bovenste afronding vanzelf mee. */
  .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
           min-height: 56px; padding: 10px 14px; background: var(--brand); }
  .sknop { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
           min-height: 44px; padding: 0 14px; border-radius: 9px;
           border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12);
           color: #fff; font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; }
  .sknop:hover { background: rgba(255,255,255,.2); }
  .sknop:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .shome { flex: none; width: 44px; height: 44px; padding: 0; }
  .smenu { flex: none; }
  .splaats { flex: none; background: #fff; border-color: #fff; color: var(--brand); font-size: 15px; }
  .splaats:hover { background: #f7ecea; }
  .sactueel { flex: none; background: transparent; border-color: rgba(255,255,255,.4); font-size: 15px; }
  .sadmin { flex: none; width: 44px; height: 44px; padding: 0; margin-left: auto; display: none; }
  .sadmin.show { display: inline-flex; }
  .sknop.active { background: rgba(255,255,255,.28); }
  /* Groene stip: pulseert alleen als er werkelijk iets live is. */
  .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--actueel); flex: none;
         box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
  .dot.live { animation: puls 2.4s ease-out infinite; }
  @keyframes puls {
    0%   { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 0 rgba(47,107,58,.6); }
    70%  { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 8px rgba(47,107,58,0); }
    100% { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 0 rgba(47,107,58,0); }
  }
  .caret { flex: none; opacity: .85; }

  /* Zoekveld */
  .szoek { flex: 1 1 160px; min-width: 160px; display: flex; }
  .zoekbox { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px;
             padding: 0 6px 0 12px; border-radius: 9px; background: rgba(255,255,255,.78); }
  .zoekbox:focus-within { background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
  .zoekbox input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
                   font-family: 'Mulish', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #3a3330; }
  .zoekbox input::placeholder { color: #8a7f7c; }
  .zoekbox .wis { display: none; flex: none; width: 28px; height: 28px; border: 0; border-radius: 999px;
                  background: transparent; color: #8a7f7c; align-items: center; justify-content: center; }
  .zoekbox .wis.show { display: inline-flex; }
  .zoekbox .ga { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 34px;
                 padding: 0 12px; border: 0; border-radius: 7px; background: var(--brand); color: #fff;
                 font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }

  /* Alleen mobiel */
  .sforum, .sloep { display: none; }

  /* ---- Lade: een compacte kaart die onder zijn eigen knop hangt ----
     IN-FLOW, nooit position:absolute of fixed. Dit iframe is precies zo hoog
     als het meldt; alles wat buiten de documentstroom valt, wordt door de
     moederpagina afgeknipt. De kaart hangt dus niet ergens overheen maar wordt
     met een marge onder zijn knop geschoven (zie richtLade()). De rest van de
     strook onder de strip blijft leeg. */
  .lade { display: none; background: #fff; padding: 8px 14px 14px; }
  .lade.open { display: block; }
  /* Het pijltje naar de knop. position:relative houdt het IN de stroom en
     zorgt alleen dat het over de rand van de kaart heen valt. */
  .ladepijl { position: relative; z-index: 1; width: 14px; height: 14px; margin: 0 0 -7px 0;
              background: #fff; border-left: 1px solid rgba(128,0,0,.14);
              border-top: 1px solid rgba(128,0,0,.14); transform: rotate(45deg); }
  .ladekaart { background: #fff; border: 1px solid rgba(128,0,0,.14); border-radius: 12px;
               box-shadow: 0 12px 34px -16px rgba(90,0,0,.45); padding: 14px 16px; max-width: 100%; }
  .ladekaart.plaats { width: 560px; }
  .ladekaart.actueel { width: 340px; }
  .ladekaart.admin { width: 300px; }
  /* Dezelfde twee kleuren als in het paneel, en om dezelfde reden: de kop stond
     op 2,61:1 en de links op 7,60:1. Nu 10,95:1 en 12,63:1. */
  .lade .h { display: block; font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px;
             letter-spacing: .06em; text-transform: uppercase; color: var(--brand); margin-bottom: 6px; }
  .lade .ladekaart > a { display: flex; align-items: center; min-height: 44px;
                         font-size: 14px; color: #333; padding: 5px 0; background: #fff; }
  .lade .ladekaart > a:hover { color: var(--brand); }
  .lade .leeg { font-size: 13px; color: #666; } /* was #8a7f7c: 3,88:1, onder de eis */

  /* ---- "Nu actueel": pill-knoppen met een tekstlinkje eronder ----
     Alles hier staat binnen .ladekaart.actueel, zodat de andere laden hun
     gewone tekstlinkjes houden. De generieke regel .lade .ladekaart > a
     (44px hoog, #333, padding 5px 0) mag op deze lade NIET gelden: de pill is
     klein en bordeaux. Drie klassen wegen zwaarder dan twee klassen plus een
     element, dus deze regels winnen zonder !important — mits ze elke
     eigenschap die de generieke regel zet ook zelf zetten. Vandaar de
     min-height, de padding en de achtergrond die er anders overbodig uitzien. */
  .ladekaart.actueel { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .ladekaart.actueel .h { margin-bottom: 10px; }
  .ladekaart.actueel .nap { position: relative; display: inline-flex; align-items: center; gap: 8px;
                            min-height: 0; padding: 7px 15px; border-radius: 999px;
                            background: var(--brand); color: #fff;
                            font-family: 'Mulish', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                            font-size: 13px; font-weight: 600; line-height: 1; text-decoration: none; }
  .ladekaart.actueel .nap:hover { background: var(--brand-dark); color: #fff; }
  .ladekaart.actueel .nap:focus-visible { outline: 2px solid var(--brand-dark); outline-offset: 2px; }
  /* Het stipje is hier kleiner dan op de balk; de witte ring blijft, want die
     zet het groen af tegen het bordeaux van de pill. */
  .ladekaart.actueel .nap .dot { width: 8px; height: 8px; }
  .ladekaart.actueel .nal { position: relative; display: inline-block;
                            min-height: 0; padding: 0; margin: 2px 0 0 4px; background: transparent;
                            font-size: 12.5px; color: var(--brand);
                            text-decoration: underline; text-underline-offset: 2px; }
  .ladekaart.actueel .nal:hover { color: var(--brand-dark); }
  .ladekaart.actueel .nal:focus-visible { outline: 2px solid var(--brand-dark); outline-offset: 2px; }
  /* Tikoppervlak van 44px zonder de pill zelf te vergroten: een onzichtbaar
     vlak dat 8px boven en onder de link uitsteekt (height: 100% + 2x8px). Een
     pill van 27px komt daarmee op 43px, één pixel te kort, en het tekstlinkje
     blijft er ver onder — vandaar de min-height van 44px. Het vlak heeft geen
     achtergrond en verandert niets aan wat je ziet. */
  .ladekaart.actueel .nap::before,
  .ladekaart.actueel .nal::before { content: ""; position: absolute; left: 0; right: 0; top: 50%;
                                    transform: translateY(-50%);
                                    height: calc(100% + 16px); min-height: 44px; }

  /* De twee kolommen achter "Plaats bericht" */
  .plaatskolommen { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .plaatskolom { min-width: 0; }
  .plaatskolom h4 { margin: 0; font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700;
                    font-size: 14.5px; color: var(--brand-dark); }
  .pil { display: inline-block; margin-top: 5px; padding: 2px 9px; border-radius: 999px;
         font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10.5px;
         letter-spacing: .06em; color: #fff; }
  .pil.gratis { background: var(--actueel); }
  .pil.betaald { background: var(--brand); }
  .plaatskolom p { margin: 7px 0 11px; font-family: 'Mulish', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px;
                   line-height: 1.5; color: #333; }
  .plaatsknop { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
                padding: 0 16px; border-radius: 9px; background: var(--brand); color: #fff;
                font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }
  .plaatsknop:hover { filter: brightness(1.12); }

  /* ---- Paneel ---- */
  .paneel { display: none; background: #fdfbfa; border-top: 1px solid rgba(128,0,0,.10); padding: 24px; }
  .paneel.open { display: block; }
  /* Vijf gelijke sporen. Het dubbele spoor voor Lezen en de twee kolommen
     daarbinnen zijn vervallen met zijn lade: die bestonden alleen omdat Lezen
     43 links droeg en anders drie keer zo hoog werd als de vier andere. */
  /* STRETCH, GEEN START. De vijf ingangen horen even hoog te zijn: vier korte
     tegels naast één lange leest als vier half afgemaakte kolommen. De deur is
     daarom een flexkolom waarvan de tegel de resthoogte opvult. */
  .kolommen { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 18px; align-items: stretch; }
  .deur { background: #fdfbfa; min-width: 0; display: flex; flex-direction: column; }
  .deurkop { display: block; background: #fdfbfa; border-bottom: 1px solid rgba(128,0,0,.10);
             padding-bottom: 7px; margin-bottom: 10px; }
  /* #800000, niet #5c0f0f: de koppen op de categoriepagina's staan op de
     primaire huisstijlkleur, en het menu hoort daar één geheel mee te vormen.
     Contrast op #fdfbfa: 10,61:1 (zie test/menu-contrast.test.mjs). */
  .deurkop .dn { display: block; font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; color: var(--brand); }
  /* Ondertitel onder de kolomkop. Stond op #a99e9a (2,53:1) en was daarmee
     niet te lezen; nu #666666, de subtiele tekstkleur uit de huisstijl, op
     5,57:1. Een halve punt groter, want 11,5px is klein voor een regel die
     alleen betekenis heeft als je hem ook werkelijk leest. */
  .deurkop .ds { display: block; font-family: 'Mulish', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; color: #666; }
  .deurkop .dc, .deurkop .dcaret { display: none; }
  /* De vier ingangen die doorverwijzen. Op desktop is de kop zelf de link; het
     pijltje staat er alleen op mobiel bij, waar de kop een volle regel is. */
  /* De vier ingangen die doorverwijzen. De <a> is de hele tegel; het pijltje
     staat er alleen op mobiel bij, waar de kop een volle regel is. */
  a.deur-link { text-decoration: none; color: inherit; }
  a.deur-link:hover .dn { text-decoration: underline; }
  a.deur-link:hover .tegel { border-color: rgba(128,0,0,.30); }
  a.deur-link:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .deurkop.deurlink { display: block; }
  .deurlink .dpijl { display: none; }
  /* DEZELFDE DOOS ALS OP DE CATEGORIEPAGINA'S. De tegels op nederlanders.fr
     staan op rgba(128,0,0,.05) met een rand van rgba(128,0,0,.16); menu en
     pagina horen als één geheel te ogen, dus die waarden staan hier ook. De
     wervingstegel deelt ze, anders valt hij als vreemde eend uit de rij. */
  .tegel, .teaser { background: rgba(128,0,0,.05); border: 1px solid rgba(128,0,0,.16); }
  .tegel { display: flex; flex-direction: column; border-radius: 12px; padding: 12px;
           transition: border-color 140ms ease; }
  .tegel .tt { display: block; font-size: 12.5px; color: #333; line-height: 1.35; }
  /* De opsomming staat ONDER ELKAAR, één regel per onderwerp. Als doorlopende
     regel met scheidingstekens leest een kolom van 130px als één lange zin. */
  .tegel .tp { display: block; margin-top: 8px; padding-top: 8px;
               border-top: 1px solid rgba(128,0,0,.14); }
  .tegel .tpi { display: block; font-size: 12px; color: #666; line-height: 1.45; }
  /* Het kernonderdeel van een ingang: bordeaux en halfvet, de rest blijft grijs. */
  .tegel .tp-accent { color: var(--brand); font-weight: 600; }
  /* Ingesprongen: deze regel hangt onder de regel erboven. */
  .tegel .tp-in { padding-left: 12px; }
  /* Flex, geen block: de tegel erin moet de resthoogte van de kolom opvullen,
     anders zijn de KOLOMMEN even hoog en de TEGELS niet. */
  .deurbody { display: flex; flex-direction: column; flex: 1; background: #fdfbfa; }
  .deurbody > .teaser, .deurbody > .tegel { flex: 1; }
  /* WITRUIMTE TUSSEN GROEPEN, niet tussen regels. Tussen twee items zit 10px
     (2 x 5px padding); tussen twee groepen zat 12px, en dat verschil ziet
     niemand — veertien groepen lopen dan als één lijst in elkaar over. Nu 24px,
     ruim het dubbele van de regelafstand, zodat elke groep als blok leest.
     Op mobiel blijft dit 0: daar scheiden lijnen de groepen in de accordeon
     (zie html.compact hieronder). */
  .grp { margin-bottom: 24px; background: #fdfbfa; }
  .grp:last-child { margin-bottom: 0; }
  /* GROEPSKOPPEN IN BORDEAUX. Stonden op #a99e9a: 2,53:1 op de
     paneelachtergrond, ver onder de AA-eis van 4,5:1 en in de praktijk
     onleesbaar. Nu #800000, de primaire huisstijlkleur, op 10,61:1. De
     ondermarge gaat van 2 naar 6px zodat de kop aan zijn eigen lijst vastzit
     en niet tussen twee groepen in zweeft. */
  .gk { font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12.5px; letter-spacing: .06em;
        text-transform: uppercase; color: var(--brand); margin-bottom: 6px; }
  /* Op desktop staat elke groep gewoon open; teller en caret horen bij de
     accordeon die alleen op mobiel bestaat. */
  .gk .gc, .gk .gcaret { display: none; }
  .gl { display: block; }
  /* ALLE links hetzelfde gewicht: geen bold, geen bordeaux, geen emoji.
     KLEUR: #333333, de hoofdtekstkleur uit de huisstijl. Stond op #5b524f, een
     warm grijsbruin dat op de warme paneelachtergrond roodachtig oogt en
     nauwelijks verschilt van de accenten eromheen. Gemeten: 7,36:1 werd
     12,25:1. Rood blijft van nu af voorbehouden aan koppen. */
  /* LANGE WOORDEN AFBREKEN. De kolom is bij het iframe van 955px maar 134px
     breed, en die breedte ligt vast: er moeten zes sporen passen omdat de
     kolom Lezen er dubbel in staat. "Ondernemers\u00adnieuws" is 155px op 15px en
     stak dus buiten zijn kolom, over de buurkolom heen. Dat deed het op 13,5px
     trouwens al, 140px in een kolom van 134px, dus dit is een bestaand gebrek
     dat met de grotere letter alleen zichtbaarder werd.
     De afbreekpunten staan als \u00ad (zacht afbreekstreepje) in de labels
     zelf, op de samenstellingsgrens: "Ondernemers-nieuws". Ze zijn onzichtbaar
     zolang het woord past. Niet hyphens:auto, want dat leunt op een Nederlands
     afbreekwoordenboek dat niet in elke browser zit; waar het ontbreekt breekt
     de tekst midden in een lettergreep af.
     overflow-wrap is het vangnet voor een toekomstig label zonder afbreekpunt:
     lelijk afgebroken is nog altijd beter dan over de buurkolom heen.
     Gemeten in Chromium bij 1600, 1200, 969, 955, 900 en 800px. */
  .grp a { display: block; font-family: 'Mulish', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.4;
           color: #333; padding: 5px 0; overflow-wrap: break-word; }
  .grp a:hover { color: var(--brand); }

  /* Abonneerknop onderin de Nieuws-kolom */

  /* Teaser in de kolom Mijn NLFR (niet ingelogd) */
  .teaser { border-radius: 12px; padding: 12px; }
  .teaser h3 { margin: 0 0 6px; font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13.5px; color: var(--brand); }
  .teaser .tsub { margin: 0 0 8px; font-family: 'Mulish', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; color: #666; line-height: 1.3; }
  .teaser .perk { display: flex; gap: 7px; align-items: flex-start; font-size: 12.5px; color: #333; line-height: 1.3; margin-bottom: 5px; }
  .teaser .perk svg { flex: none; margin-top: 3px; }
  .teaser .btns { display: grid; gap: 6px; margin-top: 10px; }
  /* De kolommen zijn smaller sinds Lezen er twee pakt; 12px houdt
     "Word lid — gratis" op één regel in plaats van halverwege af te breken. */

  .subbalk { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px;

  html.compact .gk { margin: 0; padding: 2px 0; }

  // GEEN TOKEN IN DEZE LINKS. Dit bestand is de menubron en is publiek

  //
  // Redactie — Actueel staat er ACHTER Banner beheren en niet ervoor: die

  // voor een voorkeur van het moment is de moeite niet waard.
  var ADMIN_LINKS = [["Banner beheren","/banner-beheer","_blank"],["Redactie — Actueel","/review","_blank"],["Dashboard",U("/main/dashboard")],["Tags",U("/page/tags")],["Standaard teksten",U("/page/standard-berichten")],["Bestands\u00adbeheer",U("/main/filemanager/list")],["Mijn pagina's",U("/page/page/listForContributor")]];
  // De wervende tekst die een NIET-ingelogde bezoeker onder "Mijn NLFR" ziet.
  // Ingelogde leden zien daar hun eigen links (memberGroups) en dit blok dus
  // niet. De volgorde van de punten ligt vast in test/menu.test.mjs: hij loopt
  // van wat er al is (24 jaar antwoorden) naar wat de bezoeker zelf kan doen.
  var WERVING = {
    kop: "Word gratis lid",
    onder: "Vraag het aan wie het al heeft meegemaakt",
    punten: [
      "24 jaar aan vragen en antwoorden, van meer dan 25.000 leden",

  };

  // De zusterplatforms. Communities Abroad is eruit: dat is corporate
  // communicatie en niet waar een bezoeker van dit menu naar op zoek is.
  var ZUSTERS = [["Infofrankrijk","https://infofrankrijk.com/"],["Café Claude","https://www.cafeclaude.fr/"],["Nedergids","https://nedergids.nl/"]];

  // De smalle regel onder de balk, ALTIJD ZICHTBAAR, ook met het menu dicht.

  // vervallen omdat ze al in de balk en in de tegel Meedoen staan. De
  // zusterlinks stonden daar ook; ze zijn hierheen verhuisd, want een link die

  var SNELRIJ = [["Diensten", U("/page/diensten")]].concat(ZUSTERS);

  // De twee kolommen achter de knop "Plaats bericht". Naast elkaar op desktop,
  // onder elkaar op mobiel. Het verschil gratis/betaald is de hele reden dat
  // deze lade bestaat, vandaar het pilletje boven de uitleg.
  var PLAATS_KOLOMMEN = [
    { kop: "Plaats een forumbijdrage", label: "GRATIS", pil: "gratis",
      tekst: "Uw forumbijdrage wordt bijzonder op prijs gesteld. Vragen worden beantwoord in het forum, van ervaringen leren we allemaal, en korte verhalen krijgen een eigen rubriek. Ook roerende goederen te koop (auto's, campers, caravans) plaatst u hier gratis.",
      knop: "Naar het forum", url: U("/profiles/blog/new") },
    { kop: "Plaats een advertentie", label: "BETAALD", pil: "betaald",
      tekst: "Vacatures, vastgoed en bedrijfsberichten worden alleen geplaatst na betaling.",
      knop: "Naar de betaalpagina", url: U("/page/betaalpagina-berichten") }
  ];

  var DEUR_VOLGORDE = ["lezen","doen","vinden","mijn","nieuws"];

  var ACTUEEL = null; // null = nog niet geladen; {kaarten:[...]} na fetch.
  // Dit bestand kan op twee plekken staan: op Vercel (naast index.html) en als
  // bestand in het Ning-bestandsbeheer. Daarom eerst relatief, dan het vaste
  // adres op Vercel. Zelfde patroon voor de banner en zijn module.
  var ACTUEEL_URL = "/actueel.json";
  var ACTUEEL_FALLBACK = "https://nlfr-menu.vercel.app/actueel.json";
  var BANNER_URL = "/api/banner";
  var BANNER_FALLBACK = "https://nlfr-menu.vercel.app/api/banner";
  var BANNER_MODULE = "/lib/banner.js";
  var BANNER_MODULE_FALLBACK = "https://nlfr-menu.vercel.app/lib/banner.js";

  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  var paneel = document.getElementById("paneel");
  var lade = document.getElementById("lade");
  var subbalk = document.getElementById("subbalk");
  var menubtn = document.getElementById("menubtn");
  var plaatsbtn = document.getElementById("plaatsbtn");
  var actueelbtn = document.getElementById("actueelbtn");
  var adminbtn = document.getElementById("adminbtn");

  var caretSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
  // Het pijltje op een ingang die doorverwijst. Bewust een ander teken dan de
  // caret van Mijn NLFR: die klapt open, deze gaat naar een andere pagina.
  var pijlSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>';
  var kruisSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  // Het pijltje naast een link die de bezoeker van nederlanders.fr wegvoert.
  var extSvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

  // ---- Hoogte melden ----------------------------------------------------
  // Meet de werkelijke hoogte van #alles (banner + kaart), niet
  // body.scrollHeight: die is nooit kleiner dan het iframe-venster, wat een
  // oneindige groei-lus geeft. Alleen melden bij een gewijzigde waarde.
  var lastReported = 0, fitTimer = null;
  function report(){
    try {
      if (window.parent && window.parent !== window) {
        var alles = document.getElementById("alles");
        if (!alles) return;
        var h = Math.ceil(alles.getBoundingClientRect().height) + 12; // + body-padding
        if (h !== lastReported) {
          lastReported = h;
          window.parent.postMessage({ nlfrMenuHeight: h }, "*");
          // Neemt de ouderpagina de hoogte NIET over (oude embedcode of een
          // mobiel thema zonder ons script), dan blijft dit iframe op zijn
          // vaste hoogte staan en zou een open paneel onbereikbaar zijn.
          // Meet daarom of we werkelijk zijn meegegroeid; zo niet, dan interne
          // scroll.
          if (h > window.innerHeight + 20) {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(function(){
              var gegroeid = window.innerHeight >= h - 20;
              document.documentElement.classList.toggle("noresize", !gegroeid);
            }, 450);
          } else {
            document.documentElement.classList.remove("noresize");
          }
        }
      }
    } catch(e){}
  }

  // ---- Paneel ------------------------------------------------------------

  // Eén groep: kop met teller en caret (alleen zichtbaar op mobiel, waar de
  // groepen accordeons zijn), daaronder de links.
  // DE GROEPSKOP IS EEN KOP, GEEN KNOP. Binnen een geopende ingang staat alles
  // open: alle groepen, alle items. Er zat hier een tweede accordeon onder de
  // eerste — je tikte "Lezen" open en kreeg zestien dichte groepen waarvan er
  // één openstond, dus twee tikken per link en geen overzicht van wat er in die
  // ingang zit. Eén laag klapwerk is genoeg; die zit op de vijf ingangen.
  //
  // Zonder klapwerk hoort er ook geen caret en geen teller bij: een pijltje
  // naast een kop die niet opengaat belooft iets wat er niet is, en een aantal
  // naast een lijst die er volledig onder staat telt wat je al ziet.
  function groepHTML(g){
    return '<div class="grp">' +
      '<div class="gk"><span class="gn">' + g[0] + '</span></div>' +
      '<div class="gl">' + g[1].map(function(l){ return link(l[1], l[0], l[2]); }).join("") + '</div>' +
    '</div>';
  }

  // ---- Eén kolom in het paneel -----------------------------------------
  //
  // Vier van de vijf ingangen zijn een LINK: een kop zonder body. Alleen
  // Mijn NLFR heeft nog inhoud die openklapt, want die verschilt per bezoeker
  // en kan daarom geen openbare pagina zijn.
  //
  // De link-ingang krijgt een <a> als kop, geen role="button". Een kop die
  // navigeert en een kop die openklapt zijn twee verschillende dingen, en een
  // schermlezer hoort dat verschil te krijgen: geen aria-expanded op iets dat
  // niet open- en dichtgaat.
  // Eén regel uit de opsomming. Geen opsommingsteken: de regels staan al onder
  // elkaar en een bolletje ervoor kost breedte in een kolom van 130px.
  function puntHTML(p){
    var m = (p[1] || "").split(" ");
    var kl = "tpi";
    for (var i = 0; i < m.length; i++) if (m[i]) kl += " tp-" + m[i];
    return '<span class="' + kl + '">' + p[0] + '</span>';
  }

  function linkKolomHTML(sleutel){
    var d = DEUREN_LINK[sleutel];
    var t = tgt(d.url), rel = (t === "_blank") ? ' rel="noopener"' : '';
    // DE HELE TEGEL IS DE LINK, dus de <a> staat buitenom. Alles daarbinnen is
    // een <span>: een tweede <a> in een <a> mag niet en zou de tegel in stukken
    // knippen die elk apart aanklikbaar zijn.
    return '<a class="deur deur-link" data-deur="'+sleutel+'" href="'+d.url+'" target="'+t+'"'+rel+'>' +
           '<span class="deurkop deurlink">' +
           '<span class="dn">'+d.naam+'</span><span class="ds">'+d.sub+'</span>' +
           '<span class="dpijl">'+pijlSvg+'</span></span>' +
           '<span class="deurbody"><span class="tegel">' +
           '<span class="tt">'+d.tekst+'</span>' +
           '<span class="tp">'+d.punten.map(puntHTML).join("")+'</span>' +
           '</span></span></a>';
  }

  function kolomHTML(sleutel){
    if (DEUREN_LINK[sleutel]) return linkKolomHTML(sleutel);

    // Mijn NLFR: de enige ingang die nog openklapt.
    var groups = isMember ? memberGroups() : null;
    var aantal = 0;
    if (groups) groups.forEach(function(g){ aantal += g[1].length; });

    var h = '<div class="deur" data-deur="'+sleutel+'">';
    h += '<div class="deurkop" role="button" tabindex="0" aria-expanded="false">' +
         '<span class="dn">Mijn NLFR</span><span class="ds">leden</span>' +
         '<span class="dc">'+(groups ? aantal : "")+'</span>' +
         '<span class="dcaret">'+caretSvg+'</span></div>';
    h += '<div class="deurbody">';

    if (!groups) {
      // Niet ingelogd: de wervende tekst staat compact in deze kolom.
      var p = WERVING.punten.map(function(x){
        return '<div class="perk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'+x+'</div>';
      }).join("");
      h += '<div class="teaser"><h3>'+WERVING.kop+'</h3>' +
           '<p class="tsub">'+WERVING.onder+'</p>'+p+
           '<div class="btns">'+
           '<a class="btn-p" href="'+U("/main/authorization/signUp")+'" target="_parent">'+WERVING.knop+'</a>'+
           '<a class="btn-o" href="'+U("/main/authorization/signIn")+'" target="_parent">Meld je aan</a>'+
           '</div></div>';
    } else {
      h += groups.map(groepHTML).join("");
    }
    return h + '</div></div>';
  }

  // De smalle regel onder de balk. Eén databron (SNELRIJ), dus er kan geen
  // tweede lijst ontstaan die gaat afwijken. nederlanders.fr opent in het
  // bovenliggende venster, de zusterplatforms in een nieuw tabblad — dat regelt
  // tgt(), en het pijltje maakt dat verschil ook zichtbaar.
  function snelrijHTML(){
    return SNELRIJ.map(function(k){
      var t = tgt(k[1]), extern = (t === "_blank");
      return '<a class="sbl' + (extern ? " sbl-ext" : "") + '" href="' + k[1] + '" target="' + t + '"' +
             (extern ? ' rel="noopener"' : '') + '>' + k[0] +
             (extern ? '<span class="sbx">' + extSvg + '</span>' : '') + '</a>';
    }).join("");
  }

  function bouwSubbalk(){
    if (!subbalk) return;
    subbalk.innerHTML = snelrijHTML();
  }

  // De voetrij van het paneel. Op een BREED scherm alleen het kruisje: de vier
  // links staan dan al in de regel onder de balk, en twee keer hetzelfde in
  // beeld is geen wegwijzer maar ruis.
  //
  // Op een SMAL scherm staan ze hier. De regel onder de balk kostte daar 89px
  // op elke pagina van de site, want de vier links wikkelen naar twee regels,
  // en verticale ruimte is op een telefoon het schaarse goed. Ze zijn dus niet
  // verdwenen maar verhuisd: één tik op Menu en ze staan er.
  //
  // De grens is isNarrow(), dezelfde die het menu overal gebruikt. Een eigen
  // breekpunt zou een tweede drempel invoeren die bij de volgende wijziging uit
  // de pas gaat lopen met de eerste.
  function voetHTML(smal){
    return '<div class="paneelvoet">' +
           (smal ? '<div class="voetlinks">' + snelrijHTML() + '</div>' : '') +
           // Een knop die alleen een tekening is, heeft zonder aria-label voor
           // een schermlezer geen naam.
           '<button type="button" class="pknop sluitknop" id="sluitbtn" ' +
           'aria-label="Menu sluiten" title="Menu sluiten">' + kruisSvg + '</button>' +
           '</div>';
  }

  function bouwPaneel(){
    var h = '<div class="kolommen">' + DEUR_VOLGORDE.map(kolomHTML).join("") + '</div>';
    h += voetHTML(isNarrow());
    paneel.innerHTML = h;
    bindDeuren();
    var sluit = document.getElementById("sluitbtn");
    if (sluit) sluit.addEventListener("click", function(){ zetPaneel(false); });
  }

  // Accordeon: op mobiel één deur open tegelijk. Op desktop staan alle vijf de
  // kolommen open en doet de klasse niets (zie CSS).
  //
  // ALLEEN div.deurkop, niet a.deurkop. De vier link-ingangen dragen dezelfde
  // klasse voor de vormgeving, maar zijn een <a>: die moet navigeren en niet
  // ook nog een klapbeweging maken onder de vinger van de bezoeker.
  function bindDeuren(){
    Array.prototype.forEach.call(paneel.querySelectorAll(".deur > div.deurkop"), function(kop){
      function toggle(){
        var deur = kop.parentNode, wasOpen = deur.classList.contains("open");
        Array.prototype.forEach.call(paneel.querySelectorAll(".deur"), function(d){
          d.classList.remove("open");
          var k = d.querySelector(".deurkop");
          if (k) k.setAttribute("aria-expanded", "false");
        });
        if (!wasOpen) {
          deur.classList.add("open");
          kop.setAttribute("aria-expanded", "true");
        }
        report();
      }
      kop.addEventListener("click", toggle);
      kop.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });
  }

  function zetPaneel(open){
    if (open) sluitLade();
    if (open) meet("lade", "paneel"); // zie de meting onderaan dit script
    paneel.classList.toggle("open", open);
    menubtn.classList.toggle("active", open);
    menubtn.setAttribute("aria-expanded", open ? "true" : "false");
    // OP MOBIEL BEGINT ALLES DICHT. Hier stond: open de eerste ingang alvast,
    // zodat er iets te zien is. Dat was zinnig toen Lezen daar met zijn links
    // stond. Nu is de eerste ingang die nog openklapt Mijn NLFR, en die toont
    // een niet-ingelogde bezoeker 440 pixels wervende tekst — waardoor Nieuws
    // een halve schermlengte onder de vouw belandt. Vijf korte regels ZIJN het
    // overzicht; daar hoeft er geen van open te staan.
    report();
  }

  // ---- Lade (in-flow, één tegelijk) -------------------------------------
  var ladeNu = null;

  function sluitLade(){
    ladeNu = null;
    lade.classList.remove("open");
    [plaatsbtn, actueelbtn, adminbtn, menubtn].forEach(function(b){
      if (b === menubtn && !MSITE) return;
      b.classList.remove("active");
      b.setAttribute("aria-expanded", "false");
    });
  }

  // Welke kant de kaart onder zijn knop uitlijnt. "Nu actueel" en het tandwiel
  // staan rechts in de strip; hun kaart hangt daar met de rechterrand onder.
  var LADE_RECHTS = { actueel: 1, admin: 1 };
  var ladeKnop = null;

  // De kaart onder zijn eigen knop schuiven. Dit gebeurt met een MARGE, niet
  // met position:absolute: het iframe is precies zo hoog als het meldt en zou
  // alles buiten de documentstroom afknippen.
  function richtLade(){
    var kaart = lade.querySelector(".ladekaart");
    var pijl = lade.querySelector(".ladepijl");
    if (!kaart) return;
    kaart.style.marginLeft = "";
    if (pijl) pijl.style.marginLeft = "";
    if (isNarrow() || !ladeKnop || !ladeNu) return;   // mobiel: volle breedte

    var lr = lade.getBoundingClientRect();
    var cs = window.getComputedStyle ? window.getComputedStyle(lade) : null;
    var padL = cs ? (parseFloat(cs.paddingLeft) || 0) : 0;
    var padR = cs ? (parseFloat(cs.paddingRight) || 0) : 0;
    var links = lr.left + padL;
    var ruimte = lr.width - padL - padR;
    var kb = ladeKnop.getBoundingClientRect();
    var kw = kaart.getBoundingClientRect().width;

    var x = LADE_RECHTS[ladeNu] ? (kb.right - links - kw) : (kb.left - links);
    x = Math.max(0, Math.min(x, Math.max(0, ruimte - kw)));
    kaart.style.marginLeft = Math.round(x) + "px";

    if (pijl) {
      // Het pijltje wijst naar het midden van de knop, maar blijft binnen de
      // kaart (anders zweeft het los in de strook).
      var px = kb.left + kb.width / 2 - links - 7;
      px = Math.max(x + 12, Math.min(px, x + kw - 26));
      pijl.style.marginLeft = Math.round(px) + "px";
    }
  }

  function openLade(naam, knop){
    if (!naam || ladeNu === naam) { sluitLade(); report(); return; }
    sluitLade();
    if (naam !== "msite") zetPaneel(false);
    meet("lade", naam); // alleen bij OPENEN; sluiten valt hierboven al af
    ladeNu = naam;
    ladeKnop = knop || null;
    lade.innerHTML = ladeHTML(naam);
    lade.classList.add("open");
    if (knop) { knop.classList.add("active"); knop.setAttribute("aria-expanded", "true"); }
    richtLade();
    report();
  }

  // De twee kolommen achter "Plaats bericht".
  function plaatsHTML(){
    return '<div class="plaatskolommen">' + PLAATS_KOLOMMEN.map(function(k){
      return '<div class="plaatskolom">' +
        '<h4>' + k.kop + '</h4>' +
        '<span class="pil ' + k.pil + '">' + k.label + '</span>' +
        '<p>' + esc(k.tekst) + '</p>' +
        '<a class="plaatsknop" href="' + k.url + '" target="_parent">' + k.knop + '</a>' +
      '</div>';
    }).join("") + '</div>';
  }

  // De inhoud van een lade, altijd in een kaart met een pijltje naar de knop.
  function ladeHTML(naam){
    var binnen = ladeInhoud(naam);
    if (binnen == null) return "";
    if (naam === "msite") return '<div class="ladekaart msite">' + binnen + '</div>';
    return '<div class="ladepijl"></div><div class="ladekaart ' + naam + '">' + binnen + '</div>';
  }

  function ladeInhoud(naam){
    if (naam === "plaats") return plaatsHTML();
    if (naam === "actueel") return actueelHTML();
    if (naam === "admin") {
      return '<span class="h">Beheer</span>' + ADMIN_LINKS.map(function(l){
        return link(l[1], l[0], l[2]);
      }).join("");
    }
    if (naam === "msite") return msiteHTML();
    return null;
  }

  // ---- "Nu actueel" — pill-knoppen uit actueel.json ----------------------
  // Twee vormen, gestuurd door het veld "vorm" in actueel.json: een ontbrekend
  // veld of "pill" geeft een bordeaux knop, "tekst" een klein tekstlinkje
  // eronder. Het stipje hoort bij de knop en niet bij het linkje: het meldt dat
  // er achter die knop iets bijgewerkt is, en een tekstlinkje naar een
  // aanmeldformulier heeft niets wat live kan zijn.
  function actueelLink(k){
    var href = (k && k.href) ? String(k.href) : "#";
    var t = tgt(href), rel = (t === "_blank") ? ' rel="noopener"' : '';
    var titel = (k && k.tekst) ? ' title="' + esc(k.tekst) + '"' : '';
    var tekstvorm = !!(k && k.vorm === "tekst");
    var klasse = tekstvorm ? "nal" : "nap";
    var stip = (!tekstvorm && k && k.live) ? '<span class="dot live" aria-hidden="true"></span>' : '';
    return '<a class="' + klasse + '" href="' + esc(href) + '" target="' + t + '"' + rel + titel + '>' +
           stip + ((k && k.titel) || "") + '</a>';
  }
  function actueelHTML(){
    var kop = '<span class="h">Nu actueel</span>';
    if (ACTUEEL === null) return kop + '<span class="leeg">wordt geladen…</span>';
    var items = (ACTUEEL.kaarten || []);
    if (!items.length) return kop + '<span class="leeg">op dit moment niets bijzonders</span>';
    return kop + items.map(actueelLink).join("");
  }
  function laadActueel(){
    var klaar = function(j){
      ACTUEEL = (j && typeof j === "object") ? j : { kaarten: [] };
      var dot = document.getElementById("actueeldot");
      if (dot) dot.classList.toggle("live", (ACTUEEL.kaarten || []).some(function(k){ return k && k.live; }));
      // Alleen de inhoud van de kaart verversen; de kaart en zijn pijltje
      // blijven staan waar richtLade() ze heeft neergezet.
      if (ladeNu === "actueel") {
        var kaart = lade.querySelector(".ladekaart");
        if (kaart) { kaart.innerHTML = actueelHTML(); richtLade(); }
        report();
      }
    };
    var haal = function(url){ return fetch(url, { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }); };
    haal(ACTUEEL_URL)
      .then(function(j){ return j || haal(ACTUEEL_FALLBACK); })
      .catch(function(){ return haal(ACTUEEL_FALLBACK).catch(function(){ return null; }); })
      .then(klaar, function(){ klaar(null); });
  }

  // ---- Banner ------------------------------------------------------------
  // De opmaak komt uit lib/banner.js, hetzelfde bestand dat /banner-beheer
  // voor zijn voorbeeld gebruikt — zo kan het voorbeeld niet gaan afwijken van
  // wat het menu toont. Lukt het laden of ophalen niet, of staat de banner uit,
  // dan komt er simpelweg geen banner en blijft het menu ongestoord.
  function laadModule(src){
    return new Promise(function(klaar, mislukt){
      var s = document.createElement("script");
      s.type = "module";
      s.src = src;
      s.onload = function(){ window.NLFR_BANNER ? klaar() : mislukt(); };
      s.onerror = mislukt;
      document.head.appendChild(s);
    });
  }
  function bannerModule(){
    if (window.NLFR_BANNER) return Promise.resolve();
    return laadModule(BANNER_MODULE).catch(function(){ return laadModule(BANNER_MODULE_FALLBACK); });
  }

  function toonBanner(record){
    var host = document.getElementById("bannerhost");
    if (!host || !window.NLFR_BANNER) return;
    var html = window.NLFR_BANNER.bannerHTML(record);
    if (!html) { host.innerHTML = ""; report(); return; }

    // De CSS van de banner één keer injecteren, uit hetzelfde bestand.
    if (!document.getElementById("bnrcss")) {
      var st = document.createElement("style");
      st.id = "bnrcss";
      st.textContent = window.NLFR_BANNER.BANNER_CSS;
      document.head.appendChild(st);
    }
    host.innerHTML = html;

    // De [?]-uitleg is een IN-FLOW blok onder de banner: geen window.open en
    // geen overlay, want in een iframe met hoogte-sync wordt een overlay
    // afgeknipt. Escape sluit hem, net als nogmaals op [?] tikken.
    var vraag = document.getElementById("bnrvraag");
    var uitleg = document.getElementById("bnruitleg");
    var knop = document.getElementById("bnrknop");
    function zetUitleg(open){
      if (!uitleg) return;
      uitleg.hidden = !open;
      if (vraag) vraag.setAttribute("aria-expanded", open ? "true" : "false");
      report();
    }
    if (vraag && uitleg) vraag.addEventListener("click", function(){ zetUitleg(uitleg.hidden); });
    if (knop && uitleg) knop.addEventListener("click", function(){ zetUitleg(uitleg.hidden); });
    report();
  }

  function laadBanner(){
    var haal = function(url){ return fetch(url, { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }); };
    Promise.all([
      bannerModule().then(function(){ return true; }, function(){ return false; }),
      haal(BANNER_URL).catch(function(){ return null; })
        .then(function(j){ return j || haal(BANNER_FALLBACK).catch(function(){ return null; }); })
    ]).then(function(uit){
      if (!uit[0] || !uit[1]) return;   // geen module of geen record: geen banner
      toonBanner(uit[1]);
    }, function(){});
  }

  // ---- /m: de korte lijst achter de hamburger ---------------------------
  var MSITE_ICONS = {
    mobiel: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
    schijn: '<path d="M12 3l2.4 6.2L21 11l-6.6 1.8L12 19l-2.4-6.2L3 11l6.6-1.8z"/>',
    foto: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-4 4 3 3-2 4 3"/>',
    plaats: '<path d="M12 5v14M5 12h14"/>',
    nieuws: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h7M7 13h10M7 16h6"/>',
    zoek: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    mijn: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4S18.1 16.4 19.5 20"/>',
    hulp: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.4v.4"/><path d="M12 17h.01"/>',
    diensten: '<path d="M4 7h16v12H4z"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>',
    verenig: '<circle cx="9" cy="9" r="3"/><path d="M3.5 19c.9-2.7 2.9-4.2 5.5-4.2S13.6 16.3 14.5 19"/><path d="M16 6.5a3 3 0 0 1 0 5.8M17.5 19c-.3-1.4-.8-2.5-1.5-3.3"/>'
  };
  function ico(k){ return '<span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (MSITE_ICONS[k] || "") + '</svg></span>'; }
  function mrij(href, icon, label, sub){
    var t = tgt(href), rel = (t === "_blank") ? ' rel="noopener"' : '';
    return '<a href="' + href + '" target="' + t + '"' + rel + '>' + ico(icon) + '<span>' + label + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</span></a>';
  }
  function msiteHTML(){
    var h = '<div class="mlijst">';
    h += mrij("https://www.nederlanders.fr/m?id=3295325%3AMobilePage%3A1374046", "mobiel", "NLFR Mobiel", "De mobiele startpagina");
    h += mrij(U("/profiles/blog/list?promoted=1"), "schijn", "In de schijnwerpers", "Uitgelichte berichten");
    h += mrij(U("/page/dagelijks-frankrijknieuws"), "nieuws", "Frankrijknieuws", "Dagelijks bijgewerkt");
    h += mrij(U("/profiles/blog/list"), "zoek", "Alle berichten", "Het hele forum");
    h += mrij(U("/photo"), "foto", "Foto's");
    h += '<div class="sep">Zelf doen</div>';
    h += mrij(U("/profiles/blog/new"), "plaats", "Plaats een bericht");
    h += mrij(isMember ? myPage : U("/main/authorization/signIn"), "mijn", isMember ? "Mijn pagina" : "Meld je aan", isMember ? "" : "of word gratis lid");
    h += '<div class="sep">Handig</div>';
    h += mrij(U("/page/diensten"), "diensten", "Diensten");
    h += mrij(U("/page/nederlandse-verenigingen-in-frankrijk"), "verenig", "NL-verenigingen");
    h += mrij(U("/page/hulpverlening-in-frankrijk"), "hulp", "Hulp vinden");
    h += '<a class="full" href="' + U("/") + '" target="_parent">Naar de volledige website</a>';
    return h + '</div>';
  }

  // ---- Knoppen -----------------------------------------------------------
  menubtn.addEventListener("click", function(){
    if (MSITE) { openLade(ladeNu === "msite" ? null : "msite", menubtn); return; }
    zetPaneel(!paneel.classList.contains("open"));
  });
  plaatsbtn.addEventListener("click", function(){ openLade("plaats", plaatsbtn); });
  actueelbtn.addEventListener("click", function(){ openLade("actueel", actueelbtn); });
  adminbtn.addEventListener("click", function(){ openLade("admin", adminbtn); });

  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    var uitleg = document.getElementById("bnruitleg");
    if (uitleg && !uitleg.hidden) {
      uitleg.hidden = true;
      var vraag = document.getElementById("bnrvraag");
      if (vraag) vraag.setAttribute("aria-expanded", "false");
      report();
      return;
    }
    if (ladeNu) { sluitLade(); report(); return; }
    if (paneel.classList.contains("open")) zetPaneel(false);
  });

  function syncAdmin(){ adminbtn.classList.toggle("show", isAdmin); }
  syncAdmin();

  // ---- Mobiel: zoekveld in/uitklappen -----------------------------------
  var loep = document.getElementById("loepbtn"), sform = document.getElementById("searchform");
  loep.addEventListener("click", function(){
    var open = !sform.classList.contains("open");
    sform.classList.toggle("open", open);
    loep.classList.toggle("active", open);
    loep.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) { var i = document.getElementById("q"); if (i) i.focus(); }
    report();
  });

  // ---- Zoeken ------------------------------------------------------------
  var q = document.getElementById("q"), wis = document.getElementById("wis");
  function doeZoek(){
    var v = q.value.trim();
    if (!v) return;
    var url = ZOEK_APP + encodeURIComponent(v);
    try { window.top.location.href = url; } catch(e) { window.open(url, "_blank", "noopener"); }
  }
  sform.addEventListener("submit", function(e){ e.preventDefault(); doeZoek(); });
  q.addEventListener("input", function(){ wis.classList.toggle("show", q.value.length > 0); });
  wis.addEventListener("click", function(){ q.value = ""; wis.classList.remove("show"); q.focus(); });

  // ---- Profiel-ontvangst (cross-origin, vanuit embedcode op nederlanders.fr) ----
  window.addEventListener("message", function(e){
    if (e.origin !== PARENT_ORIGIN) return;
    if (!e.data || !("nlfrProfile" in e.data)) return;
    setProfile(e.data.nlfrProfile);
    syncAdmin();
    var wasOpen = paneel.classList.contains("open");
    bouwPaneel();
    if (wasOpen) paneel.classList.add("open");
    if (ladeNu) { lade.innerHTML = ladeHTML(ladeNu); richtLade(); }
    report();
  });

  // ---- Herbouwen bij wisseling mobiel <-> breed (draaien van het toestel) ----
  if (window.matchMedia) {
    var mq = window.matchMedia(MOBILE_MQ);
    var bijWissel = function(){
      applyCompact();
      var wasOpen = paneel.classList.contains("open");
      // WELKE INGANG STOND OPEN. bouwPaneel() tekent het paneel opnieuw, en
      // daarmee verdween de stand van de accordeon: wie zijn telefoon draaide
      // terwijl "Vinden" openstond, keek daarna naar vijf dichte regels en moest
      // opnieuw zoeken waar hij was. Draaien mag de stand niet verstoren.
      var deurEl = paneel.querySelector(".deur.open");
      var openDeur = deurEl ? deurEl.getAttribute("data-deur") : null;
      bouwPaneel();
      if (wasOpen) paneel.classList.add("open");
      if (openDeur) {
        var terug = paneel.querySelector('.deur[data-deur="' + openDeur + '"]');
        if (terug) {
          terug.classList.add("open");
          var kop = terug.querySelector(".deurkop");
          if (kop) kop.setAttribute("aria-expanded", "true");
        }
      }
      richtLade();
      report();
    };
    if (mq.addEventListener) mq.addEventListener("change", bijWissel);
    else if (mq.addListener) mq.addListener(bijWissel);
  }

  // ---- Meting: wat er in dit menu gebruikt wordt --------------------------
  // Drie dingen gaan naar /api/meting: dat het menu getoond is, dat een lade of
  // het paneel openging, en welke ingang is aangeklikt. Dagtotalen, meer niet.
  // Geen cookie, geen sessie, geen identiteit, en ook niet op welke pagina het
  // menu stond. Zie lib/meting.js voor wat er aan de andere kant mee gebeurt.
  //
  // De weergave is de noemer en daarom het belangrijkste getal: zonder haar is
  // een daling van de kliks niet te onderscheiden van gewoon minder bezoek.
  //
  // Meten mag dit menu nooit breken. Alles hieronder staat in een try, en een
  // mislukte verzending blijft stil: voor de bezoeker valt er niets te
  // herstellen, en dit iframe staat op elke pagina van de site.
  var MEET_URL = "/api/meting";
  var meetRij = [];

  function meetDoel(href){
    // Een lege href verwijst naar de pagina zelf en een kale "#" nergens heen.
    // Zonder deze afslag zou zo'n link als bestemming het menu-iframe zelf
    // opleveren, en dat is geen ingang die iemand gekozen heeft.
    var ruw = String(href == null ? "" : href).trim();
    if (!ruw || ruw.charAt(0) === "#") return "";
    var u;
    try { u = new URL(ruw, location.href); } catch (e) { return ""; }
    if (u.protocol !== "http:" && u.protocol !== "https:") return "";
    var host = u.hostname.replace(/^www\./, "");
    var pad = u.pathname.replace(/\/+$/, "");
    if (host === "nederlanders.fr") {
      // De ankerlink naar de activiteitenstroom is een eigen bestemming; zonder
      // het anker zouden alle homepage-ingangen op één hoop belanden.
      return "nlfr" + pad + (u.hash ? "~" + u.hash.slice(1) : "");
    }
    // Bij externe bestemmingen is de host het antwoord op "waar ging hij heen";
    // twee padstukken erbij houdt het herkenbaar zonder de id op te blazen.
    return host + pad.split("/").slice(0, 3).join("/");
  }

  function meetZone(a){
    var kaart = a.closest(".ladekaart");
    if (kaart) {
      var naam = "";
      for (var i = 0; i < kaart.classList.length; i += 1) {
        if (kaart.classList[i] !== "ladekaart") { naam = kaart.classList[i]; break; }
      }
      return "lade-" + (naam || "onbekend");
    }
    if (a.closest(".paneel")) return "paneel";
    if (a.closest(".subbalk")) return "subbalk";
    if (a.closest(".strip")) return "strip";
    // De banner staat buiten al die vlakken en is wél een ingang met een eigen
    // bedoeling. Zonder een eigen zone zou hij in "overig" belanden, en dat is
    // de bak voor wat we niet thuis kunnen brengen: dan telt een wervende knop
    // mee in het doorklikcijfer zonder dat iemand weet dat hij erin zit.
    if (a.closest("#bannerhost")) return "banner";
    return "overig";
  }

  function meet(soort, id){
    try { meetRij.push({ soort: soort, id: id }); } catch (e) { /* stil */ }
  }

  function meetSpoel(){
    if (!meetRij.length) return;
    var lading = JSON.stringify({ gebeurtenissen: meetRij });
    meetRij = [];
    try {
      // text/plain, geen application/json: dat laatste is geen CORS-veilig type
      // en zou een preflight vragen die sendBeacon niet kan sturen. De route
      // leest de body zelf, ongeacht wat er boven staat.
      var blok = new Blob([lading], { type: "text/plain;charset=UTF-8" });
      if (navigator.sendBeacon && navigator.sendBeacon(MEET_URL, blok)) return;
      fetch(MEET_URL, { method: "POST", body: lading, keepalive: true }).catch(function(){});
    } catch (e) { /* meten mag het menu niet in de weg zitten */ }
  }

  // Een klik betekent meestal wegnavigeren, dus die gaat er meteen uit;
  // sendBeacon overleeft dat. De rest gaat mee als de pagina verdwijnt.
  document.addEventListener("click", function(e){
    var el = e && e.target;
    if (!el || typeof el.closest !== "function") return;
    var a = el.closest("a[href]");
    if (!a) return;
    var doel = meetDoel(a.getAttribute("href"));
    if (!doel) return;
    meet("klik", meetZone(a) + "/" + doel);
    meetSpoel();
  });
  window.addEventListener("pagehide", meetSpoel);
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") meetSpoel();
  });

  // ---- Opstarten ---------------------------------------------------------
  meet("weergave");
  bouwSubbalk();
  bouwPaneel();
  laadActueel();
  laadBanner();

  window.addEventListener("load", report);
  window.addEventListener("resize", function(){ richtLade(); report(); });
  report();
})();
</script>
</body>
